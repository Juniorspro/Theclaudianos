      if(this.fuenteTema!==T)this.ponerPista(T);

   Base de tango: el bajo en ritmo de habanera, el piano marcando los cuatro tiempos, un
   bandoneón (dos osciladores desafinados, filtrados, con ataque blando) que lleva la
   melodía, y en los temas nocturnos un colchón de cuerdas. Melodías propias. */
var _=null;
function pasoTango(S,p,t){
  var T=TEMAS[S.tema], M=S.busM, n16=p%16, comp=Math.floor(p/16)%T.prog.length;
  var ac=T.prog[comp], raiz=ac[0], dur=S.dur();
  if(T.pad&&n16===0)ac.forEach(function(m){
    [-8,8].forEach(function(det){S.tono({f:S.midi(m+12),det:det,dur:dur*16,vol:T.pad,tipo:'sawtooth',bus:M,t:t,at:dur*4,filtro:T.filtroPad||1200,sala:true});});
  });
  var b=T.bajo[n16];
  if(b){
    var nb=b===1?raiz:b===2?raiz+7:raiz+12;
    S.tono({f:S.midi(nb-24),dur:dur*1.6,vol:0.2,tipo:'triangle',bus:M,t:t,filtro:600});
    S.tono({f:S.midi(nb-12),dur:dur*1.2,vol:0.05,tipo:'sawtooth',bus:M,t:t,filtro:900});
  }
  if(T.piano[n16]){      /* el marcato: el acorde entero, corto y seco */
    ac.forEach(function(m){S.tono({f:S.midi(m+12),dur:dur*(T.piano[n16]===2?2.2:0.8),vol:T.volPiano,tipo:'triangle',bus:M,t:t,filtro:3200,sala:true});});
  }
  var ml=T.mel[(comp*16+n16)%T.mel.length];
  if(ml!==null&&ml!==undefined){       /* el bandoneón */
    var f=S.midi(raiz+12+ml);
    S.tono({f:f,det:-7,dur:dur*T.largoMel,vol:T.volMel,tipo:'sawtooth',bus:M,t:t,at:0.035,filtro:1900,sala:true});
    S.tono({f:f,det:7,dur:dur*T.largoMel,vol:T.volMel*0.7,tipo:'square',bus:M,t:t,at:0.035,filtro:1500,sala:true});
  }
  if(T.arp&&T.arp[n16]){var an=ac[(n16>>1)%3]+24;S.tono({f:S.midi(an),dur:dur*0.8,vol:T.volArp,tipo:'sine',bus:M,t:t,sala:true});}
  if(T.bombo[n16])S.tono({f:140,f2:44,dur:0.18,vol:T.volBombo||0.28,tipo:'sine',bus:M,t:t});
  if(T.caja[n16])S.soplo({f:2600,f2:900,dur:0.11,vol:0.12,tipo:'bandpass',q:1.1,bus:M,t:t,sala:true});
  if(T.plato&&T.plato[n16])S.soplo({f:8000,f2:6000,dur:0.03,vol:0.03,tipo:'highpass',bus:M,t:t,sala:false});
  /* el golpe de caja del tango: la mano en la madera del contrabajo */
  if(T.chasquido&&T.chasquido[n16])S.soplo({f:1400,f2:700,dur:0.04,vol:0.1,tipo:'bandpass',q:4,bus:M,t:t,sala:false});
}

function suave(t){return t*t*(3-2*t);}

  dest=dest||{};
  for(var i=0;i<CLAVES_POSE.length;i++){var k=CLAVES_POSE[i];dest[k]=a[k]+(b[k]-a[k])*t;}
  return dest;

function mover(p,a,l){return{x:p.x+Math.sin(a)*l,y:p.y+Math.cos(a)*l};}

  var cad={x:0,y:-(m+pi)};

  var hom={x:cad.x+Math.sin(P.tor)*to*0.88,y:cad.y-Math.cos(P.tor)*to*0.88};
  var hF={x:hom.x+2*s,y:hom.y}, hT={x:hom.x-3*s,y:hom.y+1};
  var cF=mover(hF,P.bFs,br), mF=mover(cF,P.bFs+P.bFc,an);

  var rT=mover(cdT,P.pTm,m), pT=mover(rT,P.pTm-P.pTr,pi);
  var E={s:s,cad:cad,pecho:pecho,cab:cab,ang:ca,hom:hom,hF:hF,hT:hT,cF:cF,mF:mF,cT:cT,mT:mT,
    cdF:cdF,cdT:cdT,rF:rF,pF:pF,rT:rT,pT:pT,angF:P.bFs+P.bFc,angT:P.bTs+P.bTc,tor:P.tor};
  var nombres=['cad','pecho','cab','hom','hF','hT','cF','mF','cT','mT','cdF','cdT','rF','pF','rT','pT'];
  if(P.giro){
    var c=Math.cos(P.giro), sn=Math.sin(P.giro);
    nombres.forEach(function(n){var q=E[n], x=q.x-cad.x, y=q.y-cad.y;E[n]={x:cad.x+x*c-y*sn,y:cad.y+x*sn+y*c};});
    E.ang+=P.giro;E.angF+=P.giro;E.angT+=P.giro;E.tor+=P.giro;
  }
  /* en el piso: se baja o se sube todo hasta que el pie más bajo toque el suelo */
  if(enSuelo){
    var maxY=Math.max(E.pF.y,E.pT.y);
    if(Math.abs(P.giro)>0.6)nombres.forEach(function(n){maxY=Math.max(maxY,E[n].y+(n==='cab'?ESQ.cabeza*s:4*s));});
    nombres.forEach(function(n){E[n]={x:E[n].x,y:E[n].y-maxY};});
  }
  return E;
}
/* una cápsula que se afina: brazos, piernas, cuellos */
function capsula(g,a,b,r1,r2){
  var dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l, an=Math.atan2(dy,dx);
  g.beginPath();
  g.moveTo(a.x+nx*r1,a.y+ny*r1);g.lineTo(b.x+nx*r2,b.y+ny*r2);
  g.arc(b.x,b.y,r2,an+Math.PI/2,an-Math.PI/2,true);
  g.lineTo(a.x-nx*r1,a.y-ny*r1);
  g.arc(a.x,a.y,r1,an-Math.PI/2,an+Math.PI/2,true);
  g.closePath();
}
function miembro(g,a,b,r1,r2,col,colS){
  capsula(g,a,b,r1,r2);g.fillStyle=col;g.fill();
  var dx=b.x-a.x, dy=b.y-a.y, l=Math.hypot(dx,dy)||1, nx=-dy/l*0.42, ny=dx/l*0.42;
  capsula(g,{x:a.x-nx*r1,y:a.y-ny*r1},{x:b.x-nx*r2,y:b.y-ny*r2},r1*0.55,r2*0.55);g.fillStyle=colS;g.fill();
  capsula(g,a,b,r1,r2);g.stroke();
}
function forma(g,pts,col,colS,sombra){
  g.beginPath();g.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);
  g.closePath();g.fillStyle=col;g.fill();
  if(sombra){g.save();g.clip();g.fillStyle=colS;g.beginPath();sombra();g.fill();g.restore();
    g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(var j=1;j<pts.length;j++)g.lineTo(pts[j].x,pts[j].y);g.closePath();}
  g.stroke();
}
function lerpP(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
function circ(g,x,y,r,col){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=col;g.fill();g.stroke();}

/* la cara, de tres cuartos mirando para adelante: la expresión cambia con lo que pasa */
function cabezaLobo(g,E,L,exp,t){

function cara(g,E,L,exp,parp){
  var s=E.s, c=E.cab, r=ESQ.cabeza*s;

  g.beginPath();g.ellipse(0,0,r*0.95,r*1.05,0,0,TAU);g.fillStyle=L.piel;g.fill();
  g.save();g.clip();g.fillStyle=L.pielS;g.beginPath();g.ellipse(-r*0.75,r*0.2,r*0.6,r*1.2,0,0,TAU);g.fill();g.restore();

    else{g.fillStyle='#fff';g.beginPath();g.arc(ex+r*0.13,ey-r*0.08,r*0.05,0,TAU);g.fill();}
  }
  /* ceja: la actitud entera está en la ceja */
  g.lineWidth=2.4;g.beginPath();
  if(exp==='grito'){g.moveTo(ex-r*0.3,ey-r*0.42);g.lineTo(ex+r*0.3,ey-r*0.28);}

  else{g.beginPath();g.moveTo(r*0.35,r*0.46);g.quadraticCurveTo(r*0.55,r*0.52,r*0.72,r*0.4);g.stroke();}
  g.lineWidth=2.6;
  g.restore();
}

/* el torso con su ropa. Va entre la pierna de atrás y la de adelante */
function tronco(g,E,L,id,t){
  var s=E.s, gr=L.grosor, a=E.hom, c=E.cad, w=11*s*gr, w2=9*s*gr;
  var dx=Math.cos(E.tor), dy=Math.sin(E.tor);           /* perpendicular al torso */
  var pts=[{x:a.x+dx*w,y:a.y+dy*w},{x:c.x+dx*w2,y:c.y+dy*w2},{x:c.x-dx*w2,y:c.y-dy*w2},{x:a.x-dx*w*1.05,y:a.y-dy*w*1.05}];
  if(id==='morocha'){

/* el dron-colectivo que acompaña al pibe: flota atrás del hombro */

/* ---------------- los sprites pintados (Rezona): 12 cuadros por luchador ----------------
   Un atlas por luchador (sprites-<id>) y SPR_META con [x,y,w,h,anclaX] de cada cuadro; el ancla
   de abajo son los pies. Si el atlas no llegó, se dibuja el títere de siempre. */
var SPR_META=null;
/* de la pose de la animación al cuadro pintado */
var CUADRO_DE={guardia:'guardia',jabPrep:'prepGolpe',patPrep:'prepPatada',fuertePrep:'prepGolpe',dashAtras:'guardia',
  jab:'golpe',cruz:'golpe',gancho:'golpe',cuerpo:'golpe',aerea1:'golpe',giro2:'golpe',
  patMedia:'patada',patAlta:'patada',aerea2:'patada',aerea3:'patada',giro1:'patada',
  patBaja:'barrida',barrida:'barrida',alzadaPrep:'barrida',alzada:'alzada',
  fuerte:'especial',azote:'especial',salto:'salto',bloqueo:'bloqueo',golpeado:'golpeado',
  caido:'caido',dash:'dash',victoria:'victoria',aireG:'volando'};
function cuadroSprite(F){
  switch(F.est){
    case 'bloqueo':return 'bloqueo';
    case 'dash':return 'dash';
    case 'salto':case 'entra':return 'salto';
    case 'golpeado':return 'golpeado';
    case 'aireG':return F.ko&&F.enSuelo?'caido':'volando';
    case 'caido':case 'ko':return 'caido';
    case 'levanta':return F.tEst<0.12?'caido':'levanta';
    case 'camina':var ph=Math.floor(F.t*7)%4;return ph===0?'paso1':ph===2?'paso2':'guardia';
    case 'super':return 'especial';
    case 'victoria':return 'victoria';
    case 'rafaga':return (Math.floor(F.rafaga.t*14)%2)?'patada':'golpe';
    case 'ataque':
      if(!F.mov)return 'guardia';
      if(F.tBusca>0&&F.fr<1)return 'dash';      /* el especial que corre hasta el rival */
      var k=F.mov.k, nm=k[0][1];

      return CUADRO_DE[nm]||'guardia';

/* un lienzo chico de trabajo: el cuadro recortado en blanco (destello y estela) */
var LIENZO_BL=null;
function silueta(im,c,col){

/* si falta un cuadro (hoja c sin llegar), el más parecido */
var CUADRO_RESPALDO={paso1:'guardia',paso2:'guardia',prepGolpe:'guardia',prepPatada:'guardia',levanta:'barrida',volando:'golpeado'};
function cuadroDe(md,nom){return md.f[nom]||md.f[CUADRO_RESPALDO[nom]]||md.f.guardia;}
/* ---------------- las animaciones de 24 cuadros ----------------
   Cada una sale de un video: respirar y caminar son ciclos; los golpes se recorren al ritmo del
   movimiento (cuadro = avance del golpe × 24), así el golpe del dibujo coincide con el del juego. */
var ANIM_PIERNA=/^pat|giro|rodilla/, ANIM_BRAZO=/^(jab|cruz|gancho|cuerpo)$/;
/* qué video es cada especial: en La Parca y Colectivo el "especial" filmado es el segundo */
var ANIM_ESP={parca:['especial2','especial'],colectivo:['especial2','especial']};
function animDe(F){
  var am=ANIM_META&&ANIM_META[F.l], A=am&&am.a;
  if(!A)return null;
  var n=null, p=0, e=F.est, T=function(x){return A[x]?x:null;};
  if(e==='guardia')n=T('idle'),p=(F.t*0.85)%1;
  else if(e==='camina'){n=T('caminar');p=(F.t*1.1)%1;if((F.vx||0)*F.f<0)p=1-p;}
  else if(e==='ataque'&&F.mov){
    var m=F.mov, nm=F.movNom||'';
    if(F.tBusca>0&&F.fr<1){n=T('dash');p=(F.t*1.6)%1;}
    else {
      p=lim(F.fr/m.dur,0,0.999);
      if(m.tipo==='sup'){n=T('super');p=0.3+p*0.7;}
      else if(m.tipo==='esp'){var par=ANIM_ESP[F.l]||['especial','especial2'];n=T(nm===F.L.esp[0].id?par[0]:par[1])||T('especial');}
      else if(nm==='fuerte')n=T('fuerte')||T('golpe');
      else if(nm==='alzada')n=T('alzada');
      else if(nm==='barrida'||nm==='patBaja')n=T('barrida');
      else if(/^aerea|azote/.test(nm)){n=T('aereo');if(nm==='azote')p=0.5+p*0.5;}
      else if(ANIM_PIERNA.test(nm))n=T('patada');
      else if(ANIM_BRAZO.test(nm))n=T('golpe');
    }
  }
  else if(e==='salto'||e==='entra'){n=T('salto');p=lim(0.22+0.56*((F.vy||0)+720)/1440,0.05,0.95);}
  else if(e==='bloqueo'){n=T('bloqueo');p=Math.min(0.5,0.08+F.tEst*2.2)+(F.tEst>0.2?Math.sin(F.t*6)*0.03:0);}
  else if(e==='dash'){n=T('dash');p=(F.tEst/0.26*0.6)%1;}
  else if(e==='dashAtras'){n=T('atras');p=lim(F.tEst/0.3,0,0.999);}
  else if(e==='golpeado'){n=T('golpeado');p=lim(F.tEst/0.5,0,0.999);}
  else if(e==='aireG'&&!F.enSuelo){n=T('volando');p=lim(F.tEst/0.9*0.72,0,0.72);}
  else if(e==='caido'||(e==='ko'&&F.enSuelo)||(e==='aireG'&&F.enSuelo)){n=T('caida');p=lim(0.55+F.tEst/0.4*0.45,0,0.999);}
  else if(e==='levanta'){n=T('levanta');p=lim(F.tEst/0.35,0,0.999);}
  else if(e==='victoria'){n=T('victoria');p=lim(F.tEst/1.4,0,0.999);}
  else if(e==='super'){n=T('super');p=lim(F.tEst/1.1*0.3,0,0.3);}
  else if(e==='rafaga'){n=T('super');p=0.3+0.65*((F.rafaga.t*1.3)%1);}
  if(!n)return null;
  var im=imgAnim(F.l);if(!im)return null;
  var f=A[n][Math.min(23,Math.floor(lim(p,0,0.999)*24))];if(!f)return null;
  /* al formato de los cuadros sueltos: [x,y,w,h,anclaX,anclaY] */
  return {im:im,c:[f[0],f[1],f[2],f[3],-f[4],-f[5]],alto:am.alto,nom:n};
}
function dibujarSprite(g,F,t,escala){
  var md=SPR_META&&SPR_META[F.l], im=IMG['sprites-'+F.l];
  if(!md||!im)return false;
  var L=LUCH[F.l], nom=cuadroSprite(F), c=cuadroDe(md,nom), ahora=Date.now();
  var an=animDe(F), altoRef=md.alto;
  if(an){im=an.im;c=an.c;altoRef=an.alto;nom='anim:'+an.nom;}
  var S=F.spr||(F.spr={nom:nom,ant:null,tCambio:0,suelo:F.enSuelo,tSuelo:0,tAire:0,estela:[],tEst:0});
  if(S.nom!==nom){S.ant=S.nom;S.nom=nom;S.tCambio=ahora;}
  if(F.enSuelo&&!S.suelo)S.tSuelo=ahora;           /* cae: se aplasta */
  if(!F.enSuelo&&S.suelo)S.tAire=ahora;            /* salta: se estira */
  S.suelo=F.enSuelo;
  /* la guardia pintada mide lo que el títere parado: 142 unidades por la altura del luchador */

  if(F.est==='camina'&&!an)dy=-Math.abs(Math.sin(F.t*9))*3;
  if(F.l==='parca'&&F.enSuelo&&nom!=='caido')dy-=5+Math.sin(t*2.5)*3;
  var dC=(ahora-S.tCambio)/1000;
  /* el cuadro de golpe entra con un tirón hacia adelante: estira y avanza, después asienta */
  if(!an&&dC<0.1&&/golpe|patada|especial|alzada|barrida/.test(nom)){var kp=1-dC/0.1;sx*=1+0.1*kp;sy*=1-0.04*kp;dx+=10*kp;}
  var dS=(ahora-S.tSuelo)/1000; if(dS<0.14){var ka=1-dS/0.14;sx*=1+0.12*ka;sy*=1-0.14*ka;}
  var dA=(ahora-S.tAire)/1000; if(!F.enSuelo&&dA<0.16){var kz=1-dA/0.16;sx*=1-0.06*kz;sy*=1+0.1*kz;}
  if(nom==='golpeado'||nom==='anim:golpeado'){var kg=Math.max(0,1-F.tEst/0.25);rot=-0.14*kg;dx-=6*kg;}
  if(!an&&(nom==='volando'||F.est==='aireG'))rot=lim(-(F.vy||0)/1400,-0.45,0.45);
  if(!an&&F.est==='salto'&&nom==='salto')rot=lim((F.vx||0)*F.f/3000,-0.12,0.12);
  if(!an&&F.est==='dash')rot=0.08;
  /* durante el congelado del golpe, el que lo recibe tiembla */
  if(FX.congelado>0&&(F.est==='golpeado'||F.est==='aireG'))dx+=(az()-0.5)*7;
  /* la estela: copias que se apagan detrás en los movimientos rápidos */
  var rapido=F.est==='dash'||F.est==='super'||F.est==='rafaga'||(F.est==='ataque'&&F.mov&&(F.mov.tipo==='esp'||F.mov.tipo==='sup'))||(F.est==='aireG'&&F.combo>2);
  S.tEst+=1;
  if(rapido&&S.tEst%2===0)S.estela.push({c:c,im:im,k:k,x:F.x,y:F.y+dy,f:F.f,sx:sx,sy:sy,rot:rot,t:ahora});
  while(S.estela.length&&(S.estela.length>6||ahora-S.estela[0].t>220))S.estela.shift();
  var colE=F.mov&&F.mov.color?F.mov.color:(ELEM[F.elem]?ELEM[F.elem].col:'255,255,255');
  g.save();
  if(F.enSuelo){g.fillStyle='rgba(0,0,0,0.3)';g.beginPath();g.ellipse(F.x,F.y,34*L.alto*L.grosor,6,0,0,TAU);g.fill();}
  else{var alt=Math.max(0,ESC.suelo-F.y);g.fillStyle='rgba(0,0,0,'+(0.28*Math.max(0.2,1-alt/300)).toFixed(3)+')';
    g.beginPath();g.ellipse(F.x,ESC.suelo,30*L.alto*L.grosor*Math.max(0.4,1-alt/400),5,0,0,TAU);g.fill();}
  for(var e=0;e<S.estela.length;e++){

    g.translate(q.x,q.y);g.rotate(q.rot*q.f);g.scale(q.f*q.k*q.sx,q.k*q.sy);
    g.drawImage(bl,0,0,q.c[2],q.c[3],-q.c[4],-(q.c[5]||q.c[3]),q.c[2],q.c[3]);g.restore();

  g.rotate(rot*F.f);
  g.scale(F.f*k*sx,k*sy);

  if(!an&&S.ant&&S.ant.indexOf('anim:')<0&&dC<0.07){var ca=cuadroDe(md,S.ant);g.globalAlpha=0.55*(1-dC/0.07);
    g.drawImage(im,ca[0],ca[1],ca[2],ca[3],-ca[4],-(ca[5]||ca[3]),ca[2],ca[3]);g.globalAlpha=1;}
  g.drawImage(im,c[0],c[1],c[2],c[3],-c[4],-(c[5]||c[3]),c[2],c[3]);

  var dB=F.tBlanco?(ahora-F.tBlanco)/1000:9;
  if(dB<0.12){g.globalAlpha=0.85*(1-dB/0.12);g.drawImage(silueta(im,c,'#ffffff'),0,0,c[2],c[3],-c[4],-(c[5]||c[3]),c[2],c[3]);}

/* un cuadro suelto, fuera de la pelea (menú): pies en (x,y), mirando f, con el alto pedido en unidades */
function cuadroSuelto(g,id,nom,x,y,f,alto,alfa,blanco){
  var md=SPR_META&&SPR_META[id], im=IMG['sprites-'+id];
  if(!md||!im)return false;

/* un cuadro de una animación de 24, fuera de la pelea; si el atlas no llegó, el cuadro suelto */
function cuadroAnimSuelto(g,id,anim,p,x,y,f,alto,alfa,blanco,respaldo){

function nuevoLuchador(inst,lado){
  var C=cartaDe(inst.id), L=LUCH[C.l], st=statsDe(inst);
  var F={inst:inst,C:C,L:L,l:C.l,lado:lado,x:0,y:0,vx:0,vy:0,f:lado?-1:1,enSuelo:true,

function rinde(F,f){return F.firma===f?(F.inst.arbol&&F.inst.arbol.fir?1.5:1):0;}
function rival(F){return M.act[1-F.lado];}
function distancia(F){var R=rival(F);return R?Math.abs(R.x-F.x):999;}
function mirarRival(F){var R=rival(F);if(R&&F.enSuelo&&(F.est==='guardia'||F.est==='camina'||F.est==='bloqueo'))F.f=R.x>F.x?1:-1;}
function ponerEstado(F,e){
  if(e==='dash'&&F.est!=='dash'&&F.enSuelo)polvo(F.x-F.f*20,F.y,5);    /* el arranque levanta tierra */
  F.est=e;F.tEst=0;
}
function empezarMov(F,nombre,mov){
  F.est='ataque';F.mov=mov;F.movNom=nombre;F.fr=0;F.golpesMov=0;F.multiT=0;F.tEst=0;
  if(mov.avance&&F.enSuelo)F.vx=mov.avance*F.f;
  if(mov.silb)Sonido.fx(mov.silb);
}
/* ---------------- las órdenes (del jugador o de la IA) ---------------- */
function orden(F,o){
  if(!F||F.ko||M.fin)return;
  var libre=F.est==='guardia'||F.est==='camina'||F.est==='bloqueo';
  var enCadena=F.est==='ataque'&&F.fr>=F.mov.cad&&F.golpesMov>0;
  var aire=!F.enSuelo, R=rival(F), alc=64*TAM*F.L.alcance*(ALCANCE_ARMA[F.L.estilo]||1);
  if(F.est==='ataque'&&!enCadena){F.buffer=o;return;}      /* se guarda y sale apenas se pueda */
  if(!libre&&!enCadena&&!(aire&&F.est==='salto'))return;
  var cad=CADENAS[F.L.estilo];
  if(o==='toca'){
    if(aire){
      var n=F.aereos%3;F.aereos++;
      empezarMov(F,'aerea'+(n+1),NORMALES['aerea'+(n+1)]);return;
    }
    if(libre&&R&&distancia(F)>alc*1.35){dashear(F,1,'toca');return;}   /* lejos: se acerca y pega */
    var i=enCadena?Math.min(3,F.cadena+1):0;
    F.cadena=i;empezarMov(F,cad[i],NORMALES[cad[i]]);return;
  }
  if(o==='adelante'){
    if(aire)return;
    if(enCadena||(R&&distancia(F)<alc*1.4)){F.cadena=0;empezarMov(F,'fuerte',NORMALES.fuerte);return;}
    dashear(F,1,null);return;
  }
  if(o==='atras'){if(!aire&&libre)dashear(F,-1,null);return;}
  if(o==='arriba'){
    if(aire)return;
    if(enCadena){F.cadena=0;empezarMov(F,'alzada',NORMALES.alzada);F.persigue=true;return;}
    saltar(F,0);return;
  }
  if(o==='abajo'){
    if(aire){empezarMov(F,'azote',NORMALES.azote);F.vy=Math.max(F.vy,420);return;}
    F.cadena=0;empezarMov(F,'barrida',NORMALES.barrida);return;
  }
  if(o==='esp0'||o==='esp1'){
    var k=o==='esp0'?0:1;
    if(F.cd[k]>0||aire)return;
    var e=F.L.esp[k];
    F.cd[k]=e.cd*(1-rinde(F,'enfriar')*0.25);

/* ---------------- recibir un golpe ---------------- */
function pegar(A,D,mov,x,y,escala){
  if(!D||D.ko||D.inv>0)return false;
  escala=escala||1;
  var cubre=D.est==='bloqueo'&&D.enSuelo&&!mov.imparable&&Math.sign(A.x-D.x)===D.f;
  if(cubre){
    D.stun=mov.bs/60;D.vx=-D.f*mov.emp*0.9;
    var chip=mov.tipo==='esp'||mov.tipo==='sup'?0.12:0;
    if(chip)herir(D,A,A.atk*mov.dmg*chip*escala,false);
    D.med=Math.min(3,D.med+0.05);D.contra=D.firma==='contra';
    Sonido.fx('bloqueo');FX.chispa(x,y,'255,255,255',true);
    FX.congelar(3);
    return true;
  }
  /* el daño: ataque × golpe × elemento × escalado del combo × crítico */
  var comboEsc=Math.max(0.35,1-D.combo*0.07);
  var dmg=A.atk*mov.dmg*escala*ventajaElem(A.elem,D.elem)*comboEsc;
  if(A.firma==='combo')dmg*=1+Math.min(0.36,D.combo*0.03)*rinde(A,'combo');
  if(A.firma==='furia'&&A.vida<A.vidaMax*0.35)dmg*=1+0.35*rinde(A,'furia');
  if(A.contra){dmg*=1.5;A.contra=false;}
  if(D.firma==='coraza')dmg*=1-0.15*rinde(D,'coraza');
  var arb=A.inst.arbol||{};
  if(mov.tipo==='esp')dmg*=1+(arb.sp1&&A.movNom===A.L.esp[0].id?0.2:0)+(arb.sp2&&A.movNom===A.L.esp[1].id?0.2:0);
  if(mov.tipo==='sup'&&arb.sup)dmg*=1.25;
  var pc=A.crit+(!A.enSuelo?0.25*rinde(A,'critAereo'):0), crit=rnd()<pc;
  if(crit)dmg*=1.5;
  herir(D,A,dmg,crit);
  if(A.firma==='robo')A.vida=Math.min(A.vidaMax,A.vida+dmg*0.04*rinde(A,'robo'));
  if(mov.tipo==='esp'&&A.firma==='quemadura')D.quema=3;
  A.med=Math.min(3,A.med+mov.med*(1+0.3*rinde(A,'medidor')));
  D.med=Math.min(3,D.med+mov.med*0.5);
  D.combo++;M.comboVis={n:D.combo,t:1.4,lado:A.lado};
  if(M.modo==='arcade'&&A.lado===0)M.puntos+=Math.round(dmg*10)+D.combo*50;
  /* los anuncios del salón: el combo largo se festeja */
  var AN={5:['¡BIEN!','#bff0ff','#3a8ad8'],10:['¡GRAN COMBO!','#ffe36a','#ff5a1a'],15:['¡BESTIAL!','#ffb0e0','#c02a8a'],20:['¡ARRABALERO!','#ffffff','#ff2a2a']}[D.combo];
  if(AN&&M.modo!=='demo'){M.anuncio={txt:AN[0],t:1.3,col1:AN[1],col2:AN[2],lado:A.lado};Sonido.fx('anuncio');}
  if(D.combo>M.comboMax[A.lado])M.comboMax[A.lado]=D.combo;
  /* cómo sale volando */
  if(D.vida<=0){noquear(D,A);}
  else if(mov.lanz||!D.enSuelo){
    ponerEstado(D,'aireG');D.enSuelo=false;
    D.vy=mov.lanz?-mov.lanz:-260*Math.max(0.4,1-D.combo*0.05);
    D.vx=-D.f*(mov.emp*0.4);D.stun=1;
    if(mov.rebote)D.vy=520;
  } else if(mov.derriba){
    ponerEstado(D,'aireG');D.enSuelo=false;D.vy=-380;D.vx=-D.f*260;D.stun=1;D.derribado=true;
  } else {
    ponerEstado(D,'golpeado');D.stun=mov.hs/60;D.vx=-D.f*mov.emp;
  }
  D.f=A.x>D.x?1:-1;
  D.exp='dolor';
  /* el impacto: congelado, temblor, chispa y sonido según el peso del golpe */
  FX.congelar(mov.parada+(crit?3:0));
  FX.sacudir(mov.parada*0.9);
  var colG=mov.color||(crit?'255,230,90':'255,250,230'), fuerte=mov.parada>=8||crit;
  FX.chispa(x,y,colG,false,fuerte);
  FX.onda(x,y,colG,fuerte);
  if(mov.tipo!=='normal'||ALCANCE_ARMA[A.L.estilo]>1.2)FX.tajo(x,y,A.f,colG,fuerte);
  if(mov.parada>=10||crit){FX.acercar(x,y,crit?1.12:1.08);FX.velocidad(0.28);FX.flash=Math.max(FX.flash,0.16);}
  D.tBlanco=Date.now();
  if(!D.enSuelo||mov.derriba||mov.lanz)polvo(D.x,D.y,4);
  if(crit)FX.texto(x,y-30,'¡CRÍTICO!','#ffd76a',16);
  sonarGolpe(A,mov,crit);
  vibrar(mov.parada>=8?40:12);
  return true;
}

function lanzarProy(F,tipo,movSup){

function pasarProy(dt){
  for(var i=M.proy.length-1;i>=0;i--){
    var p=M.proy[i];
    p.t+=dt;
    if(p.espera&&p.t<p.espera){if(p.sigue){var Rz=rival(p.dueño);if(Rz)p.x=Rz.x;}continue;}
    if(!p.fijo){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.grav)p.vy+=p.grav*dt;}
    if(p.y>ESC.suelo-p.r*0.6&&p.grav){p.y=ESC.suelo-p.r*0.6;p.vy*=-0.4;p.vx*=0.7;}
    if((p.tipo==='lluviaFuego'||p.tipo==='lluviaBochas')&&p.y>ESC.suelo-10){FX.chispa(p.x,ESC.suelo-10,'255,150,40',false,true);M.proy.splice(i,1);continue;}
    var D=rival(p.dueño);
    p.tGolpe-=dt;
    if(D&&!D.ko&&p.golpes>0&&p.tGolpe<=0){
      var alto=150*D.L.alto*TAM, dy=p.rasante||p.fijo||p.rayo?0:Math.max(0,Math.abs(p.y-(D.y-alto*0.5))-alto*0.5);
      var dx=Math.abs(p.x-D.x);
      if(dx<p.r+18&&dy<p.r){
        p.golpes--;p.tGolpe=p.cada;
        pegar(p.dueño,D,p.mov,p.x,Math.min(p.y,D.y-70),1);
        if(p.tira&&D.est==='golpeado'){D.vx=p.dueño.f*-1*-380;}      /* el anzuelo lo trae */
        if(p.cura)p.dueño.vida=Math.min(p.dueño.vidaMax,p.dueño.vida+p.dueño.atk*0.05);
        if(p.golpes<=0&&!p.fijo){M.proy.splice(i,1);continue;}
      }
    }
    if(p.t>p.vida||p.x<-200||p.x>MUNDO_W+200)M.proy.splice(i,1);
  }
}
/* ---------------- un paso de un luchador ---------------- */
function pasarLuchador(F,dt){
  F.t+=dt;F.tEst+=dt;
  if(F.inv>0)F.inv-=dt;
  for(var k=0;k<2;k++)if(F.cd[k]>0)F.cd[k]=Math.max(0,F.cd[k]-dt);
  if(F.quema>0){F.quema-=dt;F.vida=Math.max(1,F.vida-F.vidaMax*0.02*dt);if(az()<0.3)FX.humo(F.x,F.y-80);}
  if(F.rastro>F.vida)F.rastro=Math.max(F.vida,F.rastro-F.vidaMax*0.3*dt);
  F.parpadeo=(F.t%3.1)<0.1;
  F.golpeando=false;
  var P=null, est=F.est, R=rival(F);
  /* la física: gravedad en el aire, roce en el piso */
  if(!F.enSuelo){
    F.vy+=GRAV*dt*(est==='aireG'&&F.combo>0?0.8:1);
    F.x+=F.vx*dt;F.y+=F.vy*dt;
    if(F.y>=ESC.suelo){
      F.y=ESC.suelo;F.enSuelo=true;F.vy=0;
      if(est==='aireG'){ponerEstado(F,'caido');F.vx*=0.3;Sonido.fx('caida');polvo(F.x,F.y,10);FX.sacudir(4);F.combo=0;}
      else{ponerEstado(F,'guardia');Sonido.fx('cae');polvo(F.x,F.y,5);F.aereos=0;F.combo=0;}
      if(F.est==='ataque'&&F.mov&&F.mov.aire)ponerEstado(F,'guardia');
    }
  } else {
    F.x+=F.vx*dt;
    F.vx*=Math.pow(est==='dash'||est==='dashAtras'?0.02:0.0008,dt);
  }
  /* los bordes: el mundo y la pantalla (los dos se ven siempre) */
  var izq=Math.max(20,M.cam-ANCHO/2+22), der=Math.min(MUNDO_W-20,M.cam+ANCHO/2-22);
  if(F.x<izq){F.x=izq;F.vx=Math.max(0,F.vx);}
  if(F.x>der){F.x=der;F.vx=Math.min(0,F.vx);}
  switch(est){
    case 'guardia': case 'camina':
      F.exp='normal';F.combo=0;
      var r=Math.sin(F.t*3.2);
      P=conPose(G0,{tor:G0.tor+r*0.03,bFs:G0.bFs+r*0.04,bTs:G0.bTs-r*0.03,pFr:G0.pFr+r*0.05,pTr:G0.pTr+r*0.04});
      if(est==='camina'){var ph=F.t*9;P.pFm=0.2+Math.sin(ph)*0.45;P.pTm=-0.2-Math.sin(ph)*0.45;P.pFr=0.4+Math.max(0,Math.cos(ph))*0.6;P.pTr=0.3+Math.max(0,-Math.cos(ph))*0.6;}
      mirarRival(F);
      if(F.buffer){var b=F.buffer;F.buffer=null;orden(F,b);}
      break;
    case 'bloqueo':
      P=POSES.bloqueo;F.exp='normal';mirarRival(F);
      if(F.stun>0)F.stun-=dt;
      break;
    case 'dash': case 'dashAtras':
      P=POSES[est];
      var alc=64*TAM*F.L.alcance*(ALCANCE_ARMA[F.L.estilo]||1);
      if(est==='dash'&&F.buffer==='toca'&&R&&distancia(F)<alc*1.1){F.buffer=null;ponerEstado(F,'guardia');F.vx*=0.3;orden(F,'toca');break;}
      if(F.tEst>0.26){ponerEstado(F,'guardia');if(F.buffer){var bb=F.buffer;F.buffer=null;orden(F,bb);}}
      break;
    case 'salto':
      P=POSES.salto;
      break;
    case 'ataque':
      var m=F.mov;
      /* los especiales cuerpo a cuerpo "se tiran encima": si el rival está lejos, primero corren */
      if(m.busca&&F.fr<1&&R&&F.enSuelo){
        var alcB=(m.caja[0]+m.caja[2])*escalaCaja(F,m)*0.85;
        F.tBusca=(F.tBusca||0)+dt;
        if(Math.abs(R.x-F.x)>alcB&&F.tBusca<0.6){F.vx=640*F.f*F.L.vel;mezclar(F.pose,POSES.dash,Math.min(1,dt*18),F.pose);if(az()<0.4)polvo(F.x,F.y,1);break;}
      }
      F.tBusca=0;
      F.fr+=dt*60;
      P=poseDeMov(m,F.fr);
      F.exp=F.fr<m.act[1]?'grito':'normal';
      F.golpeando=F.fr>=m.act[0]&&F.fr<=m.act[1]+6;
      if(m.fuelle)F.fuelle=Math.max(0,Math.sin(Math.min(1,F.fr/16)*Math.PI));
      /* la estocada: el paso adelante se sostiene hasta llegar al rival. Si sólo se diera
         el empujón inicial, el roce del piso se lo come y el especial pega al aire (medido: 0 de daño) */
      if(m.avance&&F.enSuelo&&R){
        var hasta=m.tipo==='esp'?m.act[1]:m.act[0];
        var pegado=Math.abs(R.x-F.x)<(18*F.L.grosor+18*R.L.grosor)*TAM+10;
        if(F.fr<hasta&&!pegado&&(m.multi||F.golpesMov===0))F.vx=m.avance*F.f;
      }
      if(m.proy&&F.fr>=m.k[1][0]&&!F.proyLanzado){F.proyLanzado=true;lanzarProy(F,m.proy);}
      if(m.aura&&F.fr>=m.act[0]&&F.fr<=m.act[1]&&az()<0.5)FX.chispa(F.x+(az()-0.5)*90,F.y-40-az()*110,m.aura,true);
      /* los cuadros activos: si la caja de golpe toca al rival, pega (una vez, o cada tanto en los multi) */
      if(F.fr>=m.act[0]&&F.fr<=m.act[1]&&R){
        F.multiT-=dt;
        var puede=m.multi?F.multiT<=0&&F.golpesMov<m.multi:F.golpesMov===0;
        if(puede&&tocaCaja(F,m,R)){
          var cx=F.x+F.f*(m.caja[0]+m.caja[2]*0.7)*escalaCaja(F,m), cy=F.y+m.caja[1]*F.L.alto*TAM+m.caja[3]*0.4;
          if(pegar(F,R,m,cx,cy,1)){F.golpesMov++;F.multiT=0.1;}
        }
      }
      /* después de la alzada el que lanzó salta a perseguir */
      if(F.movNom==='alzada'&&F.persigue&&F.golpesMov>0&&F.fr>=m.act[1]+2){
        F.persigue=false;saltar(F,F.f*0.6);F.vy=-760;
      }
      if(F.fr>=m.dur){
        F.proyLanzado=false;F.fuelle=0;F.persigue=false;
        if(!F.enSuelo){ponerEstado(F,'salto');}
        else{ponerEstado(F,'guardia');F.cadena=0;}
        if(F.buffer){var b2=F.buffer;F.buffer=null;orden(F,b2);}
      } else if(F.buffer&&F.fr>=m.cad&&F.golpesMov>0){var b3=F.buffer;F.buffer=null;orden(F,b3);}
      break;
    case 'golpeado':
      P=POSES.golpeado;F.stun-=dt;
      if(F.stun<=0)ponerEstado(F,'guardia');
      break;
    case 'aireG':
      P=POSES.aireG;
      break;
    case 'caido':
      P=POSES.caido;F.exp=F.ko?'ko':'dolor';
      if(!F.ko&&F.tEst>0.7){ponerEstado(F,'levanta');F.inv=0.45;}
      break;
    case 'levanta':
      P=mezclar(POSES.caido,G0,suave(Math.min(1,F.tEst/0.35)),{});
      if(F.tEst>0.35){ponerEstado(F,'guardia');F.combo=0;F.derribado=false;}
      break;
    case 'super':
      P=POSES.victoria;F.exp='grito';
      break;
    case 'rafaga':
      var rf=F.rafaga;rf.t+=dt;
      P=(Math.floor(rf.t*14)%2)?POSES.giro1:POSES.jab;F.exp='grito';F.golpeando=true;
      if(R&&rf.t>0.07*(S_rafagaHechos(rf)+1)&&rf.n>0){
        rf.n--;rf.hechos=(rf.hechos||0)+1;
        R.x=F.x+F.f*52;
        var ult=rf.n===0;
        pegar(F,R,ult?golpe({dmg:0.45,derriba:true,tipo:'sup',sfx:'golpe3',parada:14,med:0,color:'255,70,100'}):rf.mov,R.x,R.y-90,1);
        for(var q=0;q<3;q++)FX.petalo(R.x,R.y-90);
      }
      if(rf.n<=0&&rf.t>0.9)ponerEstado(F,'guardia');
      break;
    case 'ko':
      P=POSES.caido;F.exp='ko';
      break;
    case 'victoria':
      P=conPose(POSES.victoria,{tor:POSES.victoria.tor+Math.sin(F.t*4)*0.05});F.exp='grito';
      break;
    case 'entra':
      P=POSES.salto;
      break;
  }
  if(F.est==='caido'&&F.ko)ponerEstado(F,'ko');
  /* la pose llega suave: nunca salta de una a otra de golpe */
  if(P){
    var vel=F.est==='ataque'||F.est==='rafaga'?1:Math.min(1,dt*18);
    mezclar(F.pose,P,vel,F.pose);
  }
}
function S_rafagaHechos(rf){return rf.hechos||0;}
function poseDeMov(m,fr){
  var k=m.k;
  if(fr<=k[0][0])return POSES[k[0][1]];
  for(var i=0;i<k.length-1;i++){
    if(fr>=k[i][0]&&fr<=k[i+1][0]){
      var t=(fr-k[i][0])/Math.max(1,k[i+1][0]-k[i][0]);
      return mezclar(POSES[k[i][1]],POSES[k[i+1][1]],suave(t),{});
    }
  }
  return POSES[k[k.length-1][1]];
}
function escalaCaja(F,m){
  var manos=['jab','cruz','gancho','cuerpo','fuerte','aerea2','aerea3','alzada'];
  return TAM*F.L.alcance*(manos.indexOf(F.movNom)>=0?(ALCANCE_ARMA[F.L.estilo]||1):1);
}
function tocaCaja(F,m,R){
  if(R.ko&&R.est==='ko')return false;
  var e=escalaCaja(F,m), a=F.L.alto*TAM;
  var x0=F.x+F.f*m.caja[0]*e, x1=F.x+F.f*(m.caja[0]+m.caja[2])*e;
  var lx=Math.min(x0,x1), hx=Math.max(x0,x1);
  var y0=F.y+m.caja[1]*a, y1=y0+m.caja[3]*a;
  /* el cuerpo del rival: un rectángulo; tirado, uno bajo y largo */
  var ra=R.L.alto*TAM, rw=18*R.L.grosor*TAM;
  var ry0=R.est==='caido'||R.est==='ko'?R.y-40:R.y-150*ra, ry1=R.y;
  if(R.est==='caido')return false;               /* en el piso no se le pega (se está levantando) */
  return hx>R.x-rw&&lx<R.x+rw&&y1>ry0&&y0<ry1;
}
function polvo(x,y,n){for(var i=0;i<n;i++)FX.part.push({x:x+(az()-0.5)*30,y:y-2,vx:(az()-0.5)*120,vy:-az()*80,t:0,tm:0.5+az()*0.3,r:4+az()*5,col:'180,160,140',humo:true});}

/* ---------------- efectos: chispas de historieta, números, polvo, pétalos ---------------- */
var FX={
  part:[], textos:[], nums:[], chispas:[], ondas:[], tajos:[], sac:0, flash:0, congelado:0, vel:0, zoom:null,
  limpiar:function(){this.part.length=0;this.textos.length=0;this.nums.length=0;this.chispas.length=0;this.ondas.length=0;this.tajos.length=0;
    this.sac=0;this.flash=0;this.congelado=0;this.vel=0;this.zoom=null;},
  /* la onda del impacto: un aro que se abre y se apaga */
  onda:function(x,y,col,grande){this.ondas.push({x:x,y:y,col:col,t:0,tm:grande?0.34:0.22,r:grande?90:52,w:grande?9:5});},
  /* el tajo: una medialuna de luz en la dirección del golpe (armas, especiales) */
  tajo:function(x,y,dir,col,grande){this.tajos.push({x:x,y:y,dir:dir,col:col,t:0,tm:0.16,r:grande?78:54,rot:(az()-0.5)*1.2});},
  /* el golpe grande acerca la cámara un instante sobre el impacto */
  acercar:function(x,y,k){if(Prog.aj.temblor===false)return;this.zoom={x:x,y:y,k:k,t:0,tm:0.32};},
  velocidad:function(n){this.vel=Math.max(this.vel,n);},
  sacudir:function(n){if(Prog.aj.temblor===false)return;this.sac=Math.max(this.sac,n);},
  congelar:function(n){this.congelado=Math.max(this.congelado,n);},
  /* la estrella del impacto: puntas irregulares con borde de tinta, como en una viñeta */
  chispa:function(x,y,col,chica,grande){
    this.chispas.push({x:x,y:y,col:col,t:0,tm:chica?0.12:grande?0.26:0.18,r:chica?14:grande?46:30,rot:az()*TAU,p:chica?6:grande?12:9});
    for(var i=0;i<(chica?3:grande?14:7);i++){
      var a=az()*TAU, v=(grande?520:320)*(0.4+az());
      this.part.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,tm:0.25+az()*0.2,r:1.5+az()*2,col:col,linea:true});
    }
  },
  numero:function(x,y,n,crit){this.nums.push({x:x+(az()-0.5)*30,y:y,n:n,crit:crit,t:0,vy:-90});},
  texto:function(x,y,txt,col,tam){this.textos.push({x:x,y:y,t:0,txt:txt,col:col||'#fff',tam:tam||14});},
  humo:function(x,y){this.part.push({x:x+(az()-0.5)*20,y:y,vx:(az()-0.5)*30,vy:-60,t:0,tm:0.8,r:5+az()*5,col:'60,50,50',humo:true});},
  petalo:function(x,y){var a=az()*TAU;this.part.push({x:x,y:y,vx:Math.cos(a)*220,vy:Math.sin(a)*220-120,t:0,tm:1.2,r:4,col:'220,30,60',petalo:true,rot:az()*6});},
  pasar:function(dt){
    var i;
    for(i=this.part.length-1;i>=0;i--){
      var p=this.part[i];p.t+=dt;
      if(p.t>=p.tm){this.part.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.humo){p.vx*=0.96;p.vy*=0.96;p.r+=dt*14;}
      else if(p.petalo){p.vy+=240*dt;p.vx*=0.98;p.rot+=dt*8;}
      else{p.vx*=0.9;p.vy=p.vy*0.9+120*dt;}
    }
    for(i=this.chispas.length-1;i>=0;i--){this.chispas[i].t+=dt;if(this.chispas[i].t>=this.chispas[i].tm)this.chispas.splice(i,1);}
    for(i=this.nums.length-1;i>=0;i--){var n=this.nums[i];n.t+=dt;n.y+=n.vy*dt;n.vy*=0.92;if(n.t>0.9)this.nums.splice(i,1);}
    for(i=this.textos.length-1;i>=0;i--){var x=this.textos[i];x.t+=dt;x.y-=24*dt;if(x.t>1)this.textos.splice(i,1);}
    for(i=this.ondas.length-1;i>=0;i--){this.ondas[i].t+=dt;if(this.ondas[i].t>=this.ondas[i].tm)this.ondas.splice(i,1);}
    for(i=this.tajos.length-1;i>=0;i--){this.tajos[i].t+=dt;if(this.tajos[i].t>=this.tajos[i].tm)this.tajos.splice(i,1);}
    if(this.zoom){this.zoom.t+=dt;if(this.zoom.t>=this.zoom.tm)this.zoom=null;}
    this.vel=Math.max(0,this.vel-dt);
    this.sac*=Math.pow(0.86,dt*60);
    this.flash=Math.max(0,this.flash-dt*2.5);
  },
  dibujar:function(g){
    var i;
    for(i=0;i<this.part.length;i++){
      var p=this.part[i], k=1-p.t/p.tm;
      if(p.humo){g.fillStyle='rgba('+p.col+','+(k*0.35).toFixed(3)+')';g.beginPath();g.arc(p.x,p.y,p.r,0,TAU);g.fill();}
      else if(p.petalo){g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle='rgba('+p.col+','+k.toFixed(3)+')';g.beginPath();g.ellipse(0,0,5,2.5,0,0,TAU);g.fill();g.restore();}
      else if(p.linea){g.strokeStyle='rgba('+p.col+','+k.toFixed(3)+')';g.lineWidth=p.r;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03);g.stroke();}
    }
    g.save();g.globalCompositeOperation='lighter';
    for(i=0;i<this.ondas.length;i++){
      var o=this.ondas[i], ko=o.t/o.tm, ro=o.r*(0.25+0.75*Math.sqrt(ko));
      g.strokeStyle='rgba('+o.col+','+(1-ko).toFixed(3)+')';g.lineWidth=o.w*(1-ko)+1;
      g.beginPath();g.ellipse(o.x,o.y,ro,ro*0.8,0,0,TAU);g.stroke();
      g.strokeStyle='rgba(255,255,255,'+(0.8*(1-ko)).toFixed(3)+')';g.lineWidth=1.5;
      g.beginPath();g.ellipse(o.x,o.y,ro*0.7,ro*0.56,0,0,TAU);g.stroke();
    }
    for(i=0;i<this.tajos.length;i++){
      var tj=this.tajos[i], kt=tj.t/tj.tm, rt=tj.r*(0.7+kt*0.5);
      g.save();g.translate(tj.x,tj.y);g.scale(tj.dir,1);g.rotate(tj.rot);
      g.fillStyle='rgba('+tj.col+','+(0.9*(1-kt)).toFixed(3)+')';
      g.beginPath();g.arc(-rt*0.5,0,rt,-1.1,1.1);g.arc(-rt*0.5-rt*0.28,0,rt*0.92,1.0,-1.0,true);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,'+(0.9*(1-kt)).toFixed(3)+')';
      g.beginPath();g.arc(-rt*0.5,0,rt,-0.7,0.7);g.arc(-rt*0.5-rt*0.1,0,rt*0.96,0.66,-0.66,true);g.closePath();g.fill();
      g.restore();
    }
    g.restore();
    for(i=0;i<this.chispas.length;i++){
      var c=this.chispas[i], kk=c.t/c.tm, r=c.r*(0.6+kk*0.7);
      g.save();g.translate(c.x,c.y);g.rotate(c.rot+kk*0.4);g.globalAlpha=1-kk*kk;
      g.beginPath();
      for(var j=0;j<c.p*2;j++){var ra=j%2?r*0.42:r*(0.85+((j*37)%7)/20);var an=j/(c.p*2)*TAU;g[j?'lineTo':'moveTo'](Math.cos(an)*ra,Math.sin(an)*ra);}
      g.closePath();g.fillStyle='rgba('+c.col+',1)';g.fill();
      g.lineWidth=3;g.strokeStyle=TINTA;g.stroke();
      g.fillStyle='#ffffff';g.beginPath();g.arc(0,0,r*0.28,0,TAU);g.fill();
      g.restore();
    }
    for(i=0;i<this.nums.length;i++){
      var n=this.nums[i], a=1-Math.pow(n.t/0.9,3), e=n.t<0.1?1.6-n.t*6:1;
      g.save();g.globalAlpha=a;g.translate(n.x,n.y);g.scale(e,e);
      texto(g,String(n.n),0,0,n.crit?22:16,n.crit?'#ffd23a':'#ffffff');
      g.restore();
    }
    for(i=0;i<this.textos.length;i++){
      var x=this.textos[i];g.save();g.globalAlpha=1-Math.pow(x.t,3);texto(g,x.txt,x.x,x.y,x.tam,x.col);g.restore();
    }
  }
};

/* ---------------- la IA del rival ----------------
   d: dificultad de 0 a 1. Reacciona tarde o temprano, se cubre más o menos,
   arma combos más o menos largos, y usa especiales y súper. */
function pasarIA(F,dt,d){
  if(!F||F.ko||M.cine||M.fin||M.intro>0)return;
  var R=rival(F);if(!R||R.ko)return;
  var ia=F.ia||(F.ia={t:0.6,reac:0,decide:false,largo:0,hechos:0});
  var dist=Math.abs(R.x-F.x), alc=64*TAM*F.L.alcance*(ALCANCE_ARMA[F.L.estilo]||1);
  var libre=F.est==='guardia'||F.est==='camina';
  /* defenderse: el rival arranca un golpe cerca, o viene un proyectil */
  var amenaza=(R.est==='ataque'&&R.mov&&R.fr<R.mov.act[1]&&dist<alc*1.9)||M.proy.some(function(p){return p.dueño===R&&Math.abs(p.x-F.x)<150&&Math.sign(p.vx||0)===Math.sign(F.x-p.x);});
  if(amenaza&&(libre||F.est==='bloqueo')){
    if(!ia.mirando){ia.mirando=true;ia.reac=0.3-d*0.22;ia.decide=rnd()<0.18+d*0.55;}
    ia.reac-=dt;
    if(ia.reac<=0&&ia.decide){ponerEstado(F,'bloqueo');F.tBloq=0.3;return;}
  } else ia.mirando=false;
  if(F.est==='bloqueo'){F.tBloq-=dt;if(F.tBloq<=0&&F.stun<=0)ponerEstado(F,'guardia');return;}
  /* seguir el combo que empezó */
  if(F.est==='ataque'&&F.golpesMov>0&&F.fr>=F.mov.cad&&ia.hechos<ia.largo){
    ia.hechos++;
    if(ia.hechos===ia.largo){
      var fin=rnd();
      orden(F,fin<0.35+d*0.3?'arriba':fin<0.75?'adelante':'toca');
    } else orden(F,'toca');
    return;
  }
  /* en el aire, persiguiendo después de la alzada */
  if(F.est==='salto'&&!R.enSuelo&&Math.abs(R.y-F.y)<120&&dist<alc*1.3){
    orden(F,F.aereos>=2&&rnd()<0.5+d*0.3?'abajo':'toca');return;
  }
  if(!libre)return;
  ia.t-=dt;
  if(dist>alc*1.15){                      /* acercarse: caminando o de un salto */
    if(F.cd[0]<=0&&rnd()<0.012+d*0.02&&esProyectil(F.L.esp[0].id)){orden(F,'esp0');return;}
    if(F.cd[1]<=0&&rnd()<0.008+d*0.015&&esProyectil(F.L.esp[1].id)){orden(F,'esp1');return;}
    if(rnd()<0.012+d*0.01){orden(F,'adelante');return;}
    ponerEstado(F,'camina');F.f=R.x>F.x?1:-1;F.vx=F.f*150*F.L.vel;F.est='camina';
    return;
  }
  if(F.est==='camina')ponerEstado(F,'guardia');
  if(ia.t>0)return;
  ia.t=0.34-d*0.18+rnd()*0.3;
  var r=rnd();
  if(F.med>=2&&r<0.1+d*0.15){orden(F,'super');return;}
  if(F.cd[0]<=0&&r<0.2){orden(F,'esp0');return;}
  if(F.cd[1]<=0&&r<0.3){orden(F,'esp1');return;}
  if(r<0.42&&R.enSuelo){orden(F,'abajo');return;}
  if(r<0.5){orden(F,'atras');return;}
  ia.largo=1+Math.floor(d*3+rnd()*2);ia.hechos=0;
  orden(F,'toca');
}
function esProyectil(id){var m=ESPECIALES[id];return !!(m&&m.proy);}

/* ---------------- la pelea entera ---------------- */
function instanciaDe(id){return Prog.cartas[id];}
function nuevaPelea(pelea,equipoJ,modo){
  Mando.reiniciar();
  setTimeout(function(){if(!M)return;var ids=M.eq[0].concat(M.eq[1]).map(function(F){return F.l;});soltarAnims(ids);ids.forEach(imgAnim);},0);
  medirEscenario();
  M={pelea:pelea,act:[null,null],eq:[[],[]],idx:[0,0],proy:[],cam:MUNDO_W/2,reloj:0,cine:null,cartel:null,
     intro:3.0,fin:0,resultado:null,comboVis:null,comboMax:[0,0],lento:0,t:0,dificultad:pelea.dificultad,koHecho:{},esc:BARRIOS[pelea.barrio].esc,
     modo:modo||'historia',ronda:1,vic:[0,0],puntos:0,entre:0,bonus:null,anuncio:null};
  M.eq[0]=equipoJ?equipoJ.map(function(inst){return nuevoLuchador(inst,0);}):
    Prog.equipo.filter(function(id){return !!Prog.cartas[id];}).map(function(id){return nuevoLuchador(instanciaDe(id),0);});
  M.eq[1]=pelea.equipo.map(function(inst){return nuevoLuchador(inst,1);});
  if(pelea.jefe){var J1=M.eq[1][M.eq[1].length-1];J1.vidaMax=J1.vida=J1.rastro=Math.round(J1.vida*1.5);J1.jefe=true;}
  /* el reloj crece con los equipos: un 3 contra 3 con 120 s se iba siempre a tiempo */
  M.reloj=M.relojIni=60+35*Math.max(M.eq[0].length,M.eq[1].length);
  if(M.modo!=='historia'){          /* arcade y demo: uno contra uno, rondas de 60 s */
    M.reloj=M.relojIni=60;M.intro=2.4;
    M.cartel={txt:'RONDA 1',t:1.4,col:'#ffffff',arcade:true};
  }
  entrar(0,true);entrar(1,true);
  FX.limpiar();
  Sonido.musica(pelea.jefe?'jefe':BARRIOS[pelea.barrio].mus);
  Sonido.fx(M.modo==='historia'?'vs':'ronda');
}
/* rondas: gana la pelea el primero que gana dos */
function finRonda(g){
  if(M.entre>0||M.fin)return;
  M.vic[g]++;
  var P=M.act[0];
  if(g===0&&M.modo==='arcade'){
    var bt=Math.ceil(Math.max(0,M.reloj))*100, bv=Math.round(P.vida/P.vidaMax*5000), perf=P.vida>=P.vidaMax?10000:0;
    M.bonus={t:0,tiempo:bt,vida:bv,perfecto:perf,total:bt+bv+perf,sumado:false};
    if(perf){M.anuncio={txt:'¡PERFECTO!',t:2,col1:'#bff0ff',col2:'#3a8ad8'};}
  }
  if(M.vic[g]>=2){terminarPelea(g===0?'gano':'perdio');M.fin=3.4;}
  else{M.entre=3.4;var gan=M.act[g];if(gan&&!gan.ko)ponerEstado(gan,'victoria');}
}
function nuevaRonda(){
  M.ronda++;M.proy=[];M.reloj=M.relojIni;M.intro=2.4;M.bonus=null;M.anuncio=null;M.cam=MUNDO_W/2;
  for(var l=0;l<2;l++){
    var F=M.act[l];
    F.vida=F.rastro=F.vidaMax;F.ko=false;F.exp='normal';F.combo=0;F.cd=[0,0];F.quema=0;F.inv=0;F.stun=0;F.vx=F.vy=0;F.buffer=null;
    F.y=ESC.suelo;F.enSuelo=true;F.x=MUNDO_W/2+(l?110:-110);F.f=l?-1:1;ponerEstado(F,'guardia');
  }
  var fin=M.vic[0]===1&&M.vic[1]===1;
  M.cartel={txt:fin?'RONDA FINAL':'RONDA '+M.ronda,t:1.4,col:'#ffffff',arcade:true};
  Sonido.fx('ronda');
}
function entrar(lado,primero){
  var F=M.eq[lado][M.idx[lado]];
  F.y=ESC.suelo;F.enSuelo=true;F.f=lado?-1:1;
  if(primero){F.x=MUNDO_W/2+(lado?110:-110);ponerEstado(F,'guardia');}
  else{
    /* el relevo entra de un salto desde su lado */
    F.x=M.cam+(lado?1:-1)*(ANCHO/2+30);F.y=ESC.suelo-160;F.enSuelo=false;F.vy=-300;F.vx=(lado?-1:1)*260;
    ponerEstado(F,'entra');F.inv=1;Sonido.fx('entra');
    M.cartel={txt:F.L.nom,t:1.3,col:lado?'#ff9d8a':'#9fd8ff',chico:true};
  }
  M.act[lado]=F;
}
function vivos(lado){return M.eq[lado].filter(function(F){return !F.ko;}).length;}
function pasarPelea(dt){
  M.t+=dt;
  if(M.lento>0){M.lento-=dt;dt*=0.3;}
  if(M.cine){                    /* la cinemática del súper congela el mundo */
    M.cine.t+=dt;
    if(M.cine.t>=M.cine.dur){var Fc=M.cine.F;M.cine=null;ejecutarSuper(Fc);}
    FX.pasar(dt);return;
  }
  if(M.intro>0){
    var antes=M.intro;M.intro-=dt;
    if(antes>1.0&&M.intro<=1.0){Sonido.fx('peleen');M.cartel={txt:M.modo==='historia'?'¡A PELEAR!':'¡PELEEN!',t:1.0,col:'#ffd23a',arcade:M.modo!=='historia'};}
    for(var q=0;q<2;q++)pasarLuchador(M.act[q],dt);
    FX.pasar(dt);return;
  }
  /* el jugador: gestos y botones (o el piloto automático en las pruebas) */
  var P=M.act[0], E=M.act[1];
  /* entre rondas: los dos quedan quietos, el ganador festeja, se suman los bonos */
  if(M.entre>0){
    M.entre-=dt;
    if(M.bonus){M.bonus.t+=dt;if(M.bonus.t>1.6&&!M.bonus.sumado){M.bonus.sumado=true;M.puntos+=M.bonus.total;Sonido.fx('bonus');}}
    pasarLuchador(P,dt);pasarLuchador(E,dt);FX.pasar(dt);
    if(M.cartel){M.cartel.t-=dt;if(M.cartel.t<=0)M.cartel=null;}
    if(M.anuncio){M.anuncio.t-=dt;if(M.anuncio.t<=0)M.anuncio=null;}
    if(M.entre<=0)nuevaRonda();
    return;
  }
  if(M.modo==='demo'){pasarIA(P,dt,0.6);}
  else if(J.bot)pasarIA(P,dt,0.75);
  else controlJugador(P);
  if(!J.quietoE)pasarIA(E,dt,M.dificultad);
  pasarLuchador(P,dt);pasarLuchador(E,dt);
  /* que no se atraviesen */
  if(P.enSuelo&&E.enSuelo&&!P.ko&&!E.ko){
    var sep=(18*P.L.grosor+18*E.L.grosor)*TAM, d=E.x-P.x;
    if(Math.abs(d)<sep){var emp=(sep-Math.abs(d))/2*(d>=0?1:-1);P.x-=emp;E.x+=emp;}
  }
  pasarProy(dt);
  /* la cámara: al medio de los dos, sin salirse del mundo */
  var obj=lim((P.x+E.x)/2,ANCHO/2,MUNDO_W-ANCHO/2);
  M.cam+=(obj-M.cam)*Math.min(1,dt*6);
  if(!M.fin)M.reloj-=dt;
  if(M.comboVis){M.comboVis.t-=dt;if(M.comboVis.t<=0)M.comboVis=null;}
  if(M.cartel){M.cartel.t-=dt;if(M.cartel.t<=0)M.cartel=null;}
  if(M.anuncio){M.anuncio.t-=dt;if(M.anuncio.t<=0)M.anuncio=null;}
  var rondas=M.modo!=='historia';
  /* los relevos y el final */
  for(var l=0;l<2;l++){
    var F=M.act[l];
    if(F.ko&&F.est==='ko'&&F.tEst>1.0&&!M.fin&&!(M.entre>0)){
      if(rondas)finRonda(1-l);
      else if(M.idx[l]<M.eq[l].length-1){M.idx[l]++;entrar(l,false);}
      else terminarPelea(l===1?'gano':'perdio');
    }
  }
  if(M.reloj<=0&&!M.fin&&!(M.entre>0)){
    var pj=M.eq[0].reduce(function(a,F){return a+F.vida/F.vidaMax;},0), pe=M.eq[1].reduce(function(a,F){return a+F.vida/F.vidaMax;},0);
    M.cartel={txt:'¡TIEMPO!',t:1.6,col:'#ffd23a',arcade:rondas};
    if(rondas)finRonda(pj>=pe?0:1);else terminarPelea(pj>=pe?'gano':'perdio');
  }
  if(M.fin>0){
    M.fin-=dt;
    if(M.bonus){M.bonus.t+=dt;if(M.bonus.t>1.6&&!M.bonus.sumado){M.bonus.sumado=true;M.puntos+=M.bonus.total;Sonido.fx('bonus');}}
    if(M.fin<=0){
      if(M.modo==='arcade')arcadeFinPelea(M.resultado);
      else if(M.modo==='demo')nuevaDemo();
      else mostrarResultado();
    }
  }
  FX.pasar(dt);
}
function terminarPelea(res){
  M.resultado=res;M.fin=2.6;
  var gan=M.act[res==='gano'?0:1];
  if(gan&&!gan.ko)ponerEstado(gan,'victoria');
  M.cartel={txt:res==='gano'?(M.modo==='historia'?'¡VICTORIA!':'¡GANASTE!'):(M.modo==='historia'?'DERROTA':'PERDISTE'),t:2.4,col:res==='gano'?'#ffd23a':'#ff6a6a',arcade:M.modo!=='historia'};
  if(M.modo!=='demo')Sonido.fx(res==='gano'?'victoria':'derrota');
}
/* el jugador: cada gesto es una orden; los botones del súper y especiales van aparte */
function controlJugador(P){
  var dir=function(d){if(d==='arr')return'arriba';if(d==='aba')return'abajo';
    var der=d==='der';return (der===(P.f>0))?'adelante':'atras';};
  /* el mando de botones (los gestos quedan sólo para las pruebas) */
  mandoJugador(P);
  for(var i=0;i<Entrada.gestos.length;i++){
    var g=Entrada.gestos[i];
    orden(P,g.tipo==='toca'?'toca':dir(g.dir));
  }
  /* cubrirse */
  if(Entrada.cubre&&(P.est==='guardia'||P.est==='camina'))ponerEstado(P,'bloqueo');
  if(!Entrada.cubre&&P.est==='bloqueo'&&P.stun<=0)ponerEstado(P,'guardia');
  /* teclado */
  var T=Entrada;
  if(T.recien('KeyZ')||T.recien('KeyJ'))orden(P,'toca');
  if(T.recien('KeyX')||T.recien('KeyK'))orden(P,'adelante');
  if(T.recien('ArrowUp')||T.recien('KeyW'))orden(P,'arriba');
  if(T.recien('ArrowDown')||T.recien('KeyS'))orden(P,'abajo');
  if(T.recien('Digit1'))orden(P,'esp0');
  if(T.recien('Digit2'))orden(P,'esp1');
  if(T.recien('Digit3'))orden(P,'super');
  var mx=(T.tecla['ArrowRight']||T.tecla['KeyD']?1:0)-(T.tecla['ArrowLeft']||T.tecla['KeyA']?1:0);
  if(mx&&(P.est==='guardia'||P.est==='camina')){ponerEstado(P,'camina');P.est='camina';P.vx=mx*150*P.L.vel;}
  else if(!mx&&P.est==='camina')ponerEstado(P,'guardia');
}

/* ---------------- los assets: retratos, escenarios y el cofre, de Rezona ----------------
   Vienen por streaming desde jsDelivr (window.ARCHIVOS trae la URL de cada uno; en las versiones
   viejas traía el data: entero). El juego anda igual mientras llegan: se dibujan marcos y siluetas. */
function esImagen(v){return typeof v==='string'&&(v.indexOf('data:image')===0||/\.(avif|webp|png|jpe?g)(\?|$)/.test(v));}
function nuevaImg(src,listo){var im=new Image();if(src.indexOf('data:')!==0)im.crossOrigin='anonymous';im.onload=function(){listo(im);};im.src=src;return im;}
var IMG={};
/* los atlas de animación se decodifican sólo para los que están en escena, y se sueltan después:
   decodificados los doce no entran en la memoria de un teléfono */
var ANIM_META=null, ANIM_CARGA={};
function imgAnim(id){
  var n='anim-'+id;
  if(IMG[n])return IMG[n];
  var A=window.ARCHIVOS||{};
  if(!ANIM_CARGA[n]&&A[n]){ANIM_CARGA[n]=true;nuevaImg(A[n],function(im){if(ANIM_CARGA[n])IMG[n]=im;});}
  return null;
}
function soltarAnims(quedan){
  for(var n in ANIM_CARGA){var id=n.slice(5);if(quedan.indexOf(id)<0){delete ANIM_CARGA[n];if(IMG[n]){IMG[n].src='';delete IMG[n];}}}
}
function cargarAssets(){
  var A=window.ARCHIVOS||{};
  if(A.sprites&&typeof A.sprites==='object')SPR_META=A.sprites;     /* los cuadros de cada atlas */
  if(A.anim&&typeof A.anim==='object')ANIM_META=A.anim;              /* las animaciones de 24 cuadros */
  Object.keys(A).forEach(function(n){
    if(!esImagen(A[n]))return;
    if(n.indexOf('anim-')===0)return;       /* pesan mucho: se bajan y decodifican cuando el luchador entra */
    nuevaImg(A[n],function(im){IMG[n]=im;});
  });
}
/* el retrato recortado en círculo (o el rectángulo de una carta), mirando hacia donde toca */
function retrato(g,l,x,y,w,h,espejo,circulo,enfoque,sinFondo){
  var im=IMG['retrato-'+l];
  g.save();
  g.beginPath();if(circulo)g.arc(x+w/2,y+h/2,w/2,0,TAU);else g.rect(x,y,w,h);g.clip();
  if(!sinFondo){g.fillStyle='#1a1426';g.fillRect(x,y,w,h);}
  if(im){
    /* se encuadra la parte de arriba: la cara, no las botas */
    var e=enfoque||0.28, sc=Math.max(w/im.width,h/im.height)*(circulo?1.7:1.05);
    var dw=im.width*sc, dh=im.height*sc, dx=x+(w-dw)/2, dy=y-dh*e*(circulo?1:0.35)+(circulo?h*0.1:0);
    if(espejo){g.translate(x*2+w,0);g.scale(-1,1);}
    g.drawImage(im,dx,dy,dw,dh);
  } else {
    var L=LUCH[l];g.fillStyle=L.ropa;g.beginPath();g.arc(x+w/2,y+h*0.9,w*0.45,Math.PI,0);g.fill();
    g.fillStyle=L.piel;g.beginPath();g.arc(x+w/2,y+h*0.45,w*0.22,0,TAU);g.fill();
  }
  g.restore();
}

/* ---------------- el escenario ---------------- */
function dibujarEscenario(g,t){
  var im=IMG['escenario-'+M.esc], y0=ESC.y0, h=ESC.h;
  g.save();g.beginPath();g.rect(0,y0,ANCHO,h);g.clip();
  if(im){
    /* apaisado: el fondo tiene que cubrir el ancho con margen para el parallax */
    var ah=Math.max(h/(ESC.suelo-y0+h*0.12)*h*1.02,ANCHO*1.22*im.height/im.width), aw=ah*im.width/im.height;
    var k=(aw-ANCHO)/(MUNDO_W-ANCHO);            /* parallax: el fondo recorre su ancho mientras la cámara recorre el mundo */
    var x=-(M.cam-ANCHO/2)*k;
    g.drawImage(im,x,y0+h-ah,aw,ah);
  } else {
    g.fillStyle=lin(g,0,y0,0,y0+h,[[0,'#241a3a'],[1,'#0e0a18']]);g.fillRect(0,y0,ANCHO,h);
    g.fillStyle='#2a2234';g.fillRect(0,ESC.suelo,ANCHO,h);
  }
  /* viñeta y un poco de oscuridad para que los luchadores se lean */
  g.fillStyle=lin(g,0,y0,0,y0+h,[[0,'rgba(8,4,14,0.45)'],[0.4,'rgba(8,4,14,0.05)'],[0.85,'rgba(8,4,14,0.15)'],[1,'rgba(8,4,14,0.6)']]);
  g.fillRect(0,y0,ANCHO,h);
  g.restore();
}
function dibujarProy(g,p,t){
  if(p.espera&&p.t<p.espera){
    if(p.tipo==='pilar'||p.rayo){g.save();g.globalAlpha=0.5+0.5*Math.sin(t*30);g.fillStyle=p.rayo?'rgba(140,230,255,0.6)':'rgba(255,140,40,0.6)';
      g.beginPath();g.ellipse(p.x,ESC.suelo,34,7,0,0,TAU);g.fill();g.restore();}
    return;
  }
  g.save();
  switch(p.tipo){
    case 'aire':
      g.globalCompositeOperation='lighter';
      for(var i=0;i<3;i++){g.strokeStyle='rgba(220,240,255,'+(0.5-i*0.12)+')';g.lineWidth=5-i;g.beginPath();g.arc(p.x-Math.sign(p.vx)*i*12,p.y,p.r-i*5,t*8+i,t*8+i+4.2);g.stroke();}
      break;
    case 'fuego': case 'lluviaFuego':
      g.globalCompositeOperation='lighter';
      var tr=p.tipo==='fuego'?-Math.sign(p.vx):0, tv=p.tipo==='lluviaFuego'?-1:0;
      for(var j=0;j<5;j++){g.fillStyle='rgba(255,'+(160-j*20)+',40,'+(0.5-j*0.08)+')';g.beginPath();g.arc(p.x+tr*j*9,p.y+tv*j*10,p.r*(1-j*0.12),0,TAU);g.fill();}
      g.fillStyle='rgba(255,250,220,1)';g.beginPath();g.arc(p.x,p.y,p.r*0.45,0,TAU);g.fill();
      break;
    case 'pilar':
      var k=Math.min(1,(p.t-p.espera)/0.15), hP=200*k;
      g.globalCompositeOperation='lighter';
      g.fillStyle=lin(g,0,ESC.suelo-hP,0,ESC.suelo,[[0,'rgba(255,80,0,0)'],[0.4,'rgba(255,150,40,0.8)'],[1,'rgba(255,240,180,0.95)']]);
      g.beginPath();g.moveTo(p.x-26,ESC.suelo);g.quadraticCurveTo(p.x-18+Math.sin(t*30)*5,ESC.suelo-hP*0.6,p.x,ESC.suelo-hP);
      g.quadraticCurveTo(p.x+18+Math.sin(t*27)*5,ESC.suelo-hP*0.6,p.x+26,ESC.suelo);g.fill();
      break;
    case 'bolas':
      for(var b=0;b<2;b++){var an=t*20+b*Math.PI, bx=p.x+Math.cos(an)*14, by=p.y+Math.sin(an)*8;
        g.strokeStyle='#6b4a2a';g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(bx,by);g.stroke();
        g.strokeStyle=TINTA;g.lineWidth=2.5;circ(g,bx,by,6,'#bfe9ff');
        g.globalCompositeOperation='lighter';g.fillStyle=rad(g,bx,by,1,16,[[0,'rgba(160,240,255,0.9)'],[1,'rgba(60,160,255,0)']]);g.beginPath();g.arc(bx,by,16,0,TAU);g.fill();g.globalCompositeOperation='source-over';}
      break;
    case 'anzuelo':
      var D=p.dueño, mx=D.x+D.f*30, my=D.y-100*D.L.alto*TAM;
      g.fillStyle='#9a9aa6';for(var c=1;c<14;c++){var q=lerpP({x:mx,y:my},p,c/14);g.beginPath();g.arc(q.x,q.y,2,0,TAU);g.fill();}
      g.strokeStyle=TINTA;g.lineWidth=6;g.beginPath();g.arc(p.x,p.y+6,9,-Math.PI*0.5,Math.PI*0.9);g.stroke();
      g.strokeStyle='#8c6a4a';g.lineWidth=3;g.beginPath();g.arc(p.x,p.y+6,9,-Math.PI*0.5,Math.PI*0.9);g.stroke();
      break;
    case 'peces':
      g.globalCompositeOperation='lighter';
      for(var f=0;f<5;f++){var fx=p.x+Math.sin(t*6+f*1.7)*16-f*Math.sign(p.vx)*10, fy=p.y+Math.cos(t*5+f)*18;
        g.fillStyle='rgba(120,255,230,0.55)';g.beginPath();g.ellipse(fx,fy,10,5,0,0,TAU);g.fill();
        g.beginPath();g.moveTo(fx-Math.sign(p.vx)*8,fy);g.lineTo(fx-Math.sign(p.vx)*16,fy-6);g.lineTo(fx-Math.sign(p.vx)*16,fy+6);g.fill();}
      break;
    case 'bondi':
      g.translate(p.x,p.y);g.scale(Math.sign(p.vx)*1.4,1.4);g.lineJoin='round';dron(g,0,0,1,t);
      break;
    case 'palma':           /* una mano abierta de energía dorada */
      g.globalCompositeOperation='lighter';
      g.fillStyle=rad(g,p.x,p.y,2,p.r*1.6,[[0,'rgba(255,250,210,0.95)'],[0.4,'rgba(255,210,80,0.6)'],[1,'rgba(255,160,40,0)']]);
      g.beginPath();g.arc(p.x,p.y,p.r*1.6,0,TAU);g.fill();
      g.fillStyle='rgba(255,240,180,0.85)';
      for(var dd=0;dd<4;dd++){g.beginPath();g.ellipse(p.x+Math.sign(p.vx)*p.r*0.9,p.y-p.r*0.6+dd*p.r*0.4,p.r*0.45,p.r*0.13,0,0,TAU);g.fill();}
      g.beginPath();g.ellipse(p.x,p.y,p.r*0.7,p.r*0.8,0,0,TAU);g.fill();
      break;
    case 'arpon':
      var Da=p.dueño, hx=Da.x+Da.f*40, hy=Da.y-100*Da.L.alto*TAM;
      g.strokeStyle='#c9b48a';g.lineWidth=2;g.beginPath();g.moveTo(hx,hy);g.quadraticCurveTo((hx+p.x)/2,Math.max(hy,p.y)+10,p.x,p.y);g.stroke();
      g.save();g.translate(p.x,p.y);g.scale(Math.sign(p.vx),1);g.fillStyle='#9aa3b2';g.strokeStyle=TINTA;g.lineWidth=2;
      g.fillRect(-18,-2,18,4);g.beginPath();g.moveTo(0,-7);g.lineTo(12,0);g.lineTo(0,7);g.closePath();g.fill();g.stroke();g.restore();
      break;
    case 'mina':
      var km=p.t<p.espera?(p.t/p.espera):1;
      if(p.t<p.espera){g.fillStyle='#3a3a44';g.strokeStyle=TINTA;g.lineWidth=2.5;g.beginPath();g.arc(p.x,ESC.suelo-10,12,0,TAU);g.fill();g.stroke();
        for(var pu=0;pu<6;pu++){var ap=pu/6*TAU;g.beginPath();g.moveTo(p.x+Math.cos(ap)*12,ESC.suelo-10+Math.sin(ap)*12);g.lineTo(p.x+Math.cos(ap)*17,ESC.suelo-10+Math.sin(ap)*17);g.stroke();}
        g.fillStyle=Math.floor(p.t*12)%2?'#ff3a2a':'#5a1010';g.beginPath();g.arc(p.x,ESC.suelo-18,3,0,TAU);g.fill();}
      else{g.globalCompositeOperation='lighter';var re=lim((p.t-p.espera)/0.4,0,1), ex=ESC.suelo-30, ra=20+50*Math.min(1,re*2.5), al=1-re;
        g.fillStyle='rgba(255,90,20,'+(0.45*al)+')';g.beginPath();g.arc(p.x,ex,ra,0,TAU);g.fill();
        g.fillStyle='rgba(255,190,60,'+(0.55*al)+')';g.beginPath();g.arc(p.x,ex,ra*0.62,0,TAU);g.fill();
        g.fillStyle='rgba(255,250,220,'+(0.7*al)+')';g.beginPath();g.arc(p.x,ex,ra*0.3,0,TAU);g.fill();}
      break;
    case 'aullido':         /* ondas de sonido que se abren */
      g.globalCompositeOperation='lighter';
      for(var w=0;w<4;w++){var rr=p.r*(0.4+w*0.25)+Math.sin(t*20+w)*3;g.strokeStyle='rgba(255,200,110,'+(0.6-w*0.12)+')';g.lineWidth=4-w*0.6;
        g.beginPath();g.arc(p.x-Math.sign(p.vx)*w*10,p.y,rr,Math.sign(p.vx)>0?-1.1:Math.PI-1.1,Math.sign(p.vx)>0?1.1:Math.PI+1.1);g.stroke();}
      break;
    case 'bocha': case 'lluviaBochas':
      g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,255,255,0.25)';
      for(var tb=1;tb<5;tb++){g.beginPath();g.arc(p.x-(p.tipo==='bocha'?Math.sign(p.vx)*tb*8:0),p.y-(p.tipo==='bocha'?0:tb*9),p.r*(1-tb*0.15),0,TAU);g.fill();}
      g.globalCompositeOperation='source-over';g.strokeStyle=TINTA;g.lineWidth=2;circ(g,p.x,p.y,p.r*0.8,'#f6f6fa');
      g.strokeStyle='rgba(200,40,40,0.7)';g.beginPath();g.arc(p.x,p.y,p.r*0.5,t*10,t*10+2);g.stroke();
      break;
    case 'torpedo':
      g.save();g.translate(p.x,p.y);g.scale(Math.sign(p.vx),1);
      g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,160,60,0.5)';for(var bu=1;bu<6;bu++){g.beginPath();g.arc(-50-bu*12,Math.sin(t*20+bu)*6,10-bu,0,TAU);g.fill();}
      g.globalCompositeOperation='source-over';g.strokeStyle=TINTA;g.lineWidth=3;
      g.fillStyle='#5a6070';redondo(g,-50,-14,90,28,14);g.fill();g.stroke();
      g.fillStyle='#e8732a';g.fillRect(-10,-14,8,28);g.strokeRect(-10,-14,8,28);
      g.fillStyle='#3a3a44';g.beginPath();g.moveTo(-50,-4);g.lineTo(-64,-16);g.lineTo(-64,16);g.lineTo(-50,4);g.closePath();g.fill();g.stroke();
      g.restore();
      break;
    case 'colectivos':
      g.translate(p.x,p.y);g.scale(Math.sign(p.vx)*3.2,3.2);g.lineJoin='round';dron(g,0,0,1,t);
      break;
    case 'vapor':
      g.globalCompositeOperation='lighter';
      for(var v=0;v<7;v++){g.fillStyle='rgba(230,240,255,'+(0.18-v*0.015)+')';g.beginPath();g.arc(p.x-Math.sign(p.vx)*v*18,p.y+Math.sin(t*6+v)*20,p.r*(1-v*0.08),0,TAU);g.fill();}
      break;
    case 'rayos':

function dibujarPelea(g,t){
  dibujarEscenario(g,t);
  g.save();
  g.beginPath();g.rect(0,ESC.y0,ANCHO,ESC.h);g.clip();
  g.translate(ANCHO/2-M.cam,0);
  /* el golpe fuerte acerca la cámara sobre el impacto y vuelve */
  if(FX.zoom){var z=FX.zoom, kz=1+(z.k-1)*Math.sin(Math.min(1,z.t/z.tm)*Math.PI);
    g.translate(z.x,z.y);g.scale(kz,kz);g.translate(-z.x,-z.y);}
  /* el que está atacando va adelante */
  var a=M.act[0], b=M.act[1], orden2=b.golpeando&&!a.golpeando?[a,b]:[b,a];
  orden2.forEach(function(F){
    if(F.inv>0&&F.est==='entra'&&Math.floor(t*20)%2)return;
    dibujarTitere(g,F,t);
    if(F.est==='bloqueo'){g.save();g.globalCompositeOperation='lighter';g.strokeStyle='rgba(140,210,255,0.5)';g.lineWidth=3;
      g.beginPath();g.arc(F.x+F.f*18,F.y-90*F.L.alto*TAM,46,-1.2,1.2);g.stroke();g.restore();}
    if(F.quema>0){g.save();g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,120,30,0.25)';g.beginPath();g.ellipse(F.x,F.y-70,30,70,0,0,TAU);g.fill();g.restore();}
  });
  for(var i=0;i<M.proy.length;i++)dibujarProy(g,M.proy[i],t);
  FX.dibujar(g);
  g.restore();
  if(FX.vel>0)lineasVelocidad(g,Math.min(1,FX.vel*2.5),t);
  /* el marco del escenario: fileteado dorado */
  marcoFilete(g,2,ESC.y0-2,ANCHO-4,ESC.h+4,t,true);
}

/* ---------------- el HUD de la pelea (apaisado) ----------------
   Arriba y fino, sobre el escenario: retrato, barra de vida con rastro, nombre y reservas a
   cada lado; el reloj en un medallón al medio, con las rondas a los costados y la pausa abajo. */
function barraVida(g,x,y,w,h,f,fr,der,t){
  var inc=10;
  var forma=function(){g.beginPath();
    if(der){g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w,y+h);g.lineTo(x+inc,y+h);}
    else{g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w-inc,y+h);g.lineTo(x,y+h);}
    g.closePath();};
  g.save();
  g.fillStyle='rgba(0,0,0,0.7)';forma();g.fill();
  forma();g.clip();
  var d1=der?x+w*(1-fr):x;g.fillStyle='rgba(255,90,70,0.9)';g.fillRect(d1,y,w*fr,h);
  var d2=der?x+w*(1-f):x;
  g.fillStyle=lin(g,0,y,0,y+h,f>0.3?[[0,'#fff29a'],[0.5,'#ffc93a'],[1,'#d97a0a']]:[[0,'#ff9a8a'],[1,'#b01e1e']]);g.fillRect(d2,y,w*f,h);
  g.fillStyle='rgba(255,255,255,0.35)';g.fillRect(d2,y,w*f,h*0.3);
  /* el brillo que recorre la barra cuando queda poca vida */
  if(f<0.3&&f>0){var bt=(t*1.2)%1;g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,120,100,0.4)';g.fillRect(d2+(der?w*f*(1-bt):w*f*bt)-12,y,24,h);}
  g.restore();
  g.strokeStyle='#e8c46a';g.lineWidth=2;forma();g.stroke();
  g.strokeStyle='rgba(0,0,0,0.6)';g.lineWidth=1;forma();g.stroke();
}
function hudLado(g,lado,t){
  var F=M.act[lado], der=lado===1, s=der?-1:1;
  var cx=der?ANCHO-38:38, cy=36;
  /* el retrato, con el aro del color de su elemento */
  g.save();
  g.fillStyle='rgba(10,8,20,0.92)';g.beginPath();g.arc(cx,cy,28,0,TAU);g.fill();
  retrato(g,F.l,cx-26,cy-26,52,52,der,true);
  g.strokeStyle='rgb('+ELEM[F.elem].col+')';g.lineWidth=3;g.beginPath();g.arc(cx,cy,27,0,TAU);g.stroke();
  g.strokeStyle='#e8c46a';g.lineWidth=1.5;g.beginPath();g.arc(cx,cy,30.5,0,TAU);g.stroke();
  g.restore();
  /* la barra de vida */
  var bx0=der?ANCHO/2+42:74, bw=ANCHO/2-42-74;
  barraVida(g,bx0,16,bw,18,F.vida/F.vidaMax,F.rastro/F.vidaMax,der,t);

  var nx=der?bx0+bw:bx0;

  g.save();g.font='bold 12px Georgia, serif';var anchoNom=g.measureText(F.L.nom+(F.jefe?' ★':'')).width;g.restore();
  texto(g,F.C.nom,nx+s*(anchoNom+10),46,9,'#b9a67a',der?'right':'left',false);
  /* elemento, junto al retrato */
  g.fillStyle='rgb('+ELEM[F.elem].col+')';g.beginPath();g.arc(cx+s*22,cy+22,6,0,TAU);g.fill();
  g.strokeStyle=TINTA;g.lineWidth=1.5;g.stroke();
  /* los de reserva, chiquitos, abajo del nombre */
  var eq=M.eq[lado];
  for(var i=0,k=0;i<eq.length;i++){
    if(eq[i]===F)continue;
    var rx=nx+s*(11+k*25), ry=64;k++;
    g.save();g.globalAlpha=eq[i].ko?0.35:1;
    g.fillStyle='rgba(10,8,20,0.9)';g.beginPath();g.arc(rx,ry,11,0,TAU);g.fill();
    retrato(g,eq[i].l,rx-10,ry-10,20,20,der,true);
    g.strokeStyle='#e8c46a';g.lineWidth=1.2;g.beginPath();g.arc(rx,ry,11,0,TAU);g.stroke();
    if(eq[i].ko){g.strokeStyle='#ff4a5a';g.lineWidth=2.5;g.beginPath();g.moveTo(rx-7,ry-7);g.lineTo(rx+7,ry+7);g.moveTo(rx+7,ry-7);g.lineTo(rx-7,ry+7);g.stroke();}
    g.restore();
  }
}

/* las líneas de velocidad de historieta: rayos desde el borde hacia el centro del escenario */
function lineasVelocidad(g,k,t){
  var cx=ANCHO/2, cy=ESC.y0+ESC.h*0.5, R=Math.max(ANCHO,ESC.h)*0.75, n=46;
  g.save();g.beginPath();g.rect(0,ESC.y0,ANCHO,ESC.h);g.clip();
  g.fillStyle='rgba(255,255,255,'+(0.55*k).toFixed(3)+')';
  for(var i=0;i<n;i++){
    var sem=(i*7919+Math.floor(t*30)*131)%997/997, a=i/n*TAU+sem*0.12, r0=R*(0.42+sem*0.2), an=0.012+sem*0.018;
    g.beginPath();g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);
    g.lineTo(cx+Math.cos(a-an)*r0,cy+Math.sin(a-an)*r0);g.lineTo(cx+Math.cos(a+an)*r0,cy+Math.sin(a+an)*r0);g.fill();
  }
  g.restore();
}

/* ===========================================================================
   INTERFAZ — botones de pelea al apoyar el dedo, de menú al levantarlo sin correrlo
   ========================================================================= */
var UI={rects:[],apretado:null,
  limpiar:function(){this.rects.length=0;},
  boton:function(id,x,y,w,h,inmediato){this.rects.push({id:id,x:x,y:y,w:w,h:h,inm:!!inmediato});},
  bajo:function(x,y,soloInm){
    for(var k=this.rects.length-1;k>=0;k--){var r=this.rects[k];if(soloInm&&!r.inm)continue;
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r;}
    return null;
  },
  tocado:function(){for(var i=0;i<Entrada.toques.length;i++){var r=this.bajo(Entrada.toques[i].x,Entrada.toques[i].y,true);if(r)return r.id;}return null;},
  soltado:function(){
    var s=Entrada.suelta;
    if(!s||Math.abs(s.dx)>16||Math.abs(s.dy)>16)return null;
    var r=this.bajo(s.x,s.y), r0=this.bajo(s.x0,s.y0);
    return r&&r0&&r.id===r0.id&&!r.inm?r.id:null;
  },
  donde:function(id){for(var i=0;i<this.rects.length;i++)if(this.rects[i].id===id){var r=this.rects[i];return{x:r.x+r.w/2,y:r.y+r.h/2,inm:r.inm};}return null;}
};
function entra(retraso){
  var x=lim((J.tMenu-(retraso||0))/0.42,0,1);
  if(x<=0)return 0;
  var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);
}
function texto(g,txt,x,y,tam,col,al,borde){
  g.save();
  g.font='bold '+tam+'px Georgia,"Times New Roman",serif';
  g.textAlign=al||'center';g.textBaseline='middle';
  if(borde!==false){g.lineJoin='round';g.lineWidth=Math.max(2,tam*0.17);g.strokeStyle='rgba(10,5,14,0.9)';g.strokeText(txt,x,y);}
  g.fillStyle=col||'#fff';g.fillText(txt,x,y);
  g.restore();
}
function redondo(g,x,y,w,h,r){
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);
  g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
/* ---------------- el fileteado porteño: espirales, hojas y bandas de color ----------------
   Se dibuja una vez por tamaño y se guarda: los marcos no cuestan nada por cuadro */
var CACHE_FILETE={};
function voluta(g,x,y,esc,rot,col){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(esc,esc);
  g.lineCap='round';

  g.strokeStyle='#2a1406';g.lineWidth=5;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(18,-2,30,-14,26,-26);g.bezierCurveTo(22,-36,8,-32,10,-22);g.stroke();
  g.strokeStyle=col||'#e8c25a';g.lineWidth=2.6;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(18,-2,30,-14,26,-26);g.bezierCurveTo(22,-36,8,-32,10,-22);g.stroke();
  /* las hojas de acanto */
  var hojas=[[12,-3,0.5,'#c0392b'],[22,-10,1.1,'#1e7a4a'],[27,-20,1.8,'#2a5db0']];
  hojas.forEach(function(h){
    g.save();g.translate(h[0],h[1]);g.rotate(h[2]);
    g.fillStyle=h[3];g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(6,-8,14,-2);g.quadraticCurveTo(7,1,0,0);g.fill();
    g.strokeStyle='#2a1406';g.lineWidth=1.2;g.stroke();
    g.strokeStyle='rgba(255,240,200,0.7)';g.lineWidth=0.8;g.beginPath();g.moveTo(2,-1);g.lineTo(10,-2.5);g.stroke();
    g.restore();
  });
  g.fillStyle='#e8c25a';g.beginPath();g.arc(10,-22,2.2,0,TAU);g.fill();

  fondoMenu(g,t,BARRIOS[Math.min(2,Math.floor((Math.min(15,Prog.avance)-1)/5))].esc);
  /* el camino */
  g.save();g.strokeStyle='rgba(232,194,90,0.55)';g.lineWidth=4;g.setLineDash([2,12]);g.lineDashOffset=-t*18;g.lineCap='round';
  g.beginPath();for(var n=1;n<=15;n++){var q=posNodoMapa(n);g[n===1?'moveTo':'lineTo'](q.x,q.y);}g.stroke();g.restore();
  /* los carteles de cada barrio, arriba de su primera pelea */
  for(var b=0;b<3;b++){
    var p1=posNodoMapa(b*5+1), p5=posNodoMapa(b*5+5), xb=(p1.x+p5.x)/2, yb=96;
    if(xb<-140||xb>ANCHO+140)continue;
    g.save();g.fillStyle='rgba(14,8,24,0.85)';redondo(g,xb-120,yb-16,240,32,6);g.fill();
    marcoFilete(g,xb-120,yb-16,240,32,t,true);
    texto(g,BARRIOS[b].nom,xb,yb+1,14,'#ffd23a');g.restore();
  }
  for(var m=1;m<=15;m++){
    var P=posNodoMapa(m);if(P.x<-60||P.x>ANCHO+60)continue;
    var libre=m<=Prog.avance, jefe=m%5===0, pe=peleaDe(m), est=Prog.estrellas[m]||0;
    var e=entra(0.04+Math.min(6,Math.abs(m-Prog.avance))*0.05);
    var r=jefe?38:30, ap=UI.apretado==='pelea:'+m;
    g.save();g.globalAlpha=Math.min(1,e*1.4)*(libre?1:0.5);g.translate(P.x,P.y);var es=e*(ap?0.92:1);g.scale(es,es);
    if(m===Prog.avance)halo(g,0,0,r*2+Math.sin(t*4)*4,'255,210,90',0.45);
    g.fillStyle='rgba(14,8,24,0.95)';g.beginPath();g.arc(0,0,r,0,TAU);g.fill();
    var lider=pe.equipo[pe.equipo.length-1];
    if(libre)retrato(g,cartaDe(lider.id).l,-r+3,-r+3,r*2-6,r*2-6,true,true);
    else icono(g,'candado',0,0,22,'#8a7a5a');
    g.strokeStyle=jefe?'#ff6a4a':'#d8b25a';g.lineWidth=jefe?4:3;g.beginPath();g.arc(0,0,r,0,TAU);g.stroke();
    g.fillStyle='#1a0e06';g.beginPath();g.arc(-r*0.8,r*0.7,11,0,TAU);g.fill();g.strokeStyle='#d8b25a';g.lineWidth=1.5;g.stroke();
    texto(g,String(m),-r*0.8,r*0.7+0.5,10,'#f3e6c4',null,false);
    for(var s2=0;s2<3;s2++)icono(g,'estrella',(s2-1)*14,-r-8,12,s2<est?'#ffd23a':'rgba(255,255,255,0.2)');
    if(jefe)texto(g,'JEFE',0,r+14,10,'#ff9d8a');
    g.restore();
    if(libre)UI.boton('pelea:'+m,P.x-r,P.y-r,r*2,r*2);
  }
  /* bordes que se funden, y una pista de que se arrastra */
  g.fillStyle=lin(g,0,0,60,0,[[0,'rgba(14,8,24,0.9)'],[1,'rgba(14,8,24,0)']]);g.fillRect(0,0,60,ALTO);
  g.fillStyle=lin(g,ANCHO-60,0,ANCHO,0,[[0,'rgba(14,8,24,0)'],[1,'rgba(14,8,24,0.9)']]);g.fillRect(ANCHO-60,0,60,ALTO);
  g.fillStyle=lin(g,0,0,0,70,[[0,'rgba(14,8,24,0.95)'],[1,'rgba(14,8,24,0)']]);g.fillRect(0,0,ANCHO,70);
  cabecera(g,'MAPA DEL ARRABAL',t);
  g.save();g.globalAlpha=0.55+0.25*Math.sin(t*3);texto(g,'◀  ARRASTRÁ PARA RECORRER  ▶',ANCHO/2,ALTO-18,10,'#d8b25a',null,false);g.restore();
}
function pasarScrollX(dt,max){
  if(Entrada.tocando){J.velS=-Entrada.acx/Math.max(dt,1e-3);J.scroll-=Entrada.acx;}
  else{J.scroll+=J.velS*dt;J.velS*=Math.pow(0.04,dt);}
  J.scroll=lim(J.scroll,0,Math.max(0,max));
}
function pasarScroll(dt,max){
  if(Entrada.tocando){J.velS=Entrada.acy/Math.max(dt,1e-3);J.scroll+=Entrada.acy;}
  else{J.scroll+=J.velS*dt;J.velS*=Math.pow(0.04,dt);}
  J.scroll=lim(J.scroll,-Math.max(0,max),0);        /* las listas suben al arrastrar para arriba */
}

function tocarEquipo(id){
  if(id.indexOf('sacar:')===0){var s=+id.split(':')[1];if(Prog.equipo.length>1){Prog.equipo.splice(s,1);Sonido.fx('pasa');}else Sonido.fx('no');guardarProg();return true;}
  if(id.indexOf('elegir:')===0){
    var c=id.split(':')[1], i=Prog.equipo.indexOf(c);
    if(i>=0){if(Prog.equipo.length>1)Prog.equipo.splice(i,1);else{Sonido.fx('no');return true;}}
    else if(Prog.equipo.length<3)Prog.equipo.push(c);
    else{Prog.equipo[2]=c;}
    Sonido.fx('blip');guardarProg();return true;
  }
  return false;
}

/* ---------------- el relicario: el cofre se sacude, se abre y sale una carta ---------------- */
var PROB_RAREZA=[['bronce',0.58],['plata',0.28],['oro',0.115],['diamante',0.025]];
function sortearCarta(){
  var r=Math.random(), acc=0, rar='bronce';
  for(var i=0;i<PROB_RAREZA.length;i++){acc+=PROB_RAREZA[i][1];if(r<acc){rar=PROB_RAREZA[i][0];break;}}
  var pool=CARTAS.filter(function(c){return c.r===rar;});
  return pool[Math.floor(Math.random()*pool.length)].id;
}
function abrirCofre(){
  if(Prog.fichas<=0||J.cofre){Sonido.fx('no');return;}
  Prog.fichas--;
  var id=sortearCarta(), nueva=!Prog.cartas[id];
  if(nueva)Prog.cartas[id]=cartaNueva(id);
  else Prog.cartas[id].estrellas=Math.min(5,(Prog.cartas[id].estrellas||0)+1);
  guardarProg();
  J.cofre={t:0,id:id,nueva:nueva,sono:{}};
  Sonido.fx('cofre');vibrar(30);
}
function pasarRelicario(dt){
  var c=J.cofre;if(!c)return;
  c.t+=dt;
  if(c.t>0.9&&!c.sono.abre){c.sono.abre=true;Sonido.fx('abre');FX.flash=0.9;FX.sacudir(8);vibrar(60);}
  var r=cartaDe(c.id).r;
  if(c.t>1.6&&!c.sono.rev){c.sono.rev=true;Sonido.fx(r==='oro'||r==='diamante'?'legend':'revela');}
}
function dibujarRelicario(g,t){
  fondoMenu(g,t,'riachuelo');
  cabecera(g,'EL RELICARIO',t,'#ffb0e0');
  var c=J.cofre, cx=ANCHO*0.36, cy=ALTO*0.55;
  var im=IMG.relicario, w=Math.min(270,ALTO*0.62), h=im?w*im.height/im.width:w*0.8;
  if(!c||c.t<1.1){
    /* el cofre flota; cuando se abre, tiembla cada vez más */
    var sac=c?Math.pow(c.t/0.9,2)*10:0, dx=c?(az()-0.5)*sac:0, dy=Math.sin(t*2)*6+(c?(az()-0.5)*sac:0);
    halo(g,cx,cy,w*0.8,'255,200,120',0.25+(c?c.t*0.4:0.1*Math.sin(t*3)));
    if(im)g.drawImage(im,cx-w/2+dx,cy-h/2+dy,w,h);
    else{g.fillStyle='#6a3a1a';redondo(g,cx-w/2,cy-h/3,w,h*0.66,10);g.fill();}
    if(c&&c.t>0.85){g.fillStyle='rgba(255,250,230,'+((c.t-0.85)/0.25)+')';g.fillRect(0,0,ANCHO,ALTO);}

/* ---------------- el mando: cruceta flotante a la izquierda, botones a la derecha ----------------
   Cada cuadro se mira dónde está cada dedo (Entrada.dedos): el que arrancó en la mitad izquierda
   es el palito (su base aparece donde se apoyó); los demás aprietan el botón que tengan debajo,
   y se puede correr el dedo de un botón a otro sin levantarlo. Los golpes salen al APOYAR. */
var Mando={
  palo:null,             /* {id, bx, by, x, y}: el dedo del palito y su base */
  dx:0, dy:0,            /* hacia dónde apunta el palito, -1..1 */
  antes:{}, ahora:{},    /* botones apretados el cuadro anterior y este */
  arribaAntes:false, abajoAntes:false, ultimoLado:0, tLado:0,
  R:58,
  botones:function(){
    var W=ANCHO, H=ALTO;
    return [
      {id:'golpe', x:W-90,  y:H-82,  r:44, nom:'GOLPE',  ic:'puno', col:'#ffd23a'},
      {id:'fuerte',x:W-196, y:H-60,  r:34, nom:'FUERTE', ic:'pie',  col:'#ff8a4a'},
      {id:'esp0',  x:W-186, y:H-150, r:31, nom:'',       ic:'rayo', col:'#8fd3ff'},
      {id:'esp1',  x:W-104, y:H-188, r:31, nom:'',       ic:'rayo', col:'#8fd3ff'},
      {id:'super', x:W-282, y:H-118, r:33, nom:'SÚPER',  ic:'estrella', col:'#ffb0e0'},
      {id:'bloqueo',x:196,  y:H-54,  r:30, nom:'CUBRIR', ic:'escudo', col:'#bff0ff'}
    ];
  },
  reiniciar:function(){this.palo=null;this.dx=this.dy=0;this.antes={};this.ahora={};this.arribaAntes=this.abajoAntes=false;},
  /* se llama una vez por paso de la pelea */
  leer:function(){
    var bs=this.botones(), vivos={}, ahora={};
    for(var k in Entrada.dedos){
      var d=Entrada.dedos[k];vivos[k]=true;
      if(this.palo&&this.palo.id===k)continue;
      /* un dedo nuevo en la mitad izquierda (y no sobre CUBRIR) es el palito */
      var sobreB=null;
      for(var i=0;i<bs.length;i++){var b=bs[i],ex=d.x-b.x,ey=d.y-b.y;if(ex*ex+ey*ey<Math.pow(b.r*1.25,2)){sobreB=b;break;}}
      if(!this.palo&&!d.mando&&!sobreB&&d.x0<ANCHO*0.45&&d.y0>ALTO*0.3){
        this.palo={id:k,bx:lim(d.x0,70,ANCHO*0.4),by:lim(d.y0,ALTO*0.45,ALTO-70)};d.mando=true;continue;
      }
      d.mando=true;
      if(sobreB)ahora[sobreB.id]=true;
    }
    if(this.palo&&!vivos[this.palo.id])this.palo=null;
    if(this.palo){
      var p=Entrada.dedos[this.palo.id], vx=p.x-this.palo.bx, vy=p.y-this.palo.by, L=Math.sqrt(vx*vx+vy*vy), R=this.R;
      /* la base sigue al dedo si se va muy lejos: no hay que volver a buscarla */
      if(L>R*1.4){this.palo.bx=p.x-vx/L*R*1.4;this.palo.by=p.y-vy/L*R*1.4;vx=p.x-this.palo.bx;vy=p.y-this.palo.by;L=R*1.4;}
      this.dx=L>12?lim(vx/R,-1,1):0;this.dy=L>12?lim(vy/R,-1,1):0;
    } else {this.dx=this.dy=0;}
    this.antes=this.ahora;this.ahora=ahora;
  },
  recien:function(id){return !!this.ahora[id]&&!this.antes[id];},
  apretado:function(id){return !!this.ahora[id];}
};
/* las órdenes del mando para el jugador */
function mandoJugador(P,dt){
  var Md=Mando;
  Md.leer();
  if(Md.recien('golpe'))orden(P,'toca');
  if(Md.recien('fuerte'))orden(P,'adelante');
  if(Md.recien('esp0'))orden(P,'esp0');
  if(Md.recien('esp1'))orden(P,'esp1');
  if(Md.recien('super'))orden(P,'super');
  /* el palito: arriba salta (en diagonal si también va de costado), abajo barre, al costado camina.
     Dos toques rápidos hacia un lado: corrida o paso atrás */
  var arriba=Md.dy<-0.55, abajo=Md.dy>0.6, lado=Math.abs(Md.dx)>0.35?(Md.dx>0?1:-1):0;
  if(arriba&&!Md.arribaAntes){
    var libre=P.est==='guardia'||P.est==='camina';
    if(libre&&P.enSuelo&&lado)saltar(P,lado*0.9);else orden(P,'arriba');
  }
  if(abajo&&!Md.abajoAntes)orden(P,'abajo');
  Md.arribaAntes=arriba;Md.abajoAntes=abajo;
  if(lado&&lado!==Md.ultimoLado){
    if(J.t-Md.tLado<0.28&&Md.ladoSoltado===lado)orden(P,(lado===P.f)?'adelante':'atras');
    Md.tLado=J.t;Md.ladoSoltado=0;
  }
  if(!lado&&Md.ultimoLado)Md.ladoSoltado=Md.ultimoLado;
  Md.ultimoLado=lado;
  /* cubrirse: el botón CUBRIR, o tirar el palito para atrás cuando el rival ataca */
  var R=rival(P), atras=lado&&lado!==P.f;
  var amenaza=R&&((R.est==='ataque'&&R.mov&&R.fr<R.mov.act[1]+2)||M.proy.some(function(p){return p.dueño===R;}));
  Entrada.cubre=Md.apretado('bloqueo')||(atras&&amenaza&&P.enSuelo)||!!Entrada.tecla['Space'];
  if(!arriba&&!abajo&&lado&&!Entrada.cubre&&(P.est==='guardia'||P.est==='camina')){
    ponerEstado(P,'camina');P.est='camina';P.vx=lado*150*P.L.vel*(lado===P.f?1:0.8);
  } else if(!lado&&P.est==='camina'&&!Entrada.tecla['ArrowLeft']&&!Entrada.tecla['ArrowRight']&&!Entrada.tecla['KeyA']&&!Entrada.tecla['KeyD'])ponerEstado(P,'guardia');
}
/* ---------------- el dibujo del mando: vidrio oscuro, borde dorado, íconos grandes ---------------- */
function iconoMando(g,ic,s,col){
  g.save();g.fillStyle=col;g.strokeStyle=col;g.lineWidth=s*0.14;g.lineJoin='round';g.lineCap='round';
  if(ic==='puno'){                       /* un puño de frente */
    redondo(g,-s*0.42,-s*0.3,s*0.84,s*0.62,s*0.18);g.fill();
    g.fillStyle='rgba(0,0,0,0.35)';for(var i=1;i<4;i++)g.fillRect(-s*0.42+i*s*0.21,-s*0.3,s*0.03,s*0.3);
    g.fillStyle=col;redondo(g,-s*0.3,s*0.28,s*0.6,s*0.22,s*0.08);g.fill();
  } else if(ic==='pie'){                 /* un puño envuelto en fuego: el golpe fuerte */
    g.globalAlpha=0.9;
    g.beginPath();g.moveTo(-s*0.55,s*0.1);g.quadraticCurveTo(-s*0.35,-s*0.55,-s*0.05,-s*0.2);g.quadraticCurveTo(-s*0.05,-s*0.62,s*0.25,-s*0.5);
    g.quadraticCurveTo(s*0.1,-s*0.2,s*0.55,-s*0.1);g.lineTo(s*0.2,s*0.45);g.lineTo(-s*0.4,s*0.45);g.closePath();g.fill();
    g.globalAlpha=1;g.fillStyle='#1a0e06';
    redondo(g,-s*0.3,-s*0.08,s*0.6,s*0.42,s*0.12);g.fill();
    g.fillStyle=col;redondo(g,-s*0.24,-s*0.03,s*0.48,s*0.32,s*0.1);g.fill();
    g.fillStyle='rgba(0,0,0,0.35)';for(var j=1;j<3;j++)g.fillRect(-s*0.24+j*s*0.16,-s*0.03,s*0.025,s*0.16);
  } else if(ic==='escudo'){
    g.beginPath();g.moveTo(0,-s*0.5);g.lineTo(s*0.42,-s*0.32);g.lineTo(s*0.36,s*0.12);g.quadraticCurveTo(s*0.2,s*0.42,0,s*0.52);
    g.quadraticCurveTo(-s*0.2,s*0.42,-s*0.36,s*0.12);g.lineTo(-s*0.42,-s*0.32);g.closePath();g.fill();
  } else icono(g,ic,0,0,s,col);
  g.restore();
}
function dibujarControles(g,t){
  var P=M.act[0];if(!P)return;
  var bs=Mando.botones();
  g.save();
  /* el palito: la base donde está (o dónde aparece), la perilla donde apunta */
  var bx=Mando.palo?Mando.palo.bx:118, by=Mando.palo?Mando.palo.by:ALTO-104, R=Mando.R;
  g.globalAlpha=Mando.palo?0.9:0.55;
  g.fillStyle='rgba(10,6,20,0.45)';g.beginPath();g.arc(bx,by,R+10,0,TAU);g.fill();
  g.strokeStyle='rgba(216,178,90,0.8)';g.lineWidth=2;g.beginPath();g.arc(bx,by,R+10,0,TAU);g.stroke();
  /* las cuatro flechas */
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(function(v){
    var on=(v[1]<0&&Mando.dy<-0.55)||(v[1]>0&&Mando.dy>0.6)||(v[0]&&Math.sign(Mando.dx)===v[0]&&Math.abs(Mando.dx)>0.35);
    g.save();g.translate(bx+v[0]*R*0.72,by+v[1]*R*0.72);g.rotate(Math.atan2(v[1],v[0]));
    g.fillStyle=on?'#ffe36a':'rgba(243,230,196,0.7)';g.beginPath();g.moveTo(9,0);g.lineTo(-5,-8);g.lineTo(-5,8);g.closePath();g.fill();g.restore();
  });
  var kx=bx+Mando.dx*R*0.8, ky=by+Mando.dy*R*0.8;
  g.fillStyle=rad(g,kx-6,ky-8,2,30,[[0,'#6a5a8a'],[1,'#241a38']]);g.beginPath();g.arc(kx,ky,26,0,TAU);g.fill();
  g.strokeStyle='#d8b25a';g.lineWidth=2.5;g.beginPath();g.arc(kx,ky,26,0,TAU);g.stroke();
  if(!Mando.palo){g.globalAlpha=0.5;texto(g,'MOVER',bx,by+R+22,10,'#d8b25a',null,false);}
  g.globalAlpha=1;
  /* los botones */
  bs.forEach(function(b){
    var ap=Mando.apretado(b.id), listo=true, fr=0, nom=b.nom;
    if(b.id==='esp0'||b.id==='esp1'){var k=b.id==='esp0'?0:1;listo=P.cd[k]<=0;fr=listo?0:P.cd[k]/(P.L.esp[k].cd||1);nom=P.L.esp[k].nom;}
    if(b.id==='super'){listo=P.med>=2;}
    g.save();g.translate(b.x,b.y);var e=ap?0.9:1;g.scale(e,e);
    if(listo&&(b.id==='super'))halo(g,0,0,b.r*2,'255,170,220',0.3+0.2*Math.sin(t*6));
    g.globalAlpha=0.88;
    g.fillStyle=ap?'rgba(255,220,120,0.55)':'rgba(12,8,24,0.62)';g.beginPath();g.arc(0,0,b.r,0,TAU);g.fill();
    if(fr>0){g.fillStyle='rgba(0,0,0,0.55)';g.beginPath();g.moveTo(0,0);g.arc(0,0,b.r,-Math.PI/2,-Math.PI/2+TAU*fr);g.closePath();g.fill();}
    g.globalAlpha=1;
    g.strokeStyle=listo?b.col:'rgba(140,120,90,0.8)';g.lineWidth=ap?4:2.5;g.beginPath();g.arc(0,0,b.r,0,TAU);g.stroke();
    g.strokeStyle='rgba(255,255,255,0.18)';g.lineWidth=1;g.beginPath();g.arc(0,0,b.r-4,Math.PI*1.1,Math.PI*1.9);g.stroke();
    iconoMando(g,b.ic,b.r*0.62,listo?b.col:'#7a6a50');
    if(!listo&&fr>0)texto(g,String(Math.ceil(P.cd[b.id==='esp0'?0:1])),0,1,15,'#fff',null,false);
    g.restore();
    if(nom){var ny=b.y+b.r+9;texto(g,nom.length>13?nom.slice(0,12)+'…':nom,b.x,ny,nom.length>9?7.5:9,listo?'#f3e6c4':'#8a7a5a',null,false);}
  });
  /* el medidor de súper, al lado del botón */
  var sb=bs[4], mw=66, mx=sb.x-mw/2, my=sb.y-sb.r-18;
  for(var i=0;i<3;i++){
    var f=lim(P.med-i,0,1), x=mx+i*(mw/3+1);
    g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(x,my,mw/3-2,7);
    if(f>0){g.fillStyle=f>=1?'#ffb0e0':'#8fd3ff';g.fillRect(x,my,(mw/3-2)*f,7);}
  }
  g.restore();
}
