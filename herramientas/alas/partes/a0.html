<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06101c">
<title>ALAS · DUELO AÉREO</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06101c;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:'Bahnschrift','DIN Alternate','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;color:#eaf4ff}
:root{--cian:#5fd4ff;--cian2:#2a9dd6;--oro:#ffc44d;--rojo:#ff4a3d;--verde:#6dffa8;--vidrio:rgba(8,20,36,.62);--linea:rgba(140,210,255,.35)}
#pantalla{position:fixed;inset:0;overflow:hidden;background:#06101c}
@media (orientation: portrait){
  #pantalla{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
  @supports (width:100dvh){ #pantalla{width:100dvh;height:100dvw;transform:translateX(100dvw) rotate(90deg)} }
}
#lienzo3d,#hud,#mg{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud,#mg{pointer-events:none}
#mg{display:none}#mg.ver{display:block}
#nube{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(235,242,250,.55),rgba(235,242,250,.92));opacity:0;transition:opacity .25s}
/* ---------- mandos ---------- */
#mandos{position:absolute;inset:0;pointer-events:none;display:none}
#mandos.ver{display:block}
#zonaStick{position:absolute;left:0;top:44px;bottom:0;width:46%;pointer-events:auto}
#zonaMirar{position:absolute;left:46%;right:0;top:44px;bottom:0;pointer-events:auto;cursor:grab}
#ojo{position:absolute;left:50%;top:52px;transform:translateX(-50%);font:bold 11px Bahnschrift,'Arial Narrow',Arial;letter-spacing:2px;color:#9fe3ff;opacity:0;transition:opacity .25s;pointer-events:none;text-shadow:0 0 6px #000}
#ojo.ver{opacity:.85}
#stick{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(160,220,255,.35);background:radial-gradient(circle,rgba(20,40,70,.18),rgba(20,40,70,.38));
  left:120px;top:calc(100% - 120px);pointer-events:none;transition:opacity .2s;opacity:.55}
#stick.activo{opacity:1}
#stick::before,#stick::after{content:'';position:absolute;left:50%;top:50%;background:rgba(160,220,255,.25)}
#stick::before{width:1px;height:70%;transform:translate(-50%,-50%)}#stick::after{height:1px;width:70%;transform:translate(-50%,-50%)}
#perilla{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(230,245,255,.9),rgba(95,212,255,.55) 60%,rgba(40,120,200,.6));
  box-shadow:0 0 18px rgba(95,212,255,.5)}
.bt{position:absolute;pointer-events:auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(10,24,44,.42);border:2px solid rgba(160,220,255,.5);color:#eaf4ff;font-size:10px;letter-spacing:1.5px;font-weight:bold;text-shadow:0 1px 2px #000;
  box-shadow:0 0 0 1px rgba(0,0,0,.3) inset}
.bt svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bt.apretado{background:rgba(95,212,255,.35);border-color:#bff0ff;transform:scale(.94)}
.bt small{font-size:10px;margin-top:1px}
#bFuego{right:22px;bottom:22px;width:104px;height:104px;border-color:rgba(255,120,90,.8);background:rgba(90,20,14,.35)}
#bMisil{right:136px;bottom:64px;width:74px;height:74px}
#bMisil.listo{border-color:var(--rojo);background:rgba(255,74,61,.3);animation:late .5s infinite}
#bTurbo{right:218px;bottom:18px;width:64px;height:64px}
#bFreno{right:142px;bottom:-2px;width:56px;height:56px;opacity:.9}
#bBengala{right:40px;bottom:140px;width:60px;height:60px}
#bCamara{right:62px;top:10px;width:40px;height:40px;border-radius:8px}
#bPausa{top:10px;right:12px;width:40px;height:40px;border-radius:8px;flex-direction:row;gap:5px}
#bPausa i{display:block;width:4px;height:15px;background:#eaf4ff}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* ---------- capas (menús) ---------- */
.capa{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:10px;
  padding:14px 22px;text-align:center;overflow-y:auto;touch-action:none;overscroll-behavior:contain;scrollbar-width:thin}
.capa.ver{display:flex}
.capa.ver > *{animation:sube .5s cubic-bezier(.2,.9,.25,1.1) both}
.capa.ver > *:nth-child(2){animation-delay:.06s}.capa.ver > *:nth-child(3){animation-delay:.12s}.capa.ver > *:nth-child(4){animation-delay:.18s}.capa.ver > *:nth-child(5){animation-delay:.24s}
.capa.velo{background:linear-gradient(100deg,rgba(4,12,24,.92),rgba(4,12,24,.7) 55%,rgba(4,12,24,.45))}
@keyframes sube{from{opacity:0;transform:translateY(14px) skewX(-4deg);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes barre{0%{background-position:-220% 0}100%{background-position:220% 0}}
@keyframes brilla{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes entraIzq{from{opacity:0;transform:translateX(-40px) skewX(-12deg)}to{opacity:1;transform:none}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(95,212,255,.55)}100%{box-shadow:0 0 0 14px rgba(95,212,255,0)}}
.logo{position:relative;display:flex;align-items:flex-end;gap:14px;line-height:.82}
.logo .alas{font-weight:900;font-style:italic;font-size:min(20vw,26vh,150px);letter-spacing:-2px;color:transparent;
  background:linear-gradient(100deg,#9fb6c9 0%,#fff 30%,#7fa6c4 45%,#fff 52%,#c9dceb 70%,#8ea9bf 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;
  animation:barre 5s linear infinite;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35)) drop-shadow(0 0 24px rgba(95,212,255,.35))}
.logo .ala{position:absolute;left:-4%;top:48%;width:108%;height:6px;background:linear-gradient(90deg,transparent,var(--cian),#fff,var(--cian),transparent);transform:skewX(-30deg);
  opacity:.85;filter:blur(.4px);animation:brilla 2.4s ease-in-out infinite}
.sub{font-size:13px;letter-spacing:10px;color:#bfe6ff;margin-right:-10px;text-shadow:0 0 12px rgba(95,212,255,.6)}
.botones{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.boton{font:inherit;font-weight:bold;font-size:15px;letter-spacing:4px;padding:11px 22px;min-width:160px;color:#eaf4ff;cursor:pointer;text-transform:uppercase;position:relative;overflow:hidden;
  background:linear-gradient(90deg,rgba(20,50,86,.85),rgba(10,26,48,.75));border:1px solid var(--linea);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);
  transition:transform .15s,background .15s}
.boton::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:250% 100%;animation:barre 3.2s linear infinite;pointer-events:none}
.boton::after{content:'';position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--cian);box-shadow:0 0 10px var(--cian)}
.boton:active{transform:scale(.96);background:linear-gradient(90deg,rgba(95,212,255,.6),rgba(40,120,200,.6))}
.boton.oro::after{background:var(--oro);box-shadow:0 0 10px var(--oro)}.boton.rojo::after{background:var(--rojo);box-shadow:0 0 10px var(--rojo)}
.boton.gris::after{background:#6f8aa3;box-shadow:none}.boton.verde::after{background:var(--verde);box-shadow:0 0 10px var(--verde)}
.boton.chico{min-width:0;font-size:12px;padding:7px 14px;letter-spacing:2px}
h2{margin:0;font-size:26px;letter-spacing:8px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 0 18px rgba(95,212,255,.45)}
h2 small{display:block;font-size:11px;letter-spacing:5px;color:var(--cian);font-weight:normal;font-style:normal;margin-bottom:2px}
.panel{background:var(--vidrio);border:1px solid var(--linea);padding:10px 14px;max-width:820px;width:100%;position:relative;backdrop-filter:blur(3px)}
.panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--cian)}
.panel::before{left:-2px;top:-2px;border-right:0;border-bottom:0}.panel::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
#dinero{position:absolute;top:12px;left:16px;font-size:14px;letter-spacing:2px;color:var(--oro);font-weight:bold;text-shadow:0 0 10px rgba(255,196,77,.5);z-index:2}
/* portada: columna a la izquierda sobre el vuelo en vivo */
#capaTitulo{align-items:flex-start;text-align:left;padding-left:6%;background:linear-gradient(90deg,rgba(3,10,20,.8),rgba(3,10,20,.25) 55%,transparent)}
#capaTitulo > .botones{flex-direction:column;align-items:stretch;width:min(300px,40%);gap:7px}
#capaTitulo > .botones .boton{text-align:left;animation:entraIzq .55s cubic-bezier(.2,.9,.25,1.1) both}
#capaTitulo > .botones .boton:nth-child(1){animation-delay:.35s}#capaTitulo > .botones .boton:nth-child(2){animation-delay:.43s}
#capaTitulo > .botones .boton:nth-child(3){animation-delay:.51s}#capaTitulo > .botones .boton:nth-child(4){animation-delay:.59s}#capaTitulo > .botones .boton:nth-child(5){animation-delay:.67s}
#idiomas{flex-direction:row!important;gap:6px!important;margin-top:4px}#idiomas .boton{font-size:10px;padding:5px 10px;letter-spacing:1px;opacity:.7;width:auto!important;min-width:0!important;clip-path:none}#idiomas .boton.ya{opacity:1}#idiomas .boton.ya::after{background:var(--oro)}
/* misiones: mapa con rutas */
#mapaMis{position:relative;width:min(820px,100%);flex:1 1 0;min-height:96px;max-height:260px;border:1px solid var(--linea);overflow:hidden}
#mapaMis canvas{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;border:2px solid var(--cian);background:rgba(6,20,36,.75);color:#fff;font-weight:900;font-size:16px;
  display:flex;align-items:center;justify-content:center;animation:pulso 1.6s infinite}
.pin.cerrada{border-color:#56708a;color:#56708a;animation:none}.pin.ya{border-color:var(--oro)}.pin.sel{background:var(--cian);color:#04121f;transform:translate(-50%,-50%) scale(1.15)}
#fichaMis{display:flex;gap:12px;align-items:stretch;text-align:left;width:min(820px,100%)}
#fichaMis canvas{width:172px;height:97px;flex:none;border:1px solid var(--linea)}
#fichaMis .t{flex:1;font-size:13px;letter-spacing:1px}
#fichaMis .t b{display:block;font-size:19px;letter-spacing:4px;font-style:italic}
#fichaMis .t small{display:block;color:#a9c6dd;font-size:11.5px;letter-spacing:0;line-height:1.4;margin-top:4px}
.est{color:var(--oro);letter-spacing:3px}
/* hangar */
#capaHangar{justify-content:space-between;background:linear-gradient(180deg,rgba(3,10,20,.55),transparent 30%,transparent 62%,rgba(3,10,20,.85))}
#hangarArriba{display:flex;justify-content:space-between;align-items:flex-start;width:100%}
#hangarAbajo{display:flex;gap:14px;align-items:flex-end;width:100%;justify-content:space-between}
#ficha{min-width:250px;text-align:left}
#ficha b{font-size:22px;letter-spacing:4px;font-style:italic;display:block}
#ficha small{color:#a9c6dd;font-size:11px;display:block;margin:2px 0 6px;max-width:300px}
.barra{display:grid;grid-template-columns:78px 1fr 34px;gap:6px;align-items:center;font-size:10px;letter-spacing:1px;color:#a9c6dd;margin:3px 0}
.barra i{display:block;height:6px;background:rgba(140,210,255,.15);position:relative;overflow:hidden}
.barra i b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--cian2),var(--cian));transition:width .7s cubic-bezier(.2,.9,.25,1)}
.barra i u{position:absolute;left:0;top:0;bottom:0;background:var(--oro);opacity:.8;transition:width .7s}
#flechas{display:flex;gap:10px}
.flecha{width:52px;height:52px;border:1px solid var(--linea);background:var(--vidrio);color:#fff;font-size:22px;font-weight:900;border-radius:50%}
#mejoras{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:6px;text-align:left}
.mej{background:var(--vidrio);border:1px solid var(--linea);padding:6px 8px;font-size:11px;letter-spacing:1px}
.mej b{display:block;font-size:12px;letter-spacing:2px}
.mej .n{color:var(--oro)}
/* informe */
#rango{font-size:92px;font-weight:900;font-style:italic;line-height:1;color:#fff;text-shadow:0 0 30px rgba(95,212,255,.7);animation:sello .6s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes sello{from{transform:scale(3) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
#resumen{text-align:left;font-size:14px;letter-spacing:1px;min-width:230px}
#resumen div{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(140,210,255,.15);padding:2px 0;animation:entraIzq .4s both}
.estrellas{font-size:30px;color:var(--oro);letter-spacing:6px;text-shadow:0 0 14px rgba(255,196,77,.6)}
.estrellas i{font-style:normal;display:inline-block;animation:sello .45s cubic-bezier(.2,1.6,.4,1) both}
/* avisos */
#aviso{position:absolute;left:0;right:0;top:22%;text-align:center;font-size:28px;letter-spacing:10px;font-weight:900;font-style:italic;pointer-events:none;opacity:0;transition:opacity .25s;
  text-shadow:0 0 16px rgba(0,0,0,.8),0 0 30px currentColor}
#aviso small{display:block;font-size:12px;letter-spacing:5px;color:#d6ecff;font-weight:normal;font-style:normal;margin-top:4px;text-shadow:0 1px 4px #000}
#barrido{position:absolute;inset:-10% -30%;pointer-events:none;background:linear-gradient(100deg,transparent 0,transparent 30%,#0b2742 38%,#5fd4ff 50%,#0b2742 62%,transparent 70%);transform:translateX(-120%);opacity:.95;z-index:20}
#barrido.va{animation:barrido .7s cubic-bezier(.6,0,.3,1)}
@keyframes barrido{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
#carga{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#050d18;z-index:30}
#carga svg{width:min(52vmin,260px)}
#carga svg path{fill:none;stroke:var(--cian);stroke-width:2;stroke-dasharray:600;stroke-dashoffset:600;animation:traza 2.2s ease-in-out infinite alternate}
@keyframes traza{to{stroke-dashoffset:0}}
#carga .txt{font-size:12px;letter-spacing:8px;color:#9fc7e4}
#carga .barra2{width:min(60vmin,300px);height:3px;background:rgba(140,210,255,.15)}#carga .barra2 i{display:block;height:100%;width:0;background:var(--cian);box-shadow:0 0 10px var(--cian);transition:width .2s}
.texto{font-size:12.5px;line-height:1.5;text-align:left;columns:2;column-gap:22px}
.texto p{margin:0 0 7px;break-inside:avoid}.texto b{color:var(--cian)}
.capa.desliza::after{content:'';position:sticky;bottom:-14px;display:block;flex:none;width:100%;height:22px;margin-top:-22px;pointer-events:none;background:linear-gradient(transparent,rgba(4,12,24,.7))}
</style></head><body>
<div id="pantalla">
  <canvas id="lienzo3d"></canvas>
  <div id="nube"></div>
  <canvas id="hud"></canvas>
  <canvas id="mg"></canvas>
  <div id="aviso"></div>
  <div id="mandos">
    <div id="zonaStick"></div>
    <div id="zonaMirar"></div><div id="ojo">CÁMARA LIBRE · DOBLE TOQUE CENTRA</div>
    <div id="stick"><div id="perilla"></div></div>
    <div class="bt" id="bFuego"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg><small>CAÑÓN</small></div>
    <div class="bt" id="bMisil"><svg viewBox="0 0 24 24"><path d="M5 19l9-9M14 10l3-6 3 3-6 3M7 21l-4-4 3-1 2 2z"/></svg><small id="nMis">MISIL</small></div>
    <div class="bt" id="bTurbo"><svg viewBox="0 0 24 24"><path d="M4 12h9M4 7h6M4 17h6M14 6l6 6-6 6"/></svg><small>TURBO</small></div>
    <div class="bt" id="bFreno"><svg viewBox="0 0 24 24"><path d="M6 6v12M18 6v12M6 12h12"/></svg><small>FRENO</small></div>
    <div class="bt" id="bBengala"><svg viewBox="0 0 24 24"><path d="M12 3v6M7 7l3 3M17 7l-3 3M5 14c2 1 4 1 7-2 3 3 5 3 7 2M8 20c1-2 3-3 4-6 1 3 3 4 4 6"/></svg><small id="nBen">BENGALA</small></div>
    <div class="bt" id="bCamara"><svg viewBox="0 0 24 24"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
    <div class="bt" id="bPausa"><i></i><i></i></div>
  </div>

  <div class="capa" id="capaTitulo">
    <div id="dinero">$ 0</div>
    <div class="logo"><span class="alas">ALAS</span><span class="ala"></span></div>
    <div class="sub">DUELO AÉREO</div>
    <div class="botones" style="margin-top:14px">
      <button class="boton" id="btJugar">MISIONES</button>
      <button class="boton oro" id="btHangar">HANGAR</button>
      <button class="boton gris" id="btComo">CÓMO SE VUELA</button>
      <button class="boton gris" id="btAjustes">AJUSTES</button>
    </div>
    <div id="idiomas" class="botones"><button class="boton chico" data-l="es">ESPAÑOL</button><button class="boton chico" data-l="en">ENGLISH</button><button class="boton chico" data-l="pt">PORTUGUÊS</button></div>
  </div>
  <div class="capa velo" id="capaMisiones">
    <h2><small>TEATRO DE OPERACIONES · ARCHIPIÉLAGO</small>MISIONES</h2>
    <div id="mapaMis"><canvas id="lienzoMapa"></canvas></div>
    <div class="panel" id="fichaMis"></div>
    <div class="botones"><button class="boton verde" id="btDespegar">DESPEGAR</button><button class="boton gris" id="btMisVolver">VOLVER</button></div>
  </div>
  <div class="capa" id="capaHangar">
    <div id="hangarArriba"><h2 style="text-align:left"><small id="hanDinero">$ 0</small>HANGAR</h2><div id="mejoras"></div></div>
    <div id="hangarAbajo">
      <div class="panel" id="ficha"></div>
      <div id="flechas"><button class="flecha" id="btAnt">‹</button><button class="flecha" id="btSig">›</button></div>
      <div class="botones" style="flex-direction:column"><button class="boton oro" id="btElegir">ELEGIR</button><button class="boton gris" id="btHanVolver">VOLVER</button></div>
    </div>
  </div>
  <div class="capa velo" id="capaComo">
    <h2><small>ANTES DE DESPEGAR</small>CÓMO SE VUELA</h2>
    <div class="panel texto" id="comoTxt"></div>
    <button class="boton gris" id="btComoVolver">VOLVER</button>
  </div>
  <div class="capa velo" id="capaAjustes">
    <h2><small>CONFIGURACIÓN</small>AJUSTES</h2>
    <div class="botones" style="flex-direction:column;min-width:300px">
      <button class="boton" id="btSonido">SONIDO: SÍ</button>
      <button class="boton" id="btGraf">GRÁFICOS: AUTO</button>
      <button class="boton" id="btInvertir">MANDO: ARRIBA = SUBIR</button>
      <button class="boton" id="btAsist">ASISTENCIA: SÍ</button>
    </div>
    <button class="boton gris" id="btAjVolver">VOLVER</button>
  </div>
  <div class="capa velo" id="capaPausa">
    <h2><small>MISIÓN EN CURSO</small>PAUSA</h2>
    <div class="botones"><button class="boton verde" id="btSeguir">SEGUIR</button><button class="boton" id="btReiniciar">REINICIAR</button><button class="boton gris" id="btSalir">ABANDONAR</button></div>
  </div>
  <div class="capa velo" id="capaRes">
    <h2><small id="resSub">INFORME</small><span id="resTit">MISIÓN CUMPLIDA</span></h2>
    <div style="display:flex;align-items:center;gap:30px">
      <div><div id="rango">S</div><div class="estrellas" id="resEst"></div></div>
      <div id="resumen"></div>
    </div>
    <div class="botones">
      <button class="boton verde" id="btResSig">SIGUIENTE</button>
      <button class="boton" id="btResOtra">REPETIR</button>
      <button class="boton oro" id="btResHan">HANGAR</button>
      <button class="boton gris" id="btResMenu">MISIONES</button>
    </div>
  </div>
  <div id="barrido"></div>
  <div id="carga"><svg viewBox="0 0 200 80"><path d="M5 60 L70 40 L100 10 L112 40 L195 52 L112 50 L104 72 L92 50 Z"/></svg><div class="txt">CARGANDO…</div><div class="barra2"><i></i></div></div>
</div>
