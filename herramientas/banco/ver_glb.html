<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#202225}</style></head>
<body><script src="three.min.js"></script><script src="GLTFLoader.js"></script><script>
const P=new URLSearchParams(location.search), ARCH=P.get('glb')||'monstruo.glb';
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
ren.setSize(420,560); ren.outputEncoding=THREE.sRGBEncoding; document.body.appendChild(ren.domElement);
const esc=new THREE.Scene(); esc.background=new THREE.Color(0x202225);
const cam=new THREE.PerspectiveCamera(35,420/560,.01,100);
esc.add(new THREE.HemisphereLight(0xbcd0e0,0x3a3228,1.1));
const key=new THREE.DirectionalLight(0xfff0dd,2.0); key.position.set(2.2,2.6,1.8); esc.add(key);
const contra=new THREE.DirectionalLight(0x88b0ff,1.1); contra.position.set(-2.4,1.2,-2.0); esc.add(contra);
window.__V={listo:false,info:null};
new THREE.GLTFLoader().load(ARCH,g=>{
  const raiz=g.scene; esc.add(raiz);
  let huesos=0,skin=0,tri=0;
  raiz.traverse(o=>{ if(o.isBone)huesos++; if(o.isSkinnedMesh){skin++;}
    if(o.isMesh&&o.geometry){const ix=o.geometry.index; tri+=(ix?ix.count:o.geometry.attributes.position.count)/3;} });
  const caja=new THREE.Box3().setFromObject(raiz), t=new THREE.Vector3(), c=new THREE.Vector3();
  caja.getSize(t); caja.getCenter(c);
  window.__V.info={ancho:+t.x.toFixed(3),alto:+t.y.toFixed(3),hondo:+t.z.toFixed(3),
    huesos,skin,tri,clips:g.animations.map(a=>a.name+':'+a.duration.toFixed(2))};
  window.__V.foto=(ang,alturaCam)=>{
    const r=Math.max(t.x,t.y,t.z)*1.9;
    cam.position.set(c.x+Math.sin(ang)*r, c.y+(alturaCam||0)*t.y, c.z+Math.cos(ang)*r);
    cam.lookAt(c); cam.updateMatrixWorld(); ren.render(esc,cam);
  };
  window.__V.foto(0,0);
  window.__V.listo=true;
},undefined,e=>{window.__V.error=String(e&&e.message||e);window.__V.listo=true;});
</script></body></html>
