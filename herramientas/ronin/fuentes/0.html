<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0908">
<title>EL ÚLTIMO RŌNIN</title>
<style>
  html, body { margin:0; height:100%; background:#0b0908; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif CJK JP", "Songti SC", Georgia, "Times New Roman", serif; color:#efe6d4; }
  #stage { position:fixed; left:50%; top:50%; transform-origin:50% 50%; overflow:hidden; background:#0b0908; }
  #lienzo { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #papel { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:0.35; background-size:256px 256px; }
  #vineta { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 52%, rgba(10,4,2,0.42) 86%, rgba(10,4,2,0.78) 100%); }
  #rojo { position:absolute; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at 50% 50%, rgba(120,0,0,0) 40%, rgba(150,0,0,0.75) 100%); }
  #ui { position:absolute; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .oculto { display:none !important; }

  /* ---------------- menús: papel de arroz, tinta y un rojo de sello */
  .capa { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .panel { position:relative; background:linear-gradient(180deg, rgba(236,226,204,0.97), rgba(214,200,172,0.97)); color:#1a1410; border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6), inset 0 0 40px rgba(120,90,50,0.35); padding:3.2% 3.6%; max-width:92%; max-height:92%; overflow:auto; }
  .panel::before { content:""; position:absolute; inset:6px; border:2px solid rgba(40,26,16,0.55); pointer-events:none; border-radius:2px; }
  .titulo-p { font-size:clamp(20px, 7vmin, 40px); font-weight:900; letter-spacing:0.08em; margin:0 0 0.35em; }
  .sub { font-size:clamp(11px, 3.2vmin, 16px); opacity:0.8; margin:0 0 0.8em; line-height:1.35; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.5em; min-width:44%; margin:0.35em 0.6%; padding:0.62em 1.2em; font:inherit;
    font-size:clamp(13px, 4.2vmin, 22px); font-weight:800; letter-spacing:0.12em; color:#f4ead6; background:#1d1612; border:0; border-radius:2px; cursor:pointer;
    position:relative; overflow:hidden; transform:translateX(0); transition:transform 0.18s, background 0.18s; }
  .btn::after { content:""; position:absolute; left:-10%; top:0; bottom:0; width:0; background:linear-gradient(90deg, #a3121a, #d22a22); transform:skewX(-18deg); transition:width 0.22s; z-index:0; }
  .btn:active::after, .btn.sel::after { width:120%; }
  .btn > * , .btn span { position:relative; z-index:1; }
  .btn.claro { background:rgba(29,22,18,0.08); color:#1d1612; border:2px solid #1d1612; }
  .btn.rojo { background:#9e1a18; }
  .btn:disabled { opacity:0.4; }
  .sello { display:inline-block; color:#fff; background:#b3191b; border-radius:4px; padding:0.05em 0.3em; font-weight:900; transform:rotate(-4deg); box-shadow:0 0 0 2px #b3191b inset; }
  .kanji { font-weight:900; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="lienzo"></canvas>
  <div id="papel"></div>
  <div id="vineta"></div>
  <div id="rojo"></div>
  <div id="ui"></div>
</div>
<script>
(function(){
