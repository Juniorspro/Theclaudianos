<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<title>ALIEN GRID</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0b0d14;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
  #lienzo{position:fixed;inset:0;display:block;width:100%;height:100%}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:5}
  .chip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;
    padding:7px 13px;border-radius:999px;font-size:11px;letter-spacing:.16em;font-weight:700;
    color:#bfefff;background:rgba(10,16,26,.42);border:1px solid rgba(120,230,255,.28);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #pista{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;
    padding:7px 11px;border-radius:12px;font-size:10px;line-height:1.5;text-align:right;
    color:#8fa6b8;background:rgba(10,16,26,.34);border:1px solid rgba(140,180,210,.16);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .6s}
  /* joystick flotante */
  #base{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
    opacity:0;transition:opacity .16s;will-change:transform,opacity;
    background:radial-gradient(circle at 50% 50%,rgba(120,230,255,.10),rgba(8,14,24,.34) 62%,rgba(8,14,24,0) 72%);
    border:1.5px solid rgba(150,235,255,.30);box-shadow:0 0 26px rgba(60,190,255,.16) inset}
  #base::after{content:"";position:absolute;inset:26px;border-radius:50%;
    border:1px dashed rgba(150,235,255,.16)}
  #puno{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    opacity:0;transition:opacity .16s;will-change:transform,opacity;
    background:radial-gradient(circle at 38% 32%,rgba(226,252,255,.96),rgba(86,206,255,.80) 46%,rgba(30,120,180,.70));
    box-shadow:0 6px 20px rgba(0,0,0,.42),0 0 22px rgba(90,220,255,.50)}
  /* botón salto */
  #salto{position:absolute;right:26px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);
    width:96px;height:96px;border-radius:50%;pointer-events:auto;display:grid;place-items:center;
    font-size:11px;font-weight:800;letter-spacing:.14em;color:#d8f6ff;
    background:radial-gradient(circle at 42% 34%,rgba(120,230,255,.24),rgba(10,18,30,.46) 68%);
    border:1.5px solid rgba(140,235,255,.40);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 26px rgba(0,0,0,.38);transition:transform .09s,background .09s}
  #salto.on{transform:scale(.92);background:radial-gradient(circle at 42% 34%,rgba(160,245,255,.44),rgba(20,40,60,.60) 68%)}
  #carga{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0b0d14;
    color:#7fd8ff;font-size:12px;letter-spacing:.2em;transition:opacity .5s}
</style>
</head>

</div>

/* ------------------------------------------------------------------ cielo */
const uCielo = {
  uMapa:{value:null}, uTieneMapa:{value:0}, uSol:{value:new THREE.Vector3(0.62,0.20,-0.76).normalize()},
  uNiebla:{value:col(HORIZONTE)}
};
const cielo = new THREE.Mesh(
  new THREE.SphereGeometry(460, 48, 32),
  new THREE.ShaderMaterial({
    uniforms:uCielo, side:THREE.BackSide, depthWrite:false, fog:false,
    vertexShader:`
      varying vec3 vDir;
      void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      varying vec3 vDir;
      uniform sampler2D uMapa; uniform float uTieneMapa; uniform vec3 uSol; uniform vec3 uNiebla;
      const float PI = 3.14159265;
      float hash(vec3 p){ p = fract(p*0.3183099+vec3(0.71,0.113,0.419)); p *= 17.0;
        return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
      void main(){
        vec3 d = normalize(vDir);
        vec3 c;
        if(uTieneMapa > 0.5){
          float u = atan(d.z, d.x)/(2.0*PI) + 0.5;
          float v = asin(clamp(d.y,-1.0,1.0))/PI + 0.5;
          c = texture2D(uMapa, vec2(u, v)).rgb;
          c = pow(c, vec3(2.2));                       /* sRGB -> lineal a mano */
        } else {
          float h = d.y;
          vec3 cenit = vec3(0.030,0.042,0.125);
          vec3 medio = vec3(0.175,0.125,0.290);
          vec3 horiz = vec3(0.980,0.520,0.240);
          c = mix(horiz, medio, smoothstep(-0.03, 0.30, h));
          c = mix(c, cenit, smoothstep(0.24, 0.88, h));
          float s = max(dot(d, uSol), 0.0);
          c += vec3(1.0,0.66,0.34)*pow(s,46.0)*2.1;
          c += vec3(1.0,0.50,0.22)*pow(s, 7.0)*0.26;
          vec3 l1 = normalize(vec3(-0.48,0.52,0.70));
          float m1 = 1.0-smoothstep(0.030,0.038, distance(d,l1));
          c = mix(c, vec3(0.90,0.90,0.96)*(0.72+0.42*dot(normalize(d-l1*0.0),uSol)), m1*0.92);
          vec3 l2 = normalize(vec3(0.20,0.74,0.64));
          float m2 = 1.0-smoothstep(0.015,0.020, distance(d,l2));
          c = mix(c, vec3(0.78,0.82,0.95), m2*0.80);
          vec3 ce = floor(d*620.0);
          float e = hash(ce);
          float punto = smoothstep(0.9988, 1.0, e);
          float titila = 0.65 + 0.35*hash(ce+11.0);
          c += vec3(0.82,0.88,1.0)*punto*titila*smoothstep(0.04,0.50,h)*2.2;
          float neb = hash(floor(d*13.0))*0.5 + hash(floor(d*29.0))*0.5;
          c += vec3(0.22,0.10,0.34)*smoothstep(0.55,1.0,neb)*smoothstep(0.15,0.9,h)*0.22;
          c = mix(c, uNiebla*1.35, exp(-abs(h)*12.0)*0.46);
          c = mix(c, uNiebla, smoothstep(0.0,-0.18,h)*0.95);
        }
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`
  })
);
cielo.frustumCulled = false; cielo.renderOrder = -1;
esc.add(cielo);

function texturaGrid(){
  const s = 512, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#70757b'; g.fillRect(0,0,s,s);
  const im = g.getImageData(0,0,s,s), d = im.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-0.5)*13; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(im,0,0);
  g.lineCap = 'butt';
  g.strokeStyle = 'rgba(196,210,220,0.26)'; g.lineWidth = 2;          /* cada 1 m */
  for(let i=1;i<4;i++){ const p = i*s/4 + 0.5;

    g.beginPath(); g.moveTo(0,p); g.lineTo(s,p); g.stroke(); }
  g.strokeStyle = 'rgba(126,232,255,0.50)'; g.lineWidth = 5;          /* cada 4 m */
  g.beginPath(); g.moveTo(2.5,0); g.lineTo(2.5,s); g.stroke();
  g.beginPath(); g.moveTo(0,2.5); g.lineTo(s,2.5); g.stroke();
  const t = new THREE.CanvasTexture(c);

}

/* ------------------------------------------------------------- GLB riggeado */
const mezcla = { mixer:null, acc:{}, actual:null, raiz:null };
function estadoAClip(e){
  const n = {quieto:['idle','breath','stand'], caminar:['walk'], correr:['run','sprint','jog'],
             saltar:['jump','leap'], caer:['fall','jump']}[e] || ['idle'];
  for(const t of n){ for(const k in mezcla.acc){ if(k.toLowerCase().indexOf(t) >= 0) return mezcla.acc[k]; } }
  return null;
}
function ponerClip(e){
  if(!mezcla.mixer) return;
  const a = estadoAClip(e); if(!a || a === mezcla.actual) return;
  if(mezcla.actual) mezcla.actual.fadeOut(0.18);
  a.reset().fadeIn(0.18).play();
  mezcla.actual = a;
}
function meterGLB(b64){
  return new Promise((ok, fallo) => {
    let bin; try{
      const s = atob(b64); bin = new Uint8Array(s.length);
      for(let i=0;i<s.length;i++) bin[i] = s.charCodeAt(i);
    }catch(e){ return fallo(e); }                       /* base64 roto: cuesta la pieza, no la pantalla */
    new THREE.GLTFLoader().parse(bin.buffer, '', g => {
      const raiz = g.scene;
      const cja = new THREE.Box3().setFromObject(raiz), tam = cja.getSize(new THREE.Vector3());
      if(tam.y > 0.001){ const k = 1.85/tam.y; raiz.scale.setScalar(k); cja.setFromObject(raiz); }
      raiz.position.y -= cja.min.y;
      raiz.traverse(o => { if(o.isMesh){ o.castShadow = true; o.frustumCulled = false; } });
      alien.clear(); alien.add(raiz); mezcla.raiz = raiz;
      if(g.animations && g.animations.length){
        mezcla.mixer = new THREE.AnimationMixer(raiz);
        g.animations.forEach(c => { mezcla.acc[c.name] = mezcla.mixer.clipAction(c); });
        mezcla.actual = null; ponerClip(jug.estado);
      }
      ok(Object.keys(mezcla.acc));
    }, fallo);
  });
}

function pintarPalanca(px, py, vis){

    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(d, RADIO);
    ent.x = (dx/d)*(k/RADIO); ent.y = (dy/d)*(k/RADIO); ent.mag = k/RADIO;
    pintarPalanca(oX + (dx/d)*k, oY + (dy/d)*k, true);

/* ------------------------------------------------------------------- paso */
const ejeX = new THREE.Vector3(), ejeZ = new THREE.Vector3(), deseo = new THREE.Vector3();

function paso(dt){
  /* dirección pedida, relativa a la cámara */
  let ix = ent.x, iy = ent.y, mag = ent.mag;
  const tx = (teclas.KeyD||teclas.ArrowRight?1:0) - (teclas.KeyA||teclas.ArrowLeft?1:0);
  const ty = (teclas.KeyS||teclas.ArrowDown?1:0) - (teclas.KeyW||teclas.ArrowUp?1:0);
  if(tx || ty){ const d = Math.hypot(tx,ty); ix = tx/d; iy = ty/d; mag = teclas.ShiftLeft?1:0.6; }

  ejeZ.set(Math.sin(camYaw), 0, Math.cos(camYaw));
  ejeX.set(ejeZ.z, 0, -ejeZ.x);
  deseo.set(0,0,0).addScaledVector(ejeX, ix).addScaledVector(ejeZ, iy);
  const largo = deseo.length();
  if(largo > 0.0001) deseo.multiplyScalar(1/largo);

  const corre = mag > 0.72;
  const vObj = largo > 0.0001 ? (corre ? CFG.vCorrer : CFG.vCaminar) * Math.min(mag/0.72, 1) : 0;

  const vx = deseo.x*vObj, vz = deseo.z*vObj;
  const k = (vObj > 0 ? CFG.acel : CFG.frena) * dt;
  jug.vel.x = acercar(jug.vel.x, vx, k);
  jug.vel.z = acercar(jug.vel.z, vz, k);

  /* salto (flanco, no nivel) */
  if(ent.salto && !ent.saltoLatch){
    if(jug.saltos < CFG.saltosMax){
      jug.vel.y = jug.saltos === 0 ? CFG.salto : CFG.saltoDoble;
      jug.saltos++; jug.enSuelo = false;
    }
    ent.saltoLatch = true;
  }
  if(!ent.salto) ent.saltoLatch = false;
  ent.salto = false;

  jug.vel.y += CFG.grav*dt;
  jug.pos.addScaledVector(jug.vel, dt);
  if(jug.pos.y <= 0){ jug.pos.y = 0; jug.vel.y = 0; jug.enSuelo = true; jug.saltos = 0; }
  else jug.enSuelo = false;

  const lim = CFG.corral;
  jug.pos.x = clamp(jug.pos.x, -lim, lim);
  jug.pos.z = clamp(jug.pos.z, -lim, lim);

  jug.rapidez = Math.hypot(jug.vel.x, jug.vel.z);
  jug.aire = jug.enSuelo ? 0 : jug.aire + dt;

  /* el cuerpo gira hacia donde va */
  if(jug.rapidez > 0.12){
    const obj = Math.atan2(jug.vel.x, jug.vel.z);
    let d = obj - jug.yaw;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    jug.yaw += d*(1-Math.exp(-CFG.giroCuerpo*dt));
  }
  alien.position.copy(jug.pos);
  alien.rotation.y = jug.yaw;

  jug.estado = !jug.enSuelo ? (jug.vel.y > 0.4 ? 'saltar' : 'caer')
             : jug.rapidez > CFG.vCaminar*1.25 ? 'correr'
             : jug.rapidez > 0.25 ? 'caminar' : 'quieto';

  animar(dt);

  /* mancha de contacto: se achica y aclara con la altura */
  const f = clamp(1 - jug.pos.y/3.2, 0.18, 1);
  mancha.position.set(jug.pos.x, 0.012, jug.pos.z);
  mancha.scale.setScalar(0.66 + 0.34*f);
  mancha.material.opacity = 0.24*f;

  camara(dt);

  clave.position.set(jug.pos.x + 18, 15, jug.pos.z - 22);
  clave.target.position.copy(jug.pos);
  clave.target.updateMatrixWorld();
  cielo.position.copy(cam.position);
}

/* animación de código; con GLB riggeado manda el mixer */
function animar(dt){
  if(mezcla.mixer){
    ponerClip(jug.estado);
    const esc = jug.estado === 'correr' ? clamp(jug.rapidez/CFG.vCorrer, 0.6, 1.5)
              : jug.estado === 'caminar' ? clamp(jug.rapidez/CFG.vCaminar, 0.5, 1.4) : 1;
    mezcla.mixer.timeScale = esc;
    mezcla.mixer.update(dt);
    return;
  }
  const h = hueso;
  jug.fase += dt * (jug.rapidez > 0.2 ? 3.1 + jug.rapidez*1.15 : 1.5);
  const f = jug.fase;
  if(!jug.enSuelo){
    const sube = clamp(jug.vel.y/CFG.salto, -1, 1);
    h.piernaI.h.rotation.x = -0.75 + sube*0.35;  h.piernaI.rod.rotation.x = 1.15 - sube*0.35;
    h.piernaD.h.rotation.x =  0.34 - sube*0.30;  h.piernaD.rod.rotation.x = 0.42;
    h.brazoI.h.rotation.x = -2.05 - sube*0.35;   h.brazoD.h.rotation.x = -1.85 - sube*0.35;
    h.brazoI.h.rotation.z =  0.42;               h.brazoD.h.rotation.z = -0.42;
    h.brazoI.cod.rotation.x = -0.5;              h.brazoD.cod.rotation.x = -0.5;
    h.cadera.position.y = 1.02;
    h.torso.rotation.x = -0.10 - sube*0.10;
    h.cabeza.rotation.x = sube*0.18;
    return;
  }
  if(jug.rapidez < 0.25){                                  /* respirar */
    const r = Math.sin(f*1.1);
    h.piernaI.h.rotation.x = h.piernaD.h.rotation.x = 0;
    h.piernaI.rod.rotation.x = h.piernaD.rod.rotation.x = 0.06;
    h.brazoI.h.rotation.x = h.brazoD.h.rotation.x = 0.06 + r*0.04;
    h.brazoI.h.rotation.z = 0.30; h.brazoD.h.rotation.z = -0.30;
    h.brazoI.cod.rotation.x = h.brazoD.cod.rotation.x = -0.28;
    h.cadera.position.y = 1.02 + r*0.012;
    h.torso.rotation.x = 0.02 + r*0.015;
    h.cabeza.rotation.y = Math.sin(f*0.37)*0.22;
    h.cabeza.rotation.x = 0;
    return;
  }
  const corre = jug.estado === 'correr';
  const amp = corre ? 0.92 : 0.58, ampB = corre ? 0.80 : 0.46;
  const s = Math.sin(f), c = Math.cos(f);
  h.piernaI.h.rotation.x =  s*amp;   h.piernaD.h.rotation.x = -s*amp;
  h.piernaI.rod.rotation.x = Math.max(0, -Math.cos(f))*(corre?1.55:0.95) + 0.08;
  h.piernaD.rod.rotation.x = Math.max(0,  Math.cos(f))*(corre?1.55:0.95) + 0.08;
  h.piernaI.pie.rotation.x = clamp(-s*0.45, -0.4, 0.4);
  h.piernaD.pie.rotation.x = clamp( s*0.45, -0.4, 0.4);
  h.brazoI.h.rotation.x = -s*ampB;   h.brazoD.h.rotation.x =  s*ampB;
  h.brazoI.h.rotation.z = 0.20;      h.brazoD.h.rotation.z = -0.20;
  h.brazoI.cod.rotation.x = -(corre?0.95:0.45) - Math.max(0,-s)*0.4;
  h.brazoD.cod.rotation.x = -(corre?0.95:0.45) - Math.max(0, s)*0.4;
  h.cadera.position.y = 1.02 + Math.abs(c)*(corre?0.075:0.038) - (corre?0.05:0.0);
  h.cadera.rotation.y = -s*(corre?0.16:0.09);
  h.torso.rotation.y  =  s*(corre?0.22:0.12);
  h.torso.rotation.x  = corre ? 0.20 : 0.07;
  h.cabeza.rotation.x = corre ? -0.14 : -0.04;
  h.cabeza.rotation.y = 0;
}

/* cámara en tercera persona, desde arriba y con vida propia */
function camara(dt){
  if(idMira === null && jug.rapidez > 1.2){               /* se acomoda sola detrás del movimiento */
    const obj = Math.atan2(jug.vel.x, jug.vel.z) + Math.PI;
    let d = obj - camYaw;
    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    camYaw += d*(1-Math.exp(-1.6*dt))*clamp(jug.rapidez/CFG.vCorrer,0,1);
  }
  const corr = clamp((jug.rapidez - CFG.vCaminar)/(CFG.vCorrer - CFG.vCaminar), 0, 1);
  const distObj = CFG.camDist + CFG.camDistCorrer*corr + jug.pos.y*0.22;
  camDist = acercar(camDist, distObj, 4*dt);

  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const bx = jug.pos.x + Math.sin(camYaw + Math.PI)*camDist*cp;
  const bz = jug.pos.z + Math.cos(camYaw + Math.PI)*camDist*cp;
  const by = jug.pos.y + CFG.camMira + camDist*sp;

  const t = 1 - Math.exp(-CFG.camSuave*dt);
  camPos.x = lerp(camPos.x, bx, t);
  camPos.y = lerp(camPos.y, Math.max(by, 0.8), t);
  camPos.z = lerp(camPos.z, bz, t);
  cam.position.copy(camPos);

  camMira.set(                                            /* mira un poco adelante */
    lerp(camMira.x, jug.pos.x + jug.vel.x*0.22, t),
    lerp(camMira.y, jug.pos.y + CFG.camMira, t),
    lerp(camMira.z, jug.pos.z + jug.vel.z*0.22, t)
  );
  cam.lookAt(camMira);

  const fov = CFG.fovBase + (CFG.fovCorrer - CFG.fovBase)*corr;
  if(Math.abs(cam.fov - fov) > 0.05){ cam.fov = lerp(cam.fov, fov, t); cam.updateProjectionMatrix(); }
}

/* ------------------------------------------------------------------ marco */
function medir(){
  const w = innerWidth, h = innerHeight;
  rend.setSize(w, h, false);
  cam.aspect = w/h; cam.updateProjectionMatrix();
}
addEventListener('resize', medir);
medir();

let ultimo = performance.now(), suavems = 16, dpr = Math.min(devicePixelRatio||1, 2);
function dibujar(){ rend.info.reset(); rend.render(esc, cam); }
function marco(ahora){
  requestAnimationFrame(marco);
  let dt = (ahora - ultimo)/1000; ultimo = ahora;
  if(dt > 0.1) dt = 0.1;
  paso(dt);
  dibujar();
  suavems = suavems*0.92 + (performance.now() - ahora)*0.08;
  if(suavems > 26 && dpr > 0.75){ dpr = Math.max(0.75, dpr-0.12); rend.setPixelRatio(dpr); medir(); suavems = 16; }
  else if(suavems < 11 && dpr < Math.min(devicePixelRatio||1,2)){ dpr = Math.min(Math.min(devicePixelRatio||1,2), dpr+0.1); rend.setPixelRatio(dpr); medir(); suavems = 16; }
}

/* ----------------------------------------------------------------- sondas */
window.__A = {
  CFG, jug, cam, esc, MAT, hueso, mezcla,
  est(){ const i = rend.info; return {llamadas:i.render.calls, triangulos:i.render.triangles,
    ms:+suavems.toFixed(2), dpr:+dpr.toFixed(2), texturas:i.memory.textures, geos:i.memory.geometries}; },
  brillo(){                                  /* dibuja y lee: sin el render del mismo cuadro da cero */
    dibujar();
    const g = rend.getContext(), w = g.drawingBufferWidth, h = g.drawingBufferHeight;
    const p = new Uint8Array(w*h*4); g.readPixels(0,0,w,h,g.RGBA,g.UNSIGNED_BYTE,p);
    let s = 0; for(let i=0;i<p.length;i+=4) s += 0.2126*p[i] + 0.7152*p[i+1] + 0.0722*p[i+2];
    return +(s/(w*h)).toFixed(2);
  },
  cajas(){ const r = {};
    for(const id of ['base','puno','salto','pista']){ const e = document.getElementById(id);
      r[id] = {x:e.offsetLeft, y:e.offsetTop, w:e.offsetWidth, h:e.offsetHeight,
               ver:getComputedStyle(e).opacity}; }
    return r; },
  anda(n, dt){ dt = dt || 1/60; for(let i=0;i<(n||60);i++) paso(dt); dibujar();
    esc.updateMatrixWorld(true); return {pos:jug.pos.toArray().map(v=>+v.toFixed(3)),
      estado:jug.estado, rapidez:+jug.rapidez.toFixed(3), cam:cam.position.toArray().map(v=>+v.toFixed(2))}; },
  mover(x, y){ ent.x = x; ent.y = y; ent.mag = Math.min(1, Math.hypot(x,y)); },
  saltar(){ ent.salto = true; },
  mirar(dy){ camYaw += dy; },
  picar(v){ camPitch = v; },
  assets(){ return {glb:!!mezcla.raiz, clips:Object.keys(mezcla.acc),
    cielo:uCielo.uTieneMapa.value > 0.5, gridSuelo:!!suelo.material.map}; }
};

/* --------------------------------------------------- horneados (si llegaron) */
function meterCielo(b64){
  return new Promise((ok, fallo) => {
    const im = new Image();
    im.onload = () => {
      const t = new THREE.Texture(im);
      t.wrapS = THREE.RepeatWrapping; t.wrapT = THREE.ClampToEdgeWrapping;
      t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter;
      t.generateMipmaps = false; t.needsUpdate = true;
      uCielo.uMapa.value = t; uCielo.uTieneMapa.value = 1;
      ok(im.width + 'x' + im.height);
    };
    im.onerror = fallo;                                   /* un base64 que no decodifica no avisa */
    im.src = 'data:image/jpeg;base64,' + b64;
  });
}
Promise.all([
  B64.cielo ? meterCielo(B64.cielo).catch(e => 'cielo falló: ' + e) : 'cielo de código',
  B64.glb   ? meterGLB(B64.glb).catch(e => 'glb falló: ' + e)       : 'alien de código'
]).then(r => { window.__A.horneado = r; });

const carga = document.getElementById('carga');
carga.style.opacity = '0';
setTimeout(() => carga.remove(), 600);
requestAnimationFrame(marco);
})();
</script>
