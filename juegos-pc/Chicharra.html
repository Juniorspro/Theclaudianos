<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CHICHARRA — enjambre orbital</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{width:100%;height:100%;background:#05030e;overflow:hidden;
    font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;overscroll-behavior:none}
  #envase{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05030e}
  #lienzo{display:block;background:#0a0620;touch-action:none}
  #cargando{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#7fd3ff;font-size:14px;letter-spacing:3px;background:#05030e;z-index:9}
</style>
</head>
<body>
<div id="envase"><canvas id="lienzo"></canvas></div>
<div id="cargando">CARGANDO…</div>
<script>
'use strict';
(function(){
/* ===========================================================================
   CHICHARRA — enjambre orbital
   Matamarcianos vertical, un solo HTML, sin red: todo el arte se dibuja con
   código y se hornea a lienzos; todo el sonido sale de osciladores.
   Se juega en vertical (412x892). Inspirado en los arcade de naves de celular,
   pero con bichos, paleta y música propias.
   ========================================================================= */

/* ---------------- lo que usa todo lo demás ---------------- */
var lim=function(v,a,b){return v<a?a:v>b?b:v;};
var sig=function(v){return v<0?-1:1;};
var TAU=Math.PI*2;
var dist2=function(ax,ay,bx,by){var dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
/* azar del mundo: con semilla, para que una partida se repita */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function semillaTexto(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
var rnd=mulberry(1);                       /* azar del mundo */
var az=Math.random;                        /* azar visual: NUNCA toca el del mundo */

/* el juego se piensa en 412 de ancho: todo el diseño está en esas unidades */
var ANCHO=412, ALTO=892;

/* ---------------- pantalla: un lienzo, unidades de diseño ---------------- */
var Pantalla={
  lienzo:null,g:null,S:1,dpr:1,W:412,H:892,pedir:true,cuenta:0,alCambiar:null,
  iniciar:function(lienzo){
    this.lienzo=lienzo;
    this.g=lienzo.getContext('2d',{alpha:false});
    var pedir=function(){Pantalla.pedir=true;};
    if(window.ResizeObserver)new ResizeObserver(pedir).observe(lienzo.parentNode);
    addEventListener('resize',pedir);addEventListener('orientationchange',pedir);
    this.medir();
  },
  /* el mundo mide siempre 412 de ancho; el alto sale de la forma de la pantalla */
  medir:function(){
    var cont=this.lienzo.parentNode;
    var cw=Math.max(1,cont.clientWidth||innerWidth), ch=Math.max(1,cont.clientHeight||innerHeight);
    var dpr=Math.min(devicePixelRatio||1,2);
    var S=cw/ANCHO;                          /* cuántos px CSS por unidad de diseño */
    var H=Math.round(ch/S), W=ANCHO;
    /* apaisado: si el mundo queda demasiado bajo, se achica todo y se centra,
       porque con menos de 620 de alto el menú no entra */
    if(H<620){S=ch/620;H=620;}
    H=lim(H,620,1500);
    this.pedir=false;
    if(W===this.W&&H===this.H&&Math.abs(S-this.S)<0.001&&dpr===this.dpr)return false;
    this.W=W;this.H=H;this.S=S;this.dpr=dpr;
    this.lienzo.width=Math.round(W*S*dpr);
    this.lienzo.height=Math.round(H*S*dpr);
    this.lienzo.style.width=Math.round(W*S)+'px';
    this.lienzo.style.height=Math.round(H*S)+'px';
    this.g.setTransform(S*dpr,0,0,S*dpr,0,0);
    this.g.imageSmoothingEnabled=true;
    ALTO=H;
    if(this.alCambiar)this.alCambiar(W,H);
    return true;
  },
  /* se revisa al EMPEZAR el cuadro: cambiar el tamaño del lienzo lo borra */
  revisar:function(){
    this.cuenta++;
    if(this.pedir||this.cuenta%30===0)this.medir();
  },
  /* de coordenadas de ventana a unidades de diseño */
  aMundo:function(cx,cy){
    var r=this.lienzo.getBoundingClientRect();
    return{x:(cx-r.left)/this.S,y:(cy-r.top)/this.S};
  }
};

/* ---------------- entrada: dedo, mouse y teclado dan lo mismo ---------------- */
var Entrada={
  tocando:false, x:0, y:0, x0:0, y0:0, acx:0, acy:0, id:null, filtro:null,
  tecla:{}, EDGE:{}, toques:[], suelta:null,
  iniciar:function(lienzo){
    var E=this;
    var idDe=function(t){return t.identifier!==undefined?t.identifier:'m';};
    var abajo=function(e){
      var ts=e.changedTouches?e.changedTouches:[e];
      for(var i=0;i<ts.length;i++){
        var t=ts[i], p=Pantalla.aMundo(t.clientX,t.clientY), id=idDe(t);
        E.toques.push({x:p.x,y:p.y,id:id});
        /* un dedo que cae sobre un botón del juego (bomba, pausa) no maneja la nave */
        if(E.id===null&&!(E.filtro&&E.filtro(p.x,p.y))){
          E.id=id;E.tocando=true;E.x=E.x0=p.x;E.y=E.y0=p.y;
        }
      }
      if(e.cancelable)e.preventDefault();
    };
    var mover=function(e){
      var ts=e.changedTouches?e.changedTouches:[e];
      for(var i=0;i<ts.length;i++){
        var t=ts[i];
        if(idDe(t)!==E.id)continue;
        var p=Pantalla.aMundo(t.clientX,t.clientY);
        /* se ACUMULA: en un cuadro pueden llegar varios movimientos y ninguno se pierde */
        E.acx+=p.x-E.x;E.acy+=p.y-E.y;E.x=p.x;E.y=p.y;
      }
      if(e.cancelable)e.preventDefault();
    };
    var arriba=function(e){
      var ts=e.changedTouches?e.changedTouches:[e];
      for(var i=0;i<ts.length;i++){
        if(idDe(ts[i])!==E.id)continue;
        /* el gesto entero: los menús lo leen como toque (si no se movió) o deslizamiento */
        E.suelta={dx:E.x-E.x0,dy:E.y-E.y0,x0:E.x0,y0:E.y0,x:E.x,y:E.y};
        E.id=null;E.tocando=false;
      }
      if(e.cancelable)e.preventDefault();
    };
    lienzo.addEventListener('touchstart',abajo,{passive:false});
    lienzo.addEventListener('touchmove',mover,{passive:false});
    lienzo.addEventListener('touchend',arriba,{passive:false});
    lienzo.addEventListener('touchcancel',arriba,{passive:false});
    lienzo.addEventListener('mousedown',abajo);
    addEventListener('mousemove',mover);
    addEventListener('mouseup',arriba);
    addEventListener('keydown',function(e){
      if(!E.tecla[e.code])E.EDGE[e.code]=true;
      E.tecla[e.code]=true;
      if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code)>=0)e.preventDefault();
    });
    addEventListener('keyup',function(e){E.tecla[e.code]=false;});
    addEventListener('blur',function(){E.tecla={};E.id=null;E.tocando=false;});
  },
  recien:function(c){return !!this.EDGE[c];},
  /* los flancos se borran al FINAL del paso: si no, un "recién apretado" no se lee */
  fin:function(){this.EDGE={};this.toques.length=0;this.acx=0;this.acy=0;this.suelta=null;}
};
/* ---------------- sonido: todo de osciladores, cero archivos ---------------- */
var Sonido={
  ac:null, maestro:null, busM:null, busE:null, busP:null, ruido:null, activo:true,
  volM:0.8, volE:0.9, paso:0, tProx:0, tema:'menu', temaProx:null,
  pistas:{}, fuente:null, ganFuente:null, fuenteTema:null,
  iniciar:function(){
    if(this.ac)return;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    this.ac=new AC();
    this.maestro=this.ac.createGain();this.maestro.connect(this.ac.destination);
    /* un poco de sala: el espacio no suena a auricular pegado */
    var conv=this.ac.createConvolver(), largo=Math.floor(this.ac.sampleRate*1.3);
    var b=this.ac.createBuffer(2,largo,this.ac.sampleRate);
    for(var c=0;c<2;c++){var d=b.getChannelData(c);
      for(var i=0;i<largo;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/largo,2.4);}
    conv.buffer=b;
    this.sala=this.ac.createGain();this.sala.gain.value=0.2;
    this.sala.connect(conv);conv.connect(this.maestro);
    this.busM=this.ac.createGain();this.busM.connect(this.maestro);this.busM.connect(this.sala);
    this.busE=this.ac.createGain();this.busE.connect(this.maestro);
    /* las pistas grabadas no pasan por la sala: ya vienen mezcladas */
    this.busP=this.ac.createGain();this.busP.connect(this.maestro);
    var n=this.ac.createBuffer(1,this.ac.sampleRate,this.ac.sampleRate), dd=n.getChannelData(0);
    for(var k=0;k<dd.length;k++)dd[k]=Math.random()*2-1;
    this.ruido=n;
    this.tProx=this.ac.currentTime+0.05;
    this.aplicarVol();
    this.decodificar();
  },
  aplicarVol:function(){
    if(!this.ac)return;
    this.maestro.gain.value=this.activo?0.62:0;
    this.busM.gain.value=0.5*this.volM;
    this.busP.gain.value=0.85*this.volM;
    this.busE.gain.value=0.9*this.volE;
  },
  /* la música generada viaja como data: adentro del HTML. Sin fetch: desde file://
     un fetch a data: se bloquea en silencio. Se decodifica a mano. */
  decodificar:function(){
    var A=window.ARCHIVOS||{}, S=this;
    ['menu','juego','jefe'].forEach(function(n){
      var d=A['musica-'+n];
      if(!d)return;
      try{
        var bin=atob(d.slice(d.indexOf(',')+1)), buf=new Uint8Array(bin.length);
        for(var i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
        S.ac.decodeAudioData(buf.buffer,function(ab){S.pistas[n]=ab;},function(){});
      }catch(e){}
    });
  },
  ahora:function(){return this.ac?this.ac.currentTime:0;},
  /* un tono con envolvente: la base de casi todos los efectos */
  tono:function(o){
    if(!this.ac||!this.activo)return;
    var t=o.t||this.ahora(), g=this.ac.createGain(), s=this.ac.createOscillator();
    s.type=o.tipo||'square';
    s.frequency.setValueAtTime(o.f,t);
    if(o.det)s.detune.setValueAtTime(o.det,t);
    if(o.f2)s.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+(o.dur||0.2));
    var v=o.vol===undefined?0.2:o.vol;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+(o.at||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(o.dur||0.2));
    var sal=g;
    if(o.filtro){var f=this.ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.filtro,t);
      if(o.filtro2)f.frequency.exponentialRampToValueAtTime(o.filtro2,t+(o.dur||0.2));
      g.connect(f);sal=f;}
    s.connect(g);sal.connect(o.bus||this.busE);
    if(o.sala)sal.connect(this.sala);
    s.start(t);s.stop(t+(o.dur||0.2)+0.05);
  },
  /* ruido filtrado: explosiones, motores, roce */
  soplo:function(o){
    if(!this.ac||!this.activo)return;
    var t=o.t||this.ahora(), f=o.f||900, dur=o.dur||0.3;
    var s=this.ac.createBufferSource();s.buffer=this.ruido;s.loop=true;
    s.playbackRate.value=0.7+Math.random()*0.6;
    var bp=this.ac.createBiquadFilter();bp.type=o.tipo||'lowpass';
    bp.frequency.setValueAtTime(f,t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60,o.f2||f*0.25),t+dur);
    bp.Q.value=o.q||1;
    var g=this.ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(o.vol===undefined?0.3:o.vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp);bp.connect(g);g.connect(o.bus||this.busE);
    if(o.sala!==false)g.connect(this.sala);
    s.start(t);s.stop(t+dur+0.05);
  },
  fx:function(n){
    if(!this.ac||!this.activo)return;
    var t=this.ahora(), v=0.9+Math.random()*0.2;   /* ±10 %: lo que se repite no cansa */
    switch(n){
      case 'tiro':   this.tono({f:820*v,f2:380,dur:0.06,vol:0.05,tipo:'square',t:t}); break;
      case 'tiro2':  this.tono({f:1180*v,f2:520,dur:0.05,vol:0.04,tipo:'sawtooth',t:t}); break;
      case 'tiroP':  this.tono({f:420*v,f2:120,dur:0.09,vol:0.08,tipo:'square',t:t,filtro:1800}); break;
      case 'tiroA':  this.tono({f:1900*v,f2:1200,dur:0.04,vol:0.035,tipo:'sine',t:t}); break;
      case 'tiroE':  this.tono({f:600*v,f2:300,dur:0.07,vol:0.04,tipo:'triangle',t:t}); break;
      case 'laser':  this.tono({f:260,f2:1400,dur:0.5,vol:0.12,tipo:'sawtooth',t:t,sala:true}); break;
      case 'golpe':  this.soplo({f:2600*v,f2:600,dur:0.06,vol:0.1,tipo:'bandpass',q:2,t:t,sala:false}); break;
      case 'revienta':
        this.soplo({f:1600*v,f2:70,dur:0.45,vol:0.34,t:t});
        this.tono({f:170*v,f2:38,dur:0.32,vol:0.24,tipo:'sine',t:t});
        this.soplo({f:5000,f2:1500,dur:0.2,vol:0.06,tipo:'highpass',t:t+0.03,sala:false}); break;
      case 'revienta2':
        this.soplo({f:1000,f2:40,dur:1.1,vol:0.5,t:t});
        this.tono({f:95,f2:24,dur:0.9,vol:0.36,tipo:'sine',t:t});
        this.soplo({f:4000,f2:800,dur:0.6,vol:0.12,tipo:'bandpass',q:0.8,t:t+0.08}); break;
      case 'moneda':
        this.tono({f:1318*v,dur:0.06,vol:0.1,tipo:'triangle',t:t});
        this.tono({f:1976*v,dur:0.1,vol:0.08,tipo:'triangle',t:t+0.05}); break;
      case 'poder':
        [523,659,784,1046,1318].forEach(function(f,i){
          Sonido.tono({f:f,dur:0.12,vol:0.1,tipo:'square',t:t+i*0.05,filtro:3000,sala:true});});
        this.tono({f:200,f2:1600,dur:0.3,vol:0.06,tipo:'sawtooth',t:t,filtro:2500}); break;
      case 'daño':
        this.soplo({f:600,f2:90,dur:0.38,vol:0.36,t:t});
        this.tono({f:240,f2:55,dur:0.32,vol:0.22,tipo:'sawtooth',t:t,filtro:1400});
        this.tono({f:3000,f2:600,dur:0.12,vol:0.06,tipo:'square',t:t}); break;
      case 'escudo': this.tono({f:600,f2:1500,dur:0.28,vol:0.12,tipo:'sine',t:t,sala:true});
                     this.tono({f:900,f2:2200,dur:0.22,vol:0.06,tipo:'triangle',t:t+0.04,sala:true}); break;
      case 'bomba':
        this.soplo({f:2400,f2:40,dur:1.4,vol:0.5,t:t});
        this.tono({f:80,f2:22,dur:1.2,vol:0.36,tipo:'sine',t:t});
        this.tono({f:1600,f2:80,dur:0.8,vol:0.1,tipo:'sawtooth',t:t,filtro:3000,filtro2:200}); break;
      case 'clic':   this.tono({f:1300,f2:1700,dur:0.04,vol:0.08,tipo:'square',t:t,filtro:4000}); break;
      case 'blip':   this.tono({f:700,f2:900,dur:0.05,vol:0.06,tipo:'triangle',t:t}); break;
      case 'desliza':this.soplo({f:1800,f2:600,dur:0.18,vol:0.08,tipo:'bandpass',q:1.2,t:t,sala:false}); break;
      case 'no':     this.tono({f:220,dur:0.08,vol:0.1,tipo:'square',t:t,filtro:1200});
                     this.tono({f:180,dur:0.12,vol:0.1,tipo:'square',t:t+0.09,filtro:1200}); break;
      case 'compra':
        [784,988,1318,1568].forEach(function(f,i){Sonido.tono({f:f,dur:0.14,vol:0.1,tipo:'triangle',t:t+i*0.06,sala:true});});
        break;
      case 'aviso':  this.tono({f:330,dur:0.2,vol:0.15,tipo:'sawtooth',t:t,filtro:1600});
                     this.tono({f:330,dur:0.2,vol:0.15,tipo:'sawtooth',t:t+0.3,filtro:1600}); break;
      case 'alarma':
        for(var a=0;a<3;a++){this.tono({f:220,f2:440,dur:0.34,vol:0.14,tipo:'sawtooth',t:t+a*0.42,filtro:2200,sala:true});}
        break;
      case 'warp':
        this.tono({f:120,f2:1800,dur:1.2,vol:0.12,tipo:'sawtooth',t:t,filtro:600,filtro2:6000,sala:true});
        this.soplo({f:300,f2:6000,dur:1.2,vol:0.14,tipo:'bandpass',q:0.7,t:t}); break;
      case 'nivel':
        [523,659,784,1046,1318].forEach(function(f,i){Sonido.tono({f:f,dur:0.22,vol:0.12,tipo:'square',t:t+i*0.1,filtro:3200,sala:true});}); break;
      case 'sello':  this.tono({f:90,f2:40,dur:0.3,vol:0.3,tipo:'sine',t:t});
                     this.soplo({f:900,f2:120,dur:0.25,vol:0.2,t:t}); break;
      case 'cuenta': this.tono({f:1500*v,dur:0.025,vol:0.04,tipo:'square',t:t}); break;
      case 'muerte':
        [392,330,262,196].forEach(function(f,i){Sonido.tono({f:f,dur:0.34,vol:0.14,tipo:'triangle',t:t+i*0.17,sala:true});}); break;
    }
  },
  musica:function(n){ if(this.tema!==n||this.temaProx)this.temaProx=n; },
  ponerPista:function(T){
    this.quitarPista();
    var s=this.ac.createBufferSource(), g=this.ac.createGain(), t=this.ac.currentTime;
    s.buffer=this.pistas[T];s.loop=true;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(1,t+0.7);
    s.connect(g);g.connect(this.busP);s.start(t);
    this.fuente=s;this.ganFuente=g;this.fuenteTema=T;
  },
  quitarPista:function(){
    if(!this.fuente)return;
    var t=this.ac.currentTime, g=this.ganFuente, s=this.fuente;
    g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(Math.max(0.0001,g.gain.value),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    try{s.stop(t+0.55);}catch(e){}
    this.fuente=null;this.fuenteTema=null;
  },
  /* si hay pista generada, suena esa; si no, el secuenciador sintetiza el tema */
  correr:function(){
    if(!this.ac||!this.activo)return;
    var T=this.temaProx||this.tema;
    if(this.pistas[T]){
      if(this.temaProx){this.tema=T;this.temaProx=null;}
      if(this.fuenteTema!==T)this.ponerPista(T);
      return;
    }
    if(this.fuente)this.quitarPista();
    var t=this.ac.currentTime;
    if(this.tProx<t)this.tProx=t+0.05;
    /* se programa con adelanto: si se espera al cuadro, el ritmo cojea */
    while(this.tProx<t+0.3){
      if(this.temaProx&&this.paso%16===0){this.tema=this.temaProx;this.temaProx=null;}
      this.pasoMusica(this.paso,this.tProx);
      this.tProx+=this.dur();this.paso++;
    }
  },
  dur:function(){return 60/TEMAS[this.tema].bpm/4;},
  midi:function(m){return 440*Math.pow(2,(m-69)/12);},
  pasoMusica:function(p,t){
    var T=TEMAS[this.tema], M=this.busM, n16=p%16, comp=Math.floor(p/16)%T.prog.length;
    var ac=T.prog[comp], raiz=ac[0], dur=this.dur(), S=this;
    /* colchón: el acorde entero, dos sierras desafinadas, al empezar el compás */
    if(n16===0){
      ac.forEach(function(m){
        [-9,9].forEach(function(det){
          S.tono({f:S.midi(m+12),det:det,dur:dur*16*1.02,vol:T.pad,tipo:'sawtooth',bus:M,t:t,at:dur*3,
                  filtro:T.nombre==='jefe'?900:1400,sala:true});
        });
      });
    }
    /* bajo */
    if(T.bajo[n16]){
      var oct=T.bajo[n16]===2?12:0;

/* ===========================================================================
   ARTE — todo se dibuja con código y se hornea UNA vez a lienzos chicos.
   Copiar un lienzo cuesta muchísimo menos que pintar figuras cada cuadro.
   Cada sprite se hornea al doble (K=2) y se dibuja a la mitad: así aguanta
   pantallas densas sin verse blando.
   ========================================================================= */
var K=2;
function lienzo(w,h){var c=document.createElement('canvas');c.width=Math.ceil(w*K);c.height=Math.ceil(h*K);
  var g=c.getContext('2d');g.scale(K,K);c.mw=w;c.mh=h;return c;}
function elipse(g,x,y,rx,ry,r){g.save();g.translate(x,y);if(r)g.rotate(r);g.beginPath();
  g.ellipse(0,0,rx,ry,0,0,TAU);g.restore();}
function lin(g,x0,y0,x1,y1,paradas){var d=g.createLinearGradient(x0,y0,x1,y1);
  for(var i=0;i<paradas.length;i++)d.addColorStop(paradas[i][0],paradas[i][1]);return d;}
function rad(g,x,y,r0,r1,paradas){var d=g.createRadialGradient(x,y,r0,x,y,r1);
  for(var i=0;i<paradas.length;i++)d.addColorStop(paradas[i][0],paradas[i][1]);return d;}
/* un halo: lo que hace que todo parezca que emite luz */
function halo(g,x,y,r,col,fuerza){
  g.save();g.globalCompositeOperation='lighter';
  g.fillStyle=rad(g,x,y,0,r,[[0,'rgba('+col+','+(fuerza||0.9)+')'],[0.45,'rgba('+col+',0.28)'],[1,'rgba('+col+',0)']]);
  g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.restore();
}

var TIPOS={
  chicharra:{r:15,col:['#ffd166','#e8792a','#8c3a12'],ojo:'#ff4d3d',alas:1.0,vida:2,pts:100},
  mosca:    {r:13,col:['#b8f0ff','#39a8d8','#154a6b'],ojo:'#7cffde',alas:1.25,vida:1,pts:120},

  escarabajo:{r:21,col:['#d9c4ff','#8257d6','#3c2170'],ojo:'#ffd23d',alas:0.7,vida:9,pts:300},
  polilla:  {r:16,col:['#ffd9c2','#c97a4a','#5d2f18'],ojo:'#fff2a8',alas:1.35,vida:3,pts:150}

function bicho(t){
  var T=TIPOS[t], r=T.r, w=r*4.4, h=r*3.4, c=lienzo(w,h), g=c.getContext('2d'), cx=w/2, cy=h/2+1;
  /* alas: translúcidas, con nervaduras */
  for(var s=-1;s<=1;s+=2){
    g.save();g.translate(cx+s*r*0.5,cy-r*0.35);g.rotate(s*0.55);
    g.fillStyle='rgba(255,255,255,0.82)';
    g.beginPath();g.ellipse(s*r*0.85*T.alas,-r*0.1,r*1.05*T.alas,r*0.42,0,0,TAU);g.fill();
    g.strokeStyle='rgba(120,150,190,0.55)';g.lineWidth=0.6;
    g.beginPath();g.moveTo(0,0);g.lineTo(s*r*1.7*T.alas,-r*0.12);g.stroke();
    g.restore();
  }
  /* patas */
  g.strokeStyle=T.col[2];g.lineWidth=1.4;g.lineCap='round';
  for(var i=-1;i<=1;i++)for(var s2=-1;s2<=1;s2+=2){
    g.beginPath();g.moveTo(cx+s2*r*0.5,cy+i*r*0.35);
    g.lineTo(cx+s2*(r*1.25),cy+i*r*0.5+r*0.35);g.stroke();
  }
  /* antenas */
  g.strokeStyle=T.col[1];g.lineWidth=1.2;
  for(var s3=-1;s3<=1;s3+=2){
    g.beginPath();g.moveTo(cx+s3*r*0.3,cy+r*0.55);
    g.quadraticCurveTo(cx+s3*r*0.9,cy+r*1.2,cx+s3*r*1.15,cy+r*1.35);g.stroke();
    g.fillStyle='#fff';g.beginPath();g.arc(cx+s3*r*1.15,cy+r*1.35,1.3,0,TAU);g.fill();
  }
  /* abdomen (arriba: el bicho vuela hacia abajo) */
  g.fillStyle=lin(g,cx,cy-r*1.2,cx,cy+r,[[0,T.col[0]],[0.55,T.col[1]],[1,T.col[2]]]);
  elipse(g,cx,cy-r*0.18,r*0.82,r*1.15);g.fill();
  /* bandas */
  g.fillStyle='rgba(30,16,8,0.45)';
  for(var b=0;b<3;b++){elipse(g,cx,cy-r*0.75+b*r*0.38,r*0.7-b*0.09*r,r*0.12);g.fill();}
  /* tórax y cabeza */
  g.fillStyle=lin(g,cx,cy+r*0.3,cx,cy+r*1.1,[[0,T.col[1]],[1,T.col[2]]]);
  elipse(g,cx,cy+r*0.72,r*0.62,r*0.48);g.fill();
  /* ojos grandes, que es lo que se lee de lejos */
  for(var s4=-1;s4<=1;s4+=2){
    var ex=cx+s4*r*0.33, ey=cy+r*0.78;
    g.fillStyle=T.ojo;elipse(g,ex,ey,r*0.25,r*0.28);g.fill();
    g.fillStyle='rgba(255,255,255,0.9)';g.beginPath();g.arc(ex-r*0.07,ey-r*0.08,r*0.08,0,TAU);g.fill();
  }
  /* brillo del caparazón */
  g.fillStyle='rgba(255,255,255,0.35)';elipse(g,cx-r*0.3,cy-r*0.6,r*0.18,r*0.42,-0.3);g.fill();
  return c;
}

  armar:function(W,H){

    this.nebu=c;

    for(var cp=0;cp<3;cp++){

      for(var j=0;j<cant[cp];j++)e.push({x:az()*W,y:az()*H,r:tam[cp]*(0.6+az()*0.7),
        b:0.35+az()*0.65,t:az()*TAU});

  /* el fondo HD, apilado con su espejo vertical: así se repite sin costura, siempre */
  tiraDe:function(z){

/* ---------------- efectos: partículas, temblor, congelado, destellos ---------------- */
var FX={
  part:[], ondas:[], textos:[], destellos:[], sac:0, flash:0, congelado:0,
  limpiar:function(){this.part.length=0;this.ondas.length=0;this.textos.length=0;this.destellos.length=0;this.sac=0;this.flash=0;},
  polvo:function(x,y,n,col,vel,vida,chispa){
    for(var i=0;i<n;i++){
      if(this.part.length>340)break;
      var a=az()*TAU, v=vel*(0.35+az());
      this.part.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        t:0,tm:(vida||0.5)*(0.6+az()*0.8),r:1+az()*2.6,col:col,chispa:!!chispa});
    }
  },
  onda:function(x,y,r,col,gordo){this.ondas.push({x:x,y:y,r:6,rm:r,t:0,col:col,g:gordo||3});},
  texto:function(x,y,txt,col,tam){this.textos.push({x:x,y:y,t:0,txt:txt,col:col||'#fff',tam:tam||14});},
  sacudir:function(n){if(Prog.aj&&Prog.aj.temblor===false)return;this.sac=Math.max(this.sac,n);},
  congelar:function(n){this.congelado=Math.max(this.congelado,n);},
  reventar:function(x,y,r,col){
    this.onda(x,y,r,col);
    this.destellos.push({x:x,y:y,r:r*1.1,t:0,tm:r>40?0.42:0.26});
    this.polvo(x,y,r>40?22:10,col,r*2.2,0.55);

    this.flash=Math.min(1,this.flash+(r>40?0.45:0.12));

  },
  pasar:function(dt){
    var i,p;
    for(i=this.part.length-1;i>=0;i--){
      p=this.part[i];p.t+=dt;
      if(p.t>=p.tm){this.part.splice(i,1);continue;}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.94;p.vy=p.vy*0.94+60*dt;

      var d=this.destellos[i];d.t+=dt;

      var x=this.textos[i];x.t+=dt;x.y-=26*dt;

      }

    for(i=0;i<this.ondas.length;i++){
      var o=this.ondas[i], a=(1-o.t)*0.85;
      g.strokeStyle='rgba('+o.col+','+a.toFixed(3)+')';g.lineWidth=o.g*(1-o.t*0.6);

    }
  }
};

    n=4+Math.floor(r()*4);
    var cx=60+r()*(ANCHO-120);
    for(var j=0;j<n;j++){
      M.bichos.push(nuevoBicho(ol.tipo,cx,-40-j*70,{dureza:ol.dureza,modo:'serpiente',
        ox:cx,vy:96+r()*40,amp:70+r()*40,per:2+r(),tTiro:j*0.5}));
    }
  } else if(ol.forma==='enjambre'){
    n=6+Math.floor(r()*4);
    var ex=ANCHO/2+(r()-0.5)*120;
    for(var k=0;k<n;k++){
      var a=k/n*TAU;
      M.bichos.push(nuevoBicho(ol.tipo,ex,-60,{dureza:ol.dureza,modo:'orbita',
        ox:ex,oy:190,amp:52+r()*26,per:3,fase:a,vy:70,tTiro:k*0.25}));
    }
  } else { /* lluvia: caen rápido y picados */
    n=5+Math.floor(r()*5);
    for(var m=0;m<n;m++){
      var lx=40+r()*(ANCHO-80);
      M.bichos.push(nuevoBicho(ol.tipo,lx,-40-m*90,{dureza:ol.dureza,modo:'picada',
        ox:lx,vy:150+r()*70,amp:26,per:1.2,tTiro:9e9}));
    }
  }
}

/* ---------------- el jugador ---------------- */
var VEL_BASE=560;
function pasarJugador(dt){
  var p=M.p, aj=Prog.aj;
  if(!p.vivo){p.tMuerta+=dt;return;}
  var vel=VEL_BASE*(1+mejNivel('vel')*0.08)*p.nav.velM;
  var x0=p.x,y0=p.y;
  if(Entrada.tocando){
    if(aj.control==='dedo'){
      /* bajo el dedo: la nave va arriba del dedo, si no el dedo la tapa */
      var k=1-Math.pow(0.0015,dt);
      p.x+=(Entrada.x-p.x)*k;p.y+=(Entrada.y-58-p.y)*k;
    } else {
      /* relativo: la nave copia lo que se mueve el dedo, esté donde esté el dedo */
      var f=aj.sens*(1+mejNivel('vel')*0.04)*p.nav.velM;
      p.x+=Entrada.acx*f;p.y+=Entrada.acy*f;
    }
  }
  /* teclado, para la compu */
  var tx=(Entrada.tecla['ArrowRight']||Entrada.tecla['KeyD']?1:0)-(Entrada.tecla['ArrowLeft']||Entrada.tecla['KeyA']?1:0);
  var ty=(Entrada.tecla['ArrowDown']||Entrada.tecla['KeyS']?1:0)-(Entrada.tecla['ArrowUp']||Entrada.tecla['KeyW']?1:0);
  if(tx||ty){p.x+=tx*vel*dt;p.y+=ty*vel*dt;}
  p.x=lim(p.x,22,ANCHO-22);p.y=lim(p.y,80,ALTO-44);
  /* el ladeo: la nave se inclina hacia donde va, y vuelve sola */
  var vx=(p.x-x0)/Math.max(dt,1e-4);
  p.ladeo+=(lim(vx/900,-1,1)-p.ladeo)*Math.min(1,dt*10);
  if(M.tuto>0){M.movido+=Math.abs(p.x-x0)+Math.abs(p.y-y0);
    if(M.movido>90){M.tuto=Math.min(M.tuto,0.6);if(!Prog.tuto){Prog.tuto=true;guardarProg();}}}
  if(p.inv>0)p.inv-=dt;
  if(p.escudo>0)p.escudo-=dt;
  if(p.fogon>0)p.fogon-=dt;
  /* dispara solo, como los arcade de celular */
  p.tTiro-=dt;
  if(p.tTiro<=0){
    p.tTiro=p.nav.cadencia;
    tirarJugador(p);
    p.fogon=0.05;
    Sonido.fx(p.nav.tiro);
  }
  /* las alas siguen a la nave con retraso y tiran más lento */
  for(var i=0;i<M.alas.length;i++){
    var a=M.alas[i];
    a.t+=dt;
    var bx=p.x+a.lado*44, by=p.y+18+Math.sin(a.t*3+i)*4;
    a.x+=(bx-a.x)*(1-Math.pow(0.002,dt));
    a.y+=(by-a.y)*(1-Math.pow(0.002,dt));
    a.tTiro-=dt;
    if(a.tTiro<=0){a.tTiro=0.2;tirar(a.x,a.y-10,0,-580,dano()*0.5,true,'balaP2');}
  }
}
function dano(){return 2*(1+mejNivel('poder')*0.12)*(M?M.p.nav.mult:1);}
function tirar(x,y,vx,vy,d,chica,sp){
  M.balas.push({x:x,y:y,vx:vx,vy:vy,r:chica?4:6,d:d,chica:!!chica,sp:sp||(chica?'balaP2':'balaP')});
}
function tirarJugador(p){
  var d=dano(), n=p.arma, id=p.nav.id, i;
  if(id==='brasa'){           /* pesada: pocos tiros, gordos, en pares */
    var A=[[-7,0],[7,0]];
    if(n>=2)A.push([-15,-0.12],[15,0.12]);
    if(n>=3)A.push([-22,-0.24],[22,0.24]);
    if(n>=5)A.push([0,0]);
    for(i=0;i<A.length;i++){
      var a=A[i][1];
      tirar(p.x+A[i][0],p.y-22,Math.sin(a)*640,-Math.cos(a)*640,d*(i<2?1:0.75),false,'balaB');
    }
    return;
  }
  if(id==='jade'){            /* agujas: todo recto, muy rápido, apretado */
    var cant=Math.min(5,n), sep=8;
    for(i=0;i<cant;i++){
      var ox=(i-(cant-1)/2)*sep;
      tirar(p.x+ox,p.y-30,0,-980,d,false,'aguja');
    }
    return;
  }
  if(n===1){tirar(p.x,p.y-24,0,-700,d);}
  else if(n===2){tirar(p.x-7,p.y-22,0,-700,d);tirar(p.x+7,p.y-22,0,-700,d);}
  else if(n===3){tirar(p.x,p.y-26,0,-720,d);tirar(p.x-13,p.y-14,-90,-680,d*0.8);tirar(p.x+13,p.y-14,90,-680,d*0.8);}
  else if(n===4){tirar(p.x-6,p.y-26,0,-720,d);tirar(p.x+6,p.y-26,0,-720,d);
    tirar(p.x-20,p.y-12,-150,-660,d*0.7,true);tirar(p.x+20,p.y-12,150,-660,d*0.7,true);}
  else{tirar(p.x,p.y-28,0,-760,d*1.2);
    tirar(p.x-9,p.y-24,-70,-720,d);tirar(p.x+9,p.y-24,70,-720,d);
    tirar(p.x-22,p.y-12,-230,-620,d*0.7,true);tirar(p.x+22,p.y-12,230,-620,d*0.7,true);}
}
function golpearJugador(){
  var p=M.p;
  if(p.inv>0||!p.vivo)return;
  if(p.escudo>0){
    p.escudo=0;p.inv=1.1;Sonido.fx('escudo');
    FX.onda(p.x,p.y,70,'120,220,255',4);FX.sacudir(4);
    FX.texto(p.x,p.y-40,'ESCUDO','#8fe9ff',13);
    return;
  }
  M.danoRecibido++;
  p.vidas--;p.arma=Math.max(1,p.arma-1);
  FX.reventar(p.x,p.y,56,'255,160,80');
  Sonido.fx('daño');FX.sacudir(9);FX.congelar(6);vibrar(70);
  M.combo=0;
  if(p.vidas<0){
    p.vivo=false;p.tMuerta=0;
    FX.reventar(p.x,p.y,90,'255,210,120');
    Sonido.fx('muerte');
    M.fin=1.6;M.resultado='perdio';
  } else {
    p.inv=2.2;
    M.balasE.length=0;
  }
}
function usarBomba(){
  var p=M.p;
  if(!p.vivo||p.bombas<=0)return;
  p.bombas--;
  Sonido.fx('bomba');vibrar(140);
  FX.onda(p.x,p.y-40,ANCHO*1.2,'255,240,180',9);
  FX.onda(p.x,p.y-40,ANCHO*0.8,'255,150,90',6);
  FX.flash=1;FX.sacudir(14);FX.congelar(7);
  M.balasE.length=0;
  for(var i=M.bichos.length-1;i>=0;i--)danarBicho(M.bichos[i],8+J.nivel,true);
  if(M.jefe)danarJefeCentro(26+J.nivel*3);
}

/* ---------------- los bichos: cada uno con una idea ---------------- */
function tirarBicho(b){
  var p=M.p;
  if(!p.vivo)return;
  var a=Math.atan2(p.y-b.y,p.x-b.x);
  if(b.tipo==='avispa'){          /* ráfaga de tres, dirigida */
    for(var i=-1;i<=1;i++)
      M.balasE.push({x:b.x,y:b.y,vx:Math.cos(a+i*0.22)*230,vy:Math.sin(a+i*0.22)*230,r:6,col:'255,70,70'});
  } else if(b.tipo==='escarabajo'){ /* abanico ancho, lento */
    for(var k=0;k<7;k++){
      var an=a-0.6+k*0.2;
      M.balasE.push({x:b.x,y:b.y,vx:Math.cos(an)*170,vy:Math.sin(an)*170,r:7,col:'200,120,255'});
    }
  } else if(b.tipo==='chicharra'){
    M.balasE.push({x:b.x,y:b.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:6,col:'255,90,60'});
  } else if(b.tipo==='mosca'){
    M.balasE.push({x:b.x,y:b.y,vx:0,vy:300,r:5,col:'120,230,255'});
  }
  Sonido.fx('tiro2');
}
function pasarBichos(dt){
  var p=M.p;
  for(var i=M.bichos.length-1;i>=0;i--){
    var b=M.bichos[i];
    b.t+=dt;
    if(b.golpe>0)b.golpe-=dt;
    switch(b.modo){
      case 'formacion':
        if(b.y<b.oy){b.y+=110*dt;}
        else{b.x=b.ox+Math.sin(b.t*TAU/b.per)*b.amp;b.y=b.oy+Math.sin(b.t*1.6)*7;}
        break;
      case 'cruza':
        b.x+=b.vx*dt;b.y+=b.vy*dt+Math.cos(b.t*TAU/b.per)*20*dt;
        if(b.x<-70||b.x>ANCHO+70)b.vx*=-1;
        break;
      case 'serpiente':
        b.y+=b.vy*dt;b.x=b.ox+Math.sin(b.t*TAU/b.per)*b.amp;
        break;
      case 'orbita':
        if(b.y<b.oy&&b.t<2.2){b.y+=b.vy*dt;}
        b.giro+=dt*1.5;
        b.x=b.ox+Math.cos(b.fase+b.giro)*b.amp;
        b.y=Math.min(b.oy,b.y)+Math.sin(b.fase+b.giro)*b.amp*0.55;
        break;
      case 'picada':
        b.y+=b.vy*dt;b.x=b.ox+Math.sin(b.t*TAU/b.per)*b.amp;
        if(b.tipo==='polilla'&&p.vivo&&b.y>90){    /* la polilla va a la luz: te busca */
          var a=Math.atan2(p.y-b.y,p.x-b.x);
          b.x+=Math.cos(a)*90*dt;b.y+=Math.sin(a)*40*dt;
        }
        break;
    }
    /* la mosca embiste cuando está a tiro */
    if(b.tipo==='mosca'&&b.modo!=='picada'&&p.vivo&&b.t>2.4&&Math.abs(b.x-p.x)<46){
      b.modo='picada';b.vy=310;b.ox=b.x;b.amp=10;b.per=0.8;b.t=0;
    }
    b.tTiro-=dt;
    if(b.tTiro<=0&&b.y>20&&b.y<ALTO*0.72){
      var calma=Math.max(0.62,1.5-J.nivel*0.09);   /* los primeros niveles dan aire */
      b.tTiro=((b.tipo==='escarabajo'?3.4:b.tipo==='avispa'?2.1:2.6)+rnd()*1.4)*calma;
      tirarBicho(b);
    }
    if(b.y>ALTO+70||b.x<-140||b.x>ANCHO+140){M.bichos.splice(i,1);continue;}
    /* choque con la nave */
    if(p.vivo&&p.inv<=0&&dist2(b.x,b.y,p.x,p.y)<(b.r+p.r*0.7)*(b.r+p.r*0.7)){
      danarBicho(b,3,false);golpearJugador();
    }
  }
}
function danarBicho(b,d,porBomba){
  b.vida-=d;b.golpe=0.09;
  if(b.vida>0){
    if(!porBomba){Sonido.fx('golpe');FX.polvo(b.x,b.y,2,'255,220,140',90,0.22);}
    return false;
  }
  var i=M.bichos.indexOf(b);
  if(i>=0)M.bichos.splice(i,1);
  FX.reventar(b.x,b.y,b.r*2.4,'255,170,80');
  Sonido.fx('revienta');
  M.matados++;M.combo++;M.tCombo=1.6;if(M.combo>M.comboMax)M.comboMax=M.combo;
  var pts=Math.round(b.pts*(1+M.combo*0.05));
  M.puntos+=pts;J.puntos=M.puntos;
  if(M.combo>=4)FX.texto(b.x,b.y-18,'x'+M.combo,'#ffd76a',13);
  soltarPremio(b.x,b.y,b.tipoDato);
  return true;
}
function soltarPremio(x,y,T){
  var r=rnd();
  if(r<0.1)M.items.push({x:x,y:y,vy:80,tipo:'arma',t:0});
  else if(r<0.12)M.items.push({x:x,y:y,vy:80,tipo:'escudo',t:0});
  else if(r<0.145)M.items.push({x:x,y:y,vy:80,tipo:'bomba',t:0});
  else if(r<0.5)M.items.push({x:x,y:y,vy:110,tipo:'moneda',t:0,val:T.pts>=200?5:1});
}
function pasarItems(dt){
  var p=M.p, iman=90+mejNivel('iman')*70;
  for(var i=M.items.length-1;i>=0;i--){
    var it=M.items[i];
    it.t+=dt;it.y+=it.vy*dt;
    /* el imán: las monedas se van solas a la nave */
    if(p.vivo&&dist2(it.x,it.y,p.x,p.y)<iman*iman){
      var a=Math.atan2(p.y-it.y,p.x-it.x), v=(it.tipo==='moneda'?420:260)*dt;
      it.x+=Math.cos(a)*v;it.y+=Math.sin(a)*v;
    }
    if(it.y>ALTO+30){M.items.splice(i,1);continue;}
    if(p.vivo&&dist2(it.x,it.y,p.x,p.y)<26*26){
      M.items.splice(i,1);
      if(it.tipo==='moneda'){M.monedas+=it.val;Sonido.fx('moneda');
        FX.texto(it.x,it.y,'+'+it.val,'#ffd76a',12);}
      else if(it.tipo==='arma'){
        if(p.arma<5){p.arma++;FX.texto(p.x,p.y-46,'ARMA '+p.arma,'#9fe8ff',15);}
        else{M.puntos+=500;FX.texto(p.x,p.y-46,'+500','#9fe8ff',15);}
        Sonido.fx('poder');FX.onda(p.x,p.y,60,'140,230,255',3);
        if(p.arma>=3&&M.alas.length<2+mejNivel('ala')){M.alas.push({lado:M.alas.length?1:-1,x:p.x,y:p.y,t:0,tTiro:0});}
      }
      else if(it.tipo==='escudo'){p.escudo=9;Sonido.fx('escudo');FX.texto(p.x,p.y-46,'ESCUDO','#8fe9ff',15);}
      else if(it.tipo==='bomba'){p.bombas++;Sonido.fx('poder');FX.texto(p.x,p.y-46,'BOMBA','#ffd0a0',15);}
    }
  }
}

/* ---------------- el jefe: tres fases y dos cañones que se le rompen ---------------- */
/* cada jefe: dónde tiene los cañones y el núcleo (sobre el sprite HD de 300 de ancho),
   por dónde tira, y qué ataques usa en cada fase */
var JEFES=[
  {nom:'REINA CHICHARRA', col:'255,170,60',
   hd:{can:[[-80,-50],[80,-50]],nuc:[0,-6,42],boca:[0,48]},
   fases:[['dirigido','abanico'],['abanico','crias','dirigido'],['laser','abanico','crias','espiral']],
   crias:['chicharra','mosca']},
  {nom:'MANTIS DE ACERO', col:'255,80,220',
   hd:{can:[[-100,-40],[100,-40]],nuc:[0,70,38],boca:[0,118]},
   fases:[['tajo','rafaga'],['tajo','laser','rafaga'],['cruz','tajo','laser','rafaga']],
   crias:['mosca','mosca']},
  {nom:'COLOSO VIOLETA', col:'190,110,255',
   hd:{can:[[-104,-8],[104,-8]],nuc:[0,34,48],boca:[0,122]},
   fases:[['lluvia','abanico'],['espiral','lluvia','crias'],['espiral','lluvia','laser','crias']],
   crias:['polilla','chicharra']}
];
/* la geometría del jefe dibujado por código (el respaldo) */
var GEO_CODIGO={can:[[-52,40],[52,40]],nuc:[0,40,46],boca:[0,72]};
function geoJefe(b){
  if(!SPR.jefeHD[b.cual])return GEO_CODIGO;
  /* la geometría está medida sobre 300 de ancho: se escala al ancho con que se dibuja */
  var h=JEFES[b.cual].hd, k=ANCHO_HD.jefe/300;
  if(h._k!==k){
    h._g={can:h.can.map(function(c){return[c[0]*k,c[1]*k];}),nuc:[h.nuc[0]*k,h.nuc[1]*k,h.nuc[2]*k],boca:[h.boca[0]*k,h.boca[1]*k]};
    h._k=k;
  }
  return h._g;
}
/* dónde se planta: con la cabeza abajo del HUD, sea cual sea el alto del sprite */
function yJefe(b){return 80+SPR.jefe[b.cual].mh/2;}
function nuevoJefe(nivel){
  var vida=220+nivel*90, cv=48+nivel*14, cual=zonaDe(nivel);
  return {x:ANCHO/2,y:-180,vida:vida,vidaMax:vida,rastro:vida,t:0,fase:1,entrando:true,
    dir:1,ataque:'nada',tAtaque:2.2,tCarga:0,golpe:0,cual:cual,
    canones:[{lado:-1,vida:cv,vidaMax:cv,vivo:true},{lado:1,vida:cv,vidaMax:cv,vivo:true}],
    inv:0, muriendo:0};
}
function danarJefeCentro(d){
  var b=M.jefe;if(!b||b.muriendo)return;
  b.vida-=d;b.golpe=0.08;
  var f=b.vida/b.vidaMax;
  var nf=f>0.62?1:f>0.3?2:3;
  if(nf!==b.fase){
    b.fase=nf;b.tAtaque=1.2;
    FX.onda(b.x,b.y,190,JEFES[b.cual].col,6);FX.sacudir(8);
    Sonido.fx('aviso');
    FX.texto(ANCHO/2,ALTO*0.42,'FASE '+nf,'#ff9a5a',26);
  }
  if(b.vida<=0){
    b.vida=0;b.muriendo=2.4;
    M.resultado='gano';M.espiral=null;M.laser=null;
    Sonido.fx('revienta2');vibrar(220);
  }
}
function pasarJefe(dt){
  var b=M.jefe, p=M.p, G=geoJefe(b);
  b.t+=dt;
  if(b.golpe>0)b.golpe-=dt;
  /* la barra deja un rastro blanco que baja de a poco: se ve cuánto le sacaste */
  if(b.rastro>b.vida)b.rastro=Math.max(b.vida,b.rastro-b.vidaMax*0.35*dt);
  if(b.muriendo>0){
    b.muriendo-=dt;
    b.y+=14*dt;
    if(az()<0.55){
      var ex=b.x+(az()-0.5)*240, ey=b.y+(az()-0.5)*200;
      FX.reventar(ex,ey,30+az()*44,'255,190,90');
      if(az()<0.35)Sonido.fx('revienta');
    }
    if(b.muriendo<=0){
      FX.reventar(b.x,b.y,260,'255,240,170');FX.flash=1;FX.sacudir(16);
      Sonido.fx('revienta2');vibrar(300);
      for(var q=0;q<16;q++)M.items.push({x:b.x+(az()-0.5)*170,y:b.y+(az()-0.5)*90,vy:90,tipo:'moneda',t:0,val:5});
      M.jefe=null;M.fin=2.2;
    }
    return;
  }
  if(b.entrando){
    b.y+=95*dt;
    if(b.y>=yJefe(b)){b.y=yJefe(b);b.entrando=false;b.tAtaque=1.4;}
    return;
  }
  /* se pasea de un lado al otro, más rápido cuanto peor está */
  var vel=(40+b.fase*24);
  b.x+=b.dir*vel*dt;
  var borde=Math.min(130,SPR.jefe[b.cual].mw*0.42);
  if(b.x<borde){b.x=borde;b.dir=1;}
  if(b.x>ANCHO-borde){b.x=ANCHO-borde;b.dir=-1;}
  b.y=yJefe(b)+Math.sin(b.t*1.1)*10;
  /* cada ataque se anuncia antes: el aviso es lo que lo hace justo */
  b.tAtaque-=dt;
  if(b.ataque==='nada'&&b.tAtaque<=0){
    var op=JEFES[b.cual].fases[b.fase-1];
    b.ataque=op[Math.floor(rnd()*op.length)];
    b.tCarga=b.ataque==='laser'?1.1:0.55;
    if(b.ataque==='laser')Sonido.fx('aviso');
  }
  if(b.ataque!=='nada'&&b.tCarga>0){
    b.tCarga-=dt;
    if(b.tCarga<=0)soltarAtaqueJefe(b);
  }
  /* la espiral dura un rato: se emite de a poco, no toda de golpe */
  if(M.espiral){
    var E=M.espiral;E.t+=dt;E.acum+=dt;
    while(E.acum>0.075){
      E.acum-=0.075;E.a+=0.42;
      for(var k=0;k<2;k++){
        var an=E.a+k*Math.PI;
        M.balasE.push({x:b.x+G.boca[0],y:b.y+G.boca[1]-20,vx:Math.cos(an)*150,vy:Math.sin(an)*150,r:6,col:'200,120,255'});
      }
    }
    if(E.t>E.dur)M.espiral=null;
  }
  /* los cañones vivos tiran solos */
  for(var i=0;i<b.canones.length;i++){
    var cn=b.canones[i];
    if(!cn.vivo)continue;
    cn.t=(cn.t||rnd()*2)-dt;
    if(cn.t<=0){
      cn.t=2.6-b.fase*0.4;
      var cx=b.x+G.can[i][0], cy=b.y+G.can[i][1]+18;
      var a=p.vivo?Math.atan2(p.y-cy,p.x-cx):Math.PI/2;
      M.balasE.push({x:cx,y:cy,vx:Math.cos(a)*250,vy:Math.sin(a)*250,r:7,col:'255,80,60'});
      Sonido.fx('tiroE');
    }
  }
}
function soltarAtaqueJefe(b){
  var p=M.p, i, k, a, G=geoJefe(b), bx=b.x+G.boca[0], by=b.y+G.boca[1];
  var alJ=function(x,y){return p.vivo?Math.atan2(p.y-y,p.x-x):Math.PI/2;};
  var bala=function(x,y,an,v,r,col){M.balasE.push({x:x,y:y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,r:r||7,col:col});};
  switch(b.ataque){
    case 'dirigido':
      a=alJ(bx,by);
      for(i=0;i<9;i++)bala(bx,by,a+(i-4)*0.13,290,7,'255,90,70');
      Sonido.fx('laser');break;
    case 'abanico':
      var n=18+b.fase*4;
      for(i=0;i<n;i++)bala(bx,by-10,i/n*TAU+b.t,175,7,'255,120,200');
      Sonido.fx('laser');FX.onda(bx,by-10,90,'255,140,200',4);break;
    case 'crias':
      var C=JEFES[b.cual].crias;
      for(i=0;i<4;i++){
        var x=b.x+(i-1.5)*56;
        M.bichos.push(nuevoBicho(C[i%2],x,b.y+40,
          {dureza:1+J.nivel*0.1,modo:'picada',ox:x,vy:180,amp:24,per:1.1,tTiro:1.2}));
      }
      Sonido.fx('poder');break;
    case 'laser':
      M.laser={x:bx,y:by,t:0,dur:1.5};
      Sonido.fx('laser');FX.sacudir(6);break;
    case 'tajo':            /* cada brazo suelta una línea de agujas que se abre como un tajo */
      for(i=0;i<2;i++){
        var cx=b.x+G.can[i][0], cy=b.y+G.can[i][1]+30;
        a=alJ(cx,cy)+(i?-0.18:0.18);
        for(k=0;k<8;k++)bala(cx,cy,a+(k-3.5)*0.05*(i?-1:1),170+k*30,5,'255,90,230');
      }
      Sonido.fx('laser');break;
    case 'rafaga':          /* cinco agujas al mismo ángulo, a distinta velocidad: una lanza */
      a=alJ(bx,by);
      for(k=0;k<6;k++)bala(bx,by,a,240+k*34,5,'255,90,230');
      for(k=0;k<4;k++){bala(bx,by,a-0.35,230+k*30,5,'255,90,230');bala(bx,by,a+0.35,230+k*30,5,'255,90,230');}
      Sonido.fx('tiro2');break;
    case 'cruz':            /* una cruz que gira: cuatro brazos de balas */
      for(i=0;i<4;i++)for(k=0;k<6;k++)bala(bx,by-20,b.t*0.8+i*Math.PI/2,120+k*34,6,'255,120,200');
      Sonido.fx('laser');FX.onda(bx,by-20,110,'255,120,220',5);break;
    case 'lluvia':          /* lluvia pareja desde las torretas, con huecos para pasar */
      var hueco=Math.floor(rnd()*10);
      for(i=0;i<12;i++){
        if(i===hueco||i===hueco+1)continue;
        M.balasE.push({x:20+i*((ANCHO-40)/11),y:b.y+30,vx:(rnd()-0.5)*30,vy:120+rnd()*50,r:7,col:'200,120,255'});
      }
      Sonido.fx('tiro2');break;
    case 'espiral':
      M.espiral={t:0,acum:0,a:b.t,dur:1.6+b.fase*0.4};
      Sonido.fx('laser');break;
  }
  b.ataque='nada';
  b.tAtaque=(b.fase===3?1.5:b.fase===2?2.1:2.7)+rnd()*0.8;
}
function pasarLaser(dt){
  var L=M.laser, p=M.p;
  if(!L)return;
  L.t+=dt;
  if(M.jefe&&!M.jefe.muriendo){var G=geoJefe(M.jefe);L.x+=(M.jefe.x+G.boca[0]-L.x)*0.06;L.y=M.jefe.y+G.boca[1];}
  /* el rayo quema sólo después de la carga, y sólo a lo ancho de la columna */
  if(L.t>0.35&&p.vivo&&p.inv<=0&&Math.abs(p.x-L.x)<22&&p.y>L.y)golpearJugador();
  if(L.t>=L.dur)M.laser=null;
}
/* ---------------- balas ---------------- */
function pasarBalas(dt){
  var i,b;
  for(i=M.balas.length-1;i>=0;i--){
    b=M.balas[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y<-30||b.x<-30||b.x>ANCHO+30){M.balas.splice(i,1);continue;}
    var pego=false;
    for(var k=0;k<M.bichos.length;k++){
      var e=M.bichos[k];
      if(dist2(b.x,b.y,e.x,e.y)<(e.r+b.r)*(e.r+b.r)){
        danarBicho(e,b.d,false);pego=true;break;
      }
    }
    if(!pego&&M.jefe&&!M.jefe.entrando&&!M.jefe.muriendo)pego=pegarAlJefe(b);
    if(pego)M.balas.splice(i,1);
  }
  for(i=M.balasE.length-1;i>=0;i--){
    b=M.balasE[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y>ALTO+30||b.y<-60||b.x<-40||b.x>ANCHO+40){M.balasE.splice(i,1);continue;}
    var p=M.p;
    if(p.vivo&&p.inv<=0&&dist2(b.x,b.y,p.x,p.y)<(b.r+p.r*0.55)*(b.r+p.r*0.55)){
      M.balasE.splice(i,1);
      golpearJugador();
      /* golpear vacía las balas del enemigo: sin esto, el índice queda colgado */
      i=Math.min(i,M.balasE.length);
    }
  }
}
function pegarAlJefe(b){
  var j=M.jefe, G=geoJefe(j);
  /* los cañones primero: son lo que sobresale */
  for(var i=0;i<j.canones.length;i++){
    var c=j.canones[i];
    if(!c.vivo)continue;
    var cx=j.x+G.can[i][0], cy=j.y+G.can[i][1];
    if(dist2(b.x,b.y,cx,cy)<(32+b.r)*(32+b.r)){
      c.vida-=b.d;c.golpe=0.08;
      FX.polvo(b.x,b.y,2,'255,220,150',90,0.2);Sonido.fx('golpe');
      if(c.vida<=0){
        c.vivo=false;
        FX.reventar(cx,cy,74,'255,180,90');Sonido.fx('revienta');vibrar(40);
        FX.texto(cx,cy-30,'¡PIEZA ROTA!','#ffd76a',16);
        M.puntos+=1500;
      }
      return true;
    }
  }
  if(dist2(b.x,b.y,j.x+G.nuc[0],j.y+G.nuc[1])<(G.nuc[2]+b.r)*(G.nuc[2]+b.r)){
    danarJefeCentro(b.d);
    FX.polvo(b.x,b.y,2,'255,220,150',90,0.2);Sonido.fx('golpe');
    return true;
  }
  return false;
}
/* ---------------- un paso del mundo ---------------- */
function pasarJuego(dt){
  var m=M;
  m.tNivel+=dt;
  if(m.tCombo>0){m.tCombo-=dt;if(m.tCombo<=0)m.combo=0;}
  Fondo.pasar(dt,1);
  pasarJugador(dt);
  pasarBichos(dt);
  pasarBalas(dt);
  pasarItems(dt);
  if(m.jefe)pasarJefe(dt);
  if(m.laser)pasarLaser(dt);
  FX.pasar(dt);
  if(m.cartelJefe>0)m.cartelJefe-=dt;
  if(m.tuto>0)m.tuto-=dt*(m.movido>90?1:0.25);
  if(m.intro>0){m.intro-=dt;return;}
  /* el reloj: cuando se acaba, baja el jefe */
  if(!m.jefe&&m.avisoJefe<=0&&m.reloj>0){
    m.reloj-=dt;
    if(m.reloj<=0){m.reloj=0;m.avisoJefe=2.4;Sonido.fx('alarma');Sonido.musica('jefe');vibrar(80);}
  }
  if(m.avisoJefe>0){
    m.avisoJefe-=dt;
    if(m.avisoJefe<=0){m.jefe=nuevoJefe(J.nivel);m.bichos.length=0;m.cartelJefe=3;}
  }
  /* las oleadas entran de a una mientras no esté el jefe */
  if(!m.jefe&&m.avisoJefe<=0&&m.reloj>0){
    m.tOleada-=dt;
    if(m.tOleada<=0&&m.bichos.length<Math.min(26,10+J.nivel*2)){
      var ol=m.oleadas[m.iOleada%m.oleadas.length];
      lanzarOleada(ol);
      m.iOleada++;
      m.tOleada=ol.espera+Math.max(1.2,2.8-J.nivel*0.16);
    }
  }
  /* fin de la partida */
  if(m.fin>0){
    m.fin-=dt;
    if(m.fin<=0)terminarNivel(m.resultado);
  }
}
function terminarNivel(res){
  var m=M, gano=res==='gano';
  var rango=gano?(m.danoRecibido===0?'S':m.danoRecibido<=2?'A':m.danoRecibido<=5?'B':'C'):'-';
  var extra=gano?({S:60,A:35,B:15,C:5})[rango]:0;       /* el rango paga */
  Prog.monedas+=m.monedas+extra;
  var record=m.puntos>Prog.record;
  if(record)Prog.record=m.puntos;
  if(gano){
    if(J.nivel+1>Prog.mejorNivel)Prog.mejorNivel=J.nivel+1;
    var orden='SABC', viejo=Prog.rangos[J.nivel];
    if(!viejo||orden.indexOf(rango)<orden.indexOf(viejo))Prog.rangos[J.nivel]=rango;
    Sonido.fx('nivel');
  }
  guardarProg();
  J.resumen={gano:gano,puntos:m.puntos,monedas:m.monedas,extra:extra,matados:m.matados,
    dano:m.danoRecibido,nivel:J.nivel,rango:rango,combo:m.comboMax,record:record};
  irA('fin');
  Sonido.musica('menu');
}
/* ===========================================================================
   DIBUJO
   ========================================================================= */
function copiar(g,c,x,y,esc,rot,alfa){
  if(!c)return;
  var w=c.mw*(esc||1), h=c.mh*(esc||1);
  g.save();
  if(alfa!==undefined)g.globalAlpha=alfa;
  g.translate(x,y);
  if(rot)g.rotate(rot);
  g.drawImage(c,-w/2,-h/2,w,h);
  g.restore();
}
function dibujarMundo(g,t){
  if(!M){Fondo.dibujar(g,t);return;}
  var m=M, p=m.p, i;
  Fondo.dibujar(g,t);
  /* items */
  for(i=0;i<m.items.length;i++){
    var it=m.items[i];
    var sp=it.tipo==='moneda'?SPR.moneda:it.tipo==='arma'?SPR.capArma:
           it.tipo==='escudo'?SPR.capEscudo:SPR.capBomba;
    copiar(g,sp,it.x,it.y,1+Math.sin(it.t*6)*0.06,it.tipo==='moneda'?Math.sin(it.t*3)*0.3:0);
  }
  /* bichos: aletean (se aplastan un poco a lo ancho) y se mecen */
  for(i=0;i<m.bichos.length;i++){
    var b=m.bichos[i];
    var sp2=SPR.bicho[b.tipo], ale=1+Math.sin(b.t*26)*0.05, rot=Math.sin(b.t*2.2)*0.1;
    g.save();g.translate(b.x,b.y);g.rotate(rot);g.scale(ale,1/ale);
    g.drawImage(sp2,-sp2.mw/2,-sp2.mh/2,sp2.mw,sp2.mh);
    if(b.golpe>0){           /* destello blanco al recibir: dice "le pegué" */
      g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,b.golpe*8);
      var si=SPR.siluetaBicho[b.tipo];
      g.drawImage(si,-si.mw/2,-si.mh/2,si.mw,si.mh);
    }
    g.restore();
    if(b.vidaMax>3&&b.vida<b.vidaMax){   /* barrita de vida sólo en los que aguantan y ya cobraron */
      var f=b.vida/b.vidaMax;
      g.fillStyle='rgba(0,0,0,0.55)';g.fillRect(b.x-15,b.y-b.r-12,30,4);
      g.fillStyle=f>0.5?'#7cff9d':f>0.25?'#ffd24a':'#ff5a4a';
      g.fillRect(b.x-15,b.y-b.r-12,30*f,4);
    }
  }
  if(m.jefe)dibujarJefe(g,m.jefe,t);
  /* el rayo */
  if(m.laser){
    var L=m.laser;
    g.save();
    if(L.t<0.35){        /* la línea de aviso: se ve antes de quemar */
      g.globalAlpha=0.5+0.5*Math.sin(L.t*40);
      g.fillStyle='rgba(255,90,120,0.55)';g.fillRect(L.x-2,L.y,4,ALTO);
    } else {
      g.globalCompositeOperation='lighter';
      var an=1-(L.t-0.35)/(L.dur-0.35), w=26*(0.6+an*0.9);
      g.globalAlpha=0.95;
      g.drawImage(SPR.laser,L.x-w/2,L.y,w,ALTO);
      g.drawImage(SPR.destello,L.x-30,L.y-30,60,60);
    }
    g.restore();
  }
  /* balas del enemigo */
  for(i=0;i<m.balasE.length;i++){
    var be=m.balasE[i];
    copiar(g,SPR.balaE[be.col]||SPR.balaE['255,90,60'],be.x,be.y,be.r/6);
  }
  /* alas de apoyo */
  for(i=0;i<m.alas.length;i++)copiar(g,SPR.ala,m.alas[i].x,m.alas[i].y,1,m.alas[i].lado*0.05,0.95);
  /* la nave */
  if(p.vivo){
    var parpadeo=p.inv>0&&p.inv<2.5&&Math.floor(p.inv*14)%2===0;
    if(!parpadeo)dibujarNave(g,p.x,p.y,p.nav,p.arma,p.ladeo,t,p.fogon>0);
    if(p.escudo>0){
      g.save();g.globalCompositeOperation='lighter';
      g.globalAlpha=p.escudo<2?0.35+0.35*Math.sin(t*22):0.6;
      g.strokeStyle='#8fe9ff';g.lineWidth=2;
      g.beginPath();g.arc(p.x,p.y,36+Math.sin(t*5)*1.5,0,TAU);g.stroke();
      g.fillStyle=rad(g,p.x,p.y,12,38,[[0,'rgba(140,230,255,0)'],[1,'rgba(140,230,255,0.28)']]);
      g.beginPath();g.arc(p.x,p.y,38,0,TAU);g.fill();
      g.restore();
    }
  }
  /* balas propias */
  for(i=0;i<m.balas.length;i++){
    var bp=m.balas[i];
    copiar(g,SPR[bp.sp]||SPR.balaP,bp.x,bp.y);
  }
  FX.dibujar(g);
}
/* la nave, con ladeo, fuego de motores y fogonazo: la usan el juego y el hangar */
function dibujarNave(g,x,y,nav,arma,ladeo,t,fogon,esc){
  esc=esc||1;
  var sp=SPR.naveHD[nav.id]||SPR.nave[Math.min(5,arma||1)];
  /* fuego de los motores, del color de cada nave */
  g.save();g.globalCompositeOperation='lighter';
  var f=0.75+0.25*Math.sin(t*34)+0.1*Math.sin(t*71);
  var fy=y+sp.mh*0.42*esc;
  g.fillStyle=rad(g,x,fy,1,24*f*esc,[[0,'rgba(255,255,255,0.95)'],[0.3,'rgba('+nav.fuego+',0.6)'],[1,'rgba('+nav.fuego+',0)']]);
  g.fillRect(x-30*esc,fy-18*esc,60*esc,50*esc);
  g.restore();
  g.save();g.translate(x,y);
  if(ladeo){g.rotate(ladeo*0.1);g.scale(1-Math.abs(ladeo)*0.16,1);}
  g.drawImage(sp,-sp.mw/2*esc,-sp.mh/2*esc,sp.mw*esc,sp.mh*esc);
  g.restore();
  if(fogon){
    g.save();g.globalCompositeOperation='lighter';g.globalAlpha=0.85;
    g.drawImage(SPR.destello,x-11,y-sp.mh*0.5-14,22,22);
    g.restore();
  }
}
function dibujarJefe(g,b,t){
  var G=geoJefe(b), sp=SPR.jefe[b.cual];
  g.save();
  if(b.muriendo>0)g.globalAlpha=0.6+0.4*Math.sin(t*40);
  /* respira: una escala mínima que late con su fase */
  var lat=1+Math.sin(t*(2+b.fase))*0.012;
  g.translate(b.x,b.y);g.scale(lat,lat);
  g.drawImage(sp,-sp.mw/2,-sp.mh/2,sp.mw,sp.mh);
  if(b.golpe>0){
    g.globalCompositeOperation='lighter';g.globalAlpha=Math.min(1,b.golpe*6);
    var si=SPR.jefeSilueta[b.cual];
    g.drawImage(si,-si.mw/2,-si.mh/2,si.mw,si.mh);
  }
  g.restore();
  /* núcleo que brilla más cuando está por atacar */
  g.save();g.globalCompositeOperation='lighter';
  var carga=b.ataque!=='nada'?1-b.tCarga/0.6:0;
  g.globalAlpha=0.35+0.25*Math.sin(t*6)+carga*0.5;
  var r=G.nuc[2]*(1.1+carga*0.5);
  g.drawImage(SPR.destello,b.x+G.nuc[0]-r,b.y+G.nuc[1]-r,r*2,r*2);
  g.restore();
  /* los cañones rotos echan humo; los vivos, cuando reciben, destellan */
  for(var i=0;i<b.canones.length;i++){
    var c=b.canones[i], cx=b.x+G.can[i][0], cy=b.y+G.can[i][1];
    if(!c.vivo){
      g.save();
      g.fillStyle=rad(g,cx,cy,2,36,[[0,'rgba(40,36,48,0.85)'],[1,'rgba(30,30,40,0)']]);
      g.beginPath();g.arc(cx,cy,36,0,TAU);g.fill();g.restore();
      if(az()<0.3)FX.polvo(cx,cy,1,'120,120,140',40,0.7);
    } else if(c.golpe>0){
      c.golpe-=1/60;
      g.save();g.globalCompositeOperation='lighter';g.globalAlpha=0.7;
      g.drawImage(SPR.destello,cx-22,cy-22,44,44);g.restore();
    }
  }
}
/* ===========================================================================
   INTERFAZ — todo dibujado en el lienzo. Los botones del juego (bomba, pausa)
   responden al APOYAR el dedo; los de los menús, al LEVANTARLO sin haberlo
   corrido: así se puede deslizar un menú sin apretar nada sin querer.
   ========================================================================= */
var UI={rects:[],apretado:null,
  limpiar:function(){this.rects.length=0;},
  boton:function(id,x,y,w,h,inmediato){this.rects.push({id:id,x:x,y:y,w:w,h:h,inm:!!inmediato});},
  bajo:function(x,y,soloInm){
    for(var k=this.rects.length-1;k>=0;k--){
      var r=this.rects[k];
      if(soloInm&&!r.inm)continue;
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r;
    }
    return null;
  },
  /* los inmediatos: al apoyar */
  tocado:function(){
    for(var i=0;i<Entrada.toques.length;i++){
      var r=this.bajo(Entrada.toques[i].x,Entrada.toques[i].y,true);
      if(r)return r.id;
    }
    return null;
  },
  /* los de menú: al soltar, si el dedo no se corrió y empezó sobre el mismo botón */
  soltado:function(){
    var s=Entrada.suelta;
    if(!s||Math.abs(s.dx)>16||Math.abs(s.dy)>16)return null;
    var r=this.bajo(s.x,s.y), r0=this.bajo(s.x0,s.y0);
    return r&&r0&&r.id===r0.id&&!r.inm?r.id:null;
  },
  donde:function(id){
    for(var i=0;i<this.rects.length;i++)if(this.rects[i].id===id){
      var r=this.rects[i];return{x:r.x+r.w/2,y:r.y+r.h/2,inm:r.inm};
    }
    return null;
  }
};
/* la entrada de cada elemento del menú: sube con rebote, escalonada */
function entra(retraso){
  var x=lim((J.tMenu-(retraso||0))/0.42,0,1);
  if(x<=0)return 0;
  var c1=1.70158,c3=c1+1;
  return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);
}
function texto(g,txt,x,y,tam,col,al,borde){
  g.save();
  g.font='bold '+tam+'px "Trebuchet MS",Verdana,sans-serif';
  g.textAlign=al||'center';g.textBaseline='middle';
  if(borde!==false){g.lineJoin='round';g.lineWidth=Math.max(2,tam*0.16);g.strokeStyle='rgba(8,6,20,0.85)';g.strokeText(txt,x,y);}
  g.fillStyle=col||'#fff';
  g.fillText(txt,x,y);
  g.restore();
}
function redondo(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();
}
/* un botón de arcade: bisel, brillo que pasa, se hunde al tocarlo y entra con rebote */
function botonCaja(g,id,x,y,w,h,txt,col,col2,tam,retraso,sub){

  g.fillStyle=lin(g,0,0,0,h,[[0,col],[0.55,col],[1,col2]]);redondo(g,0,0,w,h,14);g.fill();
  g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=2;redondo(g,1.5,1.5,w-3,h-3,12);g.stroke();
  g.fillStyle='rgba(255,255,255,0.24)';redondo(g,5,4,w-10,h*0.38,9);g.fill();
  /* el brillo que cruza cada tanto: dice "tocame" */

    var bx=-40+bt*(w+80);

    g.transform(1,0,-0.35,1,0,0);g.fillRect(bx-30,0,60,h);g.restore();
  }
  if(sub){texto(g,txt,w/2,h/2-8,tam||20,'#10131f',null,false);texto(g,sub,w/2,h/2+15,12,'rgba(16,19,31,0.75)',null,false);}
  else texto(g,txt,w/2,h/2+1,tam||20,'#10131f',null,false);

}
function barra(g,x,y,w,h,f,col,col2,rastro){
  g.fillStyle='rgba(0,0,0,0.6)';redondo(g,x,y,w,h,h/2);g.fill();
  g.save();redondo(g,x,y,w,h,h/2);g.clip();
  if(rastro!==undefined&&rastro>f){g.fillStyle='rgba(255,255,255,0.8)';g.fillRect(x,y,w*lim(rastro,0,1),h);}
  if(f>0){
    g.fillStyle=lin(g,x,y,x,y+h,[[0,col],[1,col2||col]]);
    g.fillRect(x,y,w*lim(f,0,1),h);
    g.fillStyle='rgba(255,255,255,0.28)';g.fillRect(x,y,w*lim(f,0,1),h*0.42);
  }
  g.restore();
  g.strokeStyle='rgba(255,255,255,0.35)';g.lineWidth=1;redondo(g,x,y,w,h,h/2);g.stroke();
}
function galones(g,x,y,n,max,col){
  for(var i=0;i<max;i++){
    var px=x+i*10, py=y;
    g.fillStyle=i<n?col:'rgba(255,255,255,0.16)';
    g.beginPath();g.moveTo(px,py+6);g.lineTo(px+4,py);g.lineTo(px+8,py+6);
    g.lineTo(px+8,py+8);g.lineTo(px+4,py+2.5);g.lineTo(px,py+8);g.closePath();g.fill();
  }
}
/* íconos de trazo, del mismo grosor todos: la interfaz se lee como una familia */

      g.beginPath();g.moveTo(-4,-10);g.lineTo(-4,7);g.moveTo(4,-7);g.lineTo(4,10);g.stroke(); break;

      g.beginPath();g.arc(0,0,7,0,TAU);g.stroke();g.beginPath();g.arc(0,0,2.5,0,TAU);g.fill(); break;

    case 'izq': g.beginPath();g.moveTo(5,-9);g.lineTo(-5,0);g.lineTo(5,9);g.stroke(); break;
    case 'der': g.beginPath();g.moveTo(-5,-9);g.lineTo(5,0);g.lineTo(-5,9);g.stroke(); break;
    case 'casa': g.beginPath();g.moveTo(-9,0);g.lineTo(0,-8);g.lineTo(9,0);g.moveTo(-6,-2);g.lineTo(-6,8);g.lineTo(6,8);g.lineTo(6,-2);g.stroke(); break;
    case 'play': g.beginPath();g.moveTo(-5,-8);g.lineTo(8,0);g.lineTo(-5,8);g.closePath();g.fill(); break;
    case 'pausa': g.fillRect(-7,-8,4.5,16);g.fillRect(2.5,-8,4.5,16); break;

    case 'corazon': g.beginPath();g.moveTo(0,9);g.bezierCurveTo(-13,0,-7,-11,0,-4);g.bezierCurveTo(7,-11,13,0,0,9);g.fill(); break;

    case 'bomba': g.beginPath();g.arc(-1,3,7,0,TAU);g.fill();g.beginPath();g.moveTo(3,-3);g.quadraticCurveTo(6,-9,10,-8);g.stroke(); break;
    case 'iman': g.beginPath();g.arc(0,-1,7,Math.PI,0);g.moveTo(-7,-1);g.lineTo(-7,8);g.moveTo(7,-1);g.lineTo(7,8);g.stroke();
      g.fillRect(-9.5,5,5,4);g.fillRect(4.5,5,5,4); break;
    case 'musica': g.beginPath();g.moveTo(-3,6);g.lineTo(-3,-8);g.lineTo(8,-10);g.lineTo(8,4);g.stroke();
      g.beginPath();g.arc(-6,6,3.2,0,TAU);g.arc(5,4,3.2,0,TAU);g.fill(); break;

      g.beginPath();g.arc(3,0,7,-0.8,0.8);g.stroke(); break;

  }

/* ---------------- el título: las letras caen, ondulan y les pasa una luz ---------------- */
function tituloJuego(g,cx,cy,t,esc){
  var txt='CHICHARRA';esc=esc||1;
  g.save();
  g.font='bold '+(46*esc)+'px "Trebuchet MS",Verdana,sans-serif';
  g.textAlign='center';g.textBaseline='middle';
  var anchoT=g.measureText(txt).width, x=cx-anchoT/2, pos=[];
  for(var i=0;i<txt.length;i++){
    var ch=txt[i], w=g.measureText(ch).width;
    var e=lim((J.tMenu-0.05-i*0.055)/0.5,0,1);
    if(e<=0){x+=w;continue;}
    /* caída con rebote */
    var rb=e<0.7?Math.pow(e/0.7,2):1-Math.sin((e-0.7)/0.3*Math.PI)*0.12*(1-e);
    var y=cy-(1-rb)*90+Math.sin(t*2.4+i*0.55)*3.5*esc;
    var d=g.createLinearGradient(0,y-24*esc,0,y+24*esc);
    d.addColorStop(0,'#fff6c9');d.addColorStop(0.45,'#ffc93c');d.addColorStop(0.55,'#ff8a2b');d.addColorStop(1,'#c23b0c');
    g.globalAlpha=Math.min(1,e*2);
    g.lineWidth=6*esc;g.lineJoin='round';g.strokeStyle='rgba(40,12,0,0.9)';g.strokeText(ch,x+w/2,y);
    g.shadowColor='rgba(255,140,40,0.7)';g.shadowBlur=16*esc;
    g.fillStyle=d;g.fillText(ch,x+w/2,y);g.shadowBlur=0;
    pos.push([ch,x+w/2,y]);
    x+=w;
  }
  g.globalAlpha=1;
  var bt=(t*0.5)%3;
  if(bt<1&&J.tMenu>1){
    var bx=cx-anchoT/2-30+bt*(anchoT+60);
    g.beginPath();g.moveTo(bx-10,cy-34*esc);g.lineTo(bx+22,cy-34*esc);g.lineTo(bx+2,cy+34*esc);g.lineTo(bx-30,cy+34*esc);g.closePath();
    g.clip();
    g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,255,255,0.55)';
    for(var q=0;q<pos.length;q++)g.fillText(pos[q][0],pos[q][1],pos[q][2]);
  }
  g.restore();
  var es=lim((J.tMenu-0.6)/0.4,0,1);
  if(es>0){g.save();g.globalAlpha=es;texto(g,'ENJAMBRE ORBITAL',cx,cy+36*esc,13*esc,'#9fd8ff');g.restore();}
}

function pasarHangar(){
  var s=Entrada.suelta;
  /* deslizar sobre la vitrina cambia de nave */
  if(s&&Math.abs(s.dx)>50&&Math.abs(s.dx)>Math.abs(s.dy)*1.3){
    var r=UI.bajo(s.x0,s.y0);
    if(r&&(r.id==='vitrina'||r.id.indexOf('nave-')===0))cambiarNave(s.dx<0?1:-1);
  }
}

function pasarNiveles(dt){
  if(Entrada.tocando){J.velNiv=Entrada.acy/Math.max(dt,1e-3);J.scrollNiv+=Entrada.acy;}
  else{J.scrollNiv+=J.velNiv*dt;J.velNiv*=Math.pow(0.04,dt);}

function tocarAjuste(id){
  var A=Prog.aj;
  if(id==='mus-')A.musica=lim(Math.round((A.musica-0.1)*10)/10,0,1);
  else if(id==='mus+')A.musica=lim(Math.round((A.musica+0.1)*10)/10,0,1);
  else if(id==='efe-')A.efectos=lim(Math.round((A.efectos-0.1)*10)/10,0,1);
  else if(id==='efe+')A.efectos=lim(Math.round((A.efectos+0.1)*10)/10,0,1);
  else if(id==='sen-')A.sens=lim(Math.round((A.sens-0.1)*10)/10,0.5,1.8);
  else if(id==='sen+')A.sens=lim(Math.round((A.sens+0.1)*10)/10,0.5,1.8);
  else if(id==='control')A.control=A.control==='dedo'?'relativo':'dedo';
  else if(id==='vibra'){A.vibra=!A.vibra;vibrar(40);}
  else if(id==='temblor')A.temblor=!A.temblor;
  else return false;
  Sonido.volM=A.musica;Sonido.volE=A.efectos;Sonido.aplicarVol();
  guardarProg();
  return true;
}

  botonCaja(g,'salir',bx,by+148,bw,52,'AL HANGAR','#ff9d7a','#b23a1a',19,0.15);
}

/* ---------------- fin de nivel ---------------- */
function pasarFin(dt){
  var R=J.resumen, k=lim((J.tMenu-0.4)/1.1,0,1);
  var mostrado=Math.floor(R.puntos*k);
  if(mostrado!==J.cuentaVis&&k<1&&J.cuadro%3===0)Sonido.fx('cuenta');
  J.cuentaVis=mostrado;
  if(R.gano&&!J.selloHecho&&J.tMenu>1.6){J.selloHecho=true;Sonido.fx('sello');FX.sacudir(6);vibrar(30);}
}
function dibujarFin(g,t){
  dibujarMundo(g,t);
  g.fillStyle='rgba(6,4,18,0.84)';g.fillRect(0,0,ANCHO,ALTO);
  var R=J.resumen, e=entra(0);
  g.save();g.globalAlpha=Math.min(1,e);g.translate(ANCHO/2,ALTO*0.16);g.scale(0.5+e*0.5,0.5+e*0.5);
  texto(g,R.gano?'¡NIVEL '+R.nivel+' LIMPIO!':'TE DERRIBARON',0,0,R.gano?30:28,R.gano?'#7cff9d':'#ff8d6a');
  g.restore();
  if(R.gano&&J.tMenu>1.6){
    /* el sello del rango: cae grande y se asienta */
    var ks=lim((J.tMenu-1.6)/0.25,0,1), es=3-2*ks;
    var col=R.rango==='S'?'#ffd24a':R.rango==='A'?'#7cff9d':R.rango==='B'?'#8fb8ff':'#c0c8d8';
    g.save();g.translate(ANCHO/2,ALTO*0.29);g.rotate(-0.12);g.scale(es,es);g.globalAlpha=ks;
    g.strokeStyle=col;g.lineWidth=5;g.beginPath();g.arc(0,0,46,0,TAU);g.stroke();
    g.shadowColor=col;g.shadowBlur=20+Math.sin(t*4)*8;
    texto(g,R.rango,0,2,64,col);
    g.restore();
  }
  var y=ALTO*0.42, filas=[['PUNTAJE',String(J.cuentaVis||0)],['BICHOS',String(R.matados)],['COMBO MÁXIMO','x'+R.combo],
    ['MONEDAS','+'+R.monedas+(R.extra?'  (+'+R.extra+' rango)':'')],['GOLPES RECIBIDOS',String(R.dano)]];
  for(var i=0;i<filas.length;i++){
    var ef=entra(0.3+i*0.08);
    if(ef<=0)continue;
    g.save();g.globalAlpha=Math.min(1,ef*1.4);g.translate((1-ef)*60,0);
    texto(g,filas[i][0],36,y,13,'#9fb8d8','left');
    texto(g,filas[i][1],ANCHO-36,y,16,'#eaf4ff','right');
    g.strokeStyle='rgba(255,255,255,0.1)';g.lineWidth=1;g.beginPath();g.moveTo(36,y+15);g.lineTo(ANCHO-36,y+15);g.stroke();
    g.restore();
    y+=32;
  }
  if(R.record&&J.tMenu>1.3){
    g.save();g.translate(ANCHO/2,y+10);var kr=1+Math.sin(t*6)*0.06;g.scale(kr,kr);
    texto(g,'¡NUEVO RÉCORD!',0,0,18,'#ffd24a');g.restore();
  }
  var bw=240,bx=ANCHO/2-bw/2,by=ALTO*0.72;
  if(R.gano)botonCaja(g,'siguiente',bx,by,bw,62,'NIVEL '+(R.nivel+1),'#8bf58b','#2c9a2c',24,0.7,ZONAS[zonaDe(R.nivel+1)]);
  else botonCaja(g,'reintentar',bx,by,bw,62,'REINTENTAR','#ffd24a','#c98a00',24,0.7);
  botonCaja(g,'tienda',bx,by+78,bw/2-6,48,'MEJORAS','#ffd24a','#c98a00',15,0.78);
  botonCaja(g,'portada',bx+bw/2+6,by+78,bw/2-6,48,'HANGAR','#b9c4da','#68728c',15,0.84);
}

/* ---------------- el piloto automático: lo usan las pruebas ---------------- */
function botDemo(dt,invencible){
  var p=M.p, m=M;
  if(!p.vivo)return;
  if(invencible)p.inv=99;
  var obj=null, mejor=1e9;
  for(var i=0;i<m.bichos.length;i++){
    var b=m.bichos[i];
    if(b.y>ALTO*0.7)continue;
    var d=Math.abs(b.x-p.x)+b.y*0.35;
    if(d<mejor){mejor=d;obj=b;}
  }
  var dx=obj?obj.x-p.x:(m.jefe&&!m.jefe.entrando?m.jefe.x+geoJefe(m.jefe).nuc[0]-p.x:Math.sin(J.t*0.7)*120);
  var peligro=0;
  for(var k=0;k<m.balasE.length;k++){
    var be=m.balasE[k];
    if(be.vy<=0)continue;
    var tImp=(p.y-be.y)/be.vy;
    if(tImp<0||tImp>1.4)continue;
    var px=be.x+be.vx*tImp, err=Math.abs(px-p.x);
    if(err<52){var cerca=1-tImp/1.4;dx+=((p.x-px)||1)*(9*cerca);peligro+=cerca*(1-err/52);}
  }
  for(var j2=0;j2<m.bichos.length;j2++){
    var bi=m.bichos[j2];
    if(bi.y>p.y-150&&bi.y<p.y+50&&Math.abs(bi.x-p.x)<70){dx+=(p.x-bi.x||1)*5;peligro+=0.8;}
  }
  if(m.laser&&Math.abs(m.laser.x-p.x)<60)dx+=(p.x-m.laser.x||1)*8;
  p.x=lim(p.x+lim(dx,-1,1)*(peligro>0.4?560:420)*dt,24,ANCHO-24);
  var objY=peligro>0.4?ALTO-140:ALTO-190;
  p.y+=(objY-p.y)*2*dt;
  if(p.bombas>0&&m.balasE.length>60)usarBomba();
}

/* ---------------- hornear el arte de código: el respaldo si un asset no llega ---------------- */
function silueta(c,col){
  var s=document.createElement('canvas');s.width=c.width;s.height=c.height;
  s.mw=c.mw;s.mh=c.mh;
  var g=s.getContext('2d');
  g.drawImage(c,0,0);
  g.globalCompositeOperation='source-in';
  g.fillStyle=col;g.fillRect(0,0,s.width,s.height);
  return s;
}
function hornear(){
  SPR.nave={};SPR.naveHD={};SPR.naveSil={};SPR.jefeHD=[];
  for(var n=1;n<=5;n++)SPR.nave[n]=naveJugador(n);
  SPR.bicho={};SPR.siluetaBicho={};
  for(var t in TIPOS){SPR.bicho[t]=bicho(t);SPR.siluetaBicho[t]=silueta(SPR.bicho[t],'#ffffff');}
  SPR.jefe=[];SPR.jefeSilueta=[];
  for(var j=0;j<3;j++){SPR.jefe[j]=jefeSprite(j);SPR.jefeSilueta[j]=silueta(SPR.jefe[j],'#ffffff');}
  SPR.balaP=balaPropia(false);SPR.balaP2=balaPropia(true);
  SPR.balaB=balaPropia(false,'255,110,50');SPR.aguja=balaAguja();
  SPR.balaE={};
  ['255,90,60','255,70,70','120,230,255','200,120,255','255,120,200','255,80,60','255,90,230'].forEach(function(c){
    SPR.balaE[c]=balaEnemiga(c);
  });
  SPR.laser=laserSprite();SPR.destello=destelloSprite();
  SPR.capArma=capsula('P','120,220,255');
  SPR.capEscudo=capsula('S','140,255,200');
  SPR.capBomba=capsula('B','255,170,90');
  SPR.moneda=monedaSprite();
  SPR.ala=alaSprite();
}

/* ---------------- estados y toques ---------------- */
function irA(estado){
  if(estado!==J.estado)J.previo=J.estado;
  J.estado=estado;UI.limpiar();J.fundido=0.3;J.tMenu=0;J.selloHecho=false;J.cuentaVis=0;
  if(estado==='niveles'){J.velNiv=0;J.scrollNiv=Math.max(0,(Prog.mejorNivel-2)*118);}
  if(estado==='portada'||estado==='tienda'||estado==='niveles'||estado==='ajustes')Sonido.musica('menu');
}
function empezarNivel(n){
  nuevaPartida(n);
  irA('juego');
  Sonido.musica('juego');
}
function manejarToques(){
  /* los inmediatos: bomba y pausa en el juego */
  var id=UI.tocado();
  if(id){
    Sonido.iniciar();
    if(id==='bomba'&&J.estado==='juego')usarBomba();
    else if(id==='pausa'&&J.estado==='juego'){Sonido.fx('clic');irA('pausa');}
    return;
  }
  id=UI.soltado();
  if(!id)return;
  Sonido.iniciar();
  if(id==='vitrina')return;
  Sonido.fx('clic');
  if(id==='jugar')arrancarSalto(Math.max(1,Prog.mejorNivel));
  else if(id==='desbloquear'){
    var nav=naveVista();
    if(Prog.monedas>=nav.precio){
      Prog.monedas-=nav.precio;Prog.naves[nav.id]=true;Prog.nave=nav.id;guardarProg();
      Sonido.fx('compra');FX.onda(ANCHO/2,ALTO*0.4,160,nav.col,6);FX.polvo(ANCHO/2,ALTO*0.4,40,nav.col,260,0.8,true);
      vibrar(60);
    } else Sonido.fx('no');
  }
  else if(id==='nave-izq')cambiarNave(-1);
  else if(id==='nave-der')cambiarNave(1);
  else if(id==='tienda'||id==='niveles')irA(id);
  else if(id==='ajustes'){J.volverA=J.estado==='pausa'?'pausa':'portada';irA('ajustes');}
  else if(id==='volver'){irA(J.estado==='ajustes'&&J.volverA==='pausa'?'pausa':'portada');}
  else if(id==='portada')irA('portada');
  else if(id==='seguir')irA('juego');
  else if(id==='salir'){M=null;irA('portada');}
  else if(id==='siguiente')arrancarSalto(J.resumen.nivel+1);
  else if(id==='reintentar')arrancarSalto(J.resumen.nivel);
  else if(id.indexOf('nivel:')===0)arrancarSalto(+id.split(':')[1]);
  else if(id.indexOf('comprar:')===0){
    var mid=id.split(':')[1];
    for(var i=0;i<MEJORAS.length;i++){
      var m=MEJORAS[i];
      if(m.id!==mid)continue;
      var pr=precioMej(m);
      if(mejNivel(m.id)<m.max&&Prog.monedas>=pr){
        Prog.monedas-=pr;Prog.mej[m.id]=mejNivel(m.id)+1;guardarProg();
        Sonido.fx('compra');J.flashMej=m.id;J.tFlash=1;vibrar(30);
      } else Sonido.fx('no');
    }
  }
  else tocarAjuste(id);
}

/* ---------------- el bucle: 60 Hz fijos para la simulación ---------------- */
var CUADRO=1/60;
var Bucle={
  acum:0,ultimo:0,msDibujo:0,
  iniciar:function(){
    var self=this;
    requestAnimationFrame(function paso(ts){requestAnimationFrame(paso);self.cuadro(ts);});
  },
  cuadro:function(ts){
    var dtReal=Math.min(0.1,Math.max(0,(ts-(this.ultimo||ts))/1000));
    this.ultimo=ts;this.acum+=dtReal;
    var pasos=0;
    while(this.acum>=CUADRO&&pasos<4){this.acum-=CUADRO;pasos++;this.pasar(CUADRO);}
    var t0=performance.now();
    this.dibujar();
    this.msDibujo=this.msDibujo*0.9+(performance.now()-t0)*0.1;
  },
  /* adelantar sin dibujar: lo usan las pruebas */
  adelantar:function(n){for(var i=0;i<n;i++)this.pasar(CUADRO);},
  pasar:function(dt){
    J.t+=dt;J.cuadro++;J.tMenu+=dt;
    if(J.fundido>0)J.fundido=Math.max(0,J.fundido-dt);
    if(J.tFlash>0)J.tFlash=Math.max(0,J.tFlash-dt*2);
    Sonido.correr();
    /* congelado (golpe fuerte): la simulación se para, pero la entrada NO se consume */
    if(FX.congelado>0){FX.congelado--;return;}
    manejarToques();
    var E=J.estado;
    if(E==='juego'){
      if(J.bot)botDemo(dt,false);
      if(Entrada.recien('KeyB')||Entrada.recien('Space'))usarBomba();
      if(Entrada.recien('Escape')||Entrada.recien('KeyP'))irA('pausa');
      pasarJuego(dt);
    } else if(E==='salto'){
      pasarSalto(dt);
    } else if(E==='pausa'){
      if(Entrada.recien('Escape')||Entrada.recien('KeyP'))irA('juego');
    } else {
      if(E==='portada')pasarHangar();
      if(E==='niveles')pasarNiveles(dt);
      if(E==='fin')pasarFin(dt);
      if(E==='portada'&&(Entrada.recien('Enter')||Entrada.recien('Space')))arrancarSalto(Math.max(1,Prog.mejorNivel));
      if(E==='portada'&&Entrada.recien('ArrowLeft'))cambiarNave(-1);
      if(E==='portada'&&Entrada.recien('ArrowRight'))cambiarNave(1);
      Fondo.pasar(dt,0.35);
      pasarAmbiente(dt);
      FX.pasar(dt);
    }
    Entrada.fin();
  },
  dibujar:function(){
    Pantalla.revisar();
    var g=Pantalla.g, t=J.t;
    Fondo.armar(ANCHO,ALTO);
    /* qué botón está bajo el dedo: se lee de los botones del cuadro anterior */
    UI.apretado=null;
    if(Entrada.tocando){var r=UI.bajo(Entrada.x0,Entrada.y0);if(r&&UI.bajo(Entrada.x,Entrada.y)===r)UI.apretado=r.id;}
    UI.limpiar();
    g.save();
    if(FX.sac>0.2)g.translate((az()-0.5)*FX.sac,(az()-0.5)*FX.sac);
    g.fillStyle='#07041a';g.fillRect(-20,-20,ANCHO+40,ALTO+40);
    var E=J.estado;
    if(E==='portada'){dibujarHangar(g,t);FX.dibujar(g);}
    else if(E==='niveles')dibujarNiveles(g,t);
    else if(E==='ajustes')dibujarAjustes(g,t);
    else if(E==='tienda'){dibujarTienda(g,t);FX.dibujar(g);}
    else if(E==='pausa')dibujarPausa(g,t);
    else if(E==='fin')dibujarFin(g,t);
    else if(E==='salto')dibujarSalto(g,t);
    else{dibujarMundo(g,t);dibujarHUD(g,t);}
    if(J.fundido>0){
      g.fillStyle='rgba(5,3,16,'+(J.fundido/0.3*0.8).toFixed(3)+')';
      g.fillRect(-20,-20,ANCHO+40,ALTO+40);
    }
    g.restore();
  }
};

/* ---------------- arranque ---------------- */
function arrancar(){
  cargarProg();
  J.monVis=Prog.monedas;J.iNave=0;J.cambio=0;J.tCambio=1;J.tMenu=0;J.scrollNiv=0;J.velNiv=0;
  for(var i=0;i<NAVES.length;i++)if(NAVES[i].id===Prog.nave)J.iNave=i;
  Sonido.activo=Prog.sonido!==false;Sonido.volM=Prog.aj.musica;Sonido.volE=Prog.aj.efectos;
  var lienzoEl=document.getElementById('lienzo');
  Pantalla.iniciar(lienzoEl);
  Entrada.iniciar(lienzoEl);
  /* un dedo que cae sobre la bomba o la pausa no maneja la nave */
  Entrada.filtro=function(x,y){return J.estado==='juego'&&!!UI.bajo(x,y,true);};
  hornear();
  cargarAssets();
  Fondo.armar(ANCHO,ALTO);
  Pantalla.alCambiar=function(){Fondo.nebu=null;Fondo.armar(ANCHO,ALTO);};
  var prender=function(){Sonido.iniciar();};
  addEventListener('touchstart',prender,{once:true});
  addEventListener('mousedown',prender,{once:true});
  addEventListener('keydown',prender,{once:true});
  /* si se va de la app en medio de la partida, queda en pausa y el audio se calla */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      if(J.estado==='juego')irA('pausa');
      if(Sonido.ac&&Sonido.ac.suspend)Sonido.ac.suspend();
    } else if(Sonido.ac&&Sonido.ac.resume)Sonido.ac.resume();
  });
  irA('portada');
  Bucle.iniciar();
  var c=document.getElementById('cargando');
  if(c)c.style.display='none';
  /* sondas para el banco de pruebas: nada de esto lo usa el juego */
  window.__C={
    listo:true, J:J, Prog:Prog, UI:UI, SPR:SPR, NAVES:NAVES,
    estado:function(){return J.estado;},
    ir:function(e){irA(e);},
    nivel:function(n){empezarNivel(n||1);},
    anda:function(n){Bucle.adelantar(n||1);},
    dibujarYa:function(){Bucle.dibujar();},
    bot:function(v){J.bot=v!==false;},
    nave:function(id){Prog.nave=id;Prog.naves[id]=true;for(var i=0;i<NAVES.length;i++)if(NAVES[i].id===id)J.iNave=i;},
    assets:function(){return{listos:ASSETS.listos,total:ASSETS.total,nombres:ASSETS.nombres.slice().sort(),
      pistas:Object.keys(Sonido.pistas)};},
    mundo:function(){
      if(!M)return null;
      return{x:M.p.x,y:M.p.y,vidas:M.p.vidas,arma:M.p.arma,bombas:M.p.bombas,nave:M.p.nav.id,
        bichos:M.bichos.length,balas:M.balas.length,balasE:M.balasE.length,
        items:M.items.length,jefe:M.jefe?{vida:M.jefe.vida,fase:M.jefe.fase,cual:M.jefe.cual,
        canones:M.jefe.canones.map(function(c){return c.vivo;})}:null,
        reloj:M.reloj,puntos:M.puntos,monedas:M.monedas,matados:M.matados};
    },
    medidas:function(){return{msDibujo:Bucle.msDibujo,W:Pantalla.W,H:Pantalla.H,
      S:Pantalla.S,part:FX.part.length,cuadro:J.cuadro};},
    poner:function(x,y){if(M){M.p.x=x;M.p.y=y;}},
    invencible:function(v){if(M)M.p.inv=v?9e9:0;},
    /* tocar un botón como lo tocaría un dedo: apoyar y levantar sobre él */
    tocar:function(id){
      var d=UI.donde(id);if(!d)return false;
      if(d.inm)Entrada.toques.push({x:d.x,y:d.y,id:'p'});
      else Entrada.suelta={dx:0,dy:0,x0:d.x,y0:d.y,x:d.x,y:d.y};
      manejarToques();Entrada.fin();return true;
    },
    deslizar:function(x0,y0,dx,dy){Entrada.suelta={dx:dx,dy:dy||0,x0:x0,y0:y0,x:x0+dx,y:y0+(dy||0)};Bucle.pasar(CUADRO);},
    botones:function(){return UI.rects.map(function(r){return r.id;});},
    donde:function(id){
      var d=UI.donde(id);if(!d)return null;
      var r=Pantalla.lienzo.getBoundingClientRect();
      return{x:r.left+d.x*Pantalla.S,y:r.top+d.y*Pantalla.S};
    },
    jefeYa:function(){if(M){M.reloj=0.01;M.bichos.length=0;M.intro=0;}},
    matarJefe:function(){if(M&&M.jefe)danarJefeCentro(M.jefe.vida);},
    monedas:function(n){Prog.monedas=n;J.monVis=n;guardarProg();},
    borrar:function(){try{localStorage.removeItem('chicharra.v1');}catch(e){}}
  };
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arrancar);
else arrancar();
