  html,body{height:100%;overflow:hidden;background:#07060c;touch-action:none;-webkit-user-select:none;user-select:none;
    overscroll-behavior:none;font-family:ui-monospace,Menlo,Consolas,monospace;color:#efe6d2}
  /* todo vive en el escenario: con el celular parado se gira 90° y se juega acostado */
  #stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;overflow:hidden;background:#07060c}
  /* el juego se dibuja chico y se agranda por un número ENTERO de píxeles reales */
  #gl,#hud{position:absolute;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{pointer-events:none}
  canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  /* menús: DOM encima, con la estética del juego */
  #menu{position:absolute;inset:0;display:none;pointer-events:none}
  #menu.ver{display:block}
  #menu > *{pointer-events:auto}
  .capa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px 18px}
  .der{align-items:flex-end;padding-right:6%}
  .boton{border:0;background:rgba(20,10,24,.72);color:#fff;font:inherit;padding:9px 18px;min-width:210px;cursor:pointer;
    box-shadow:inset 0 0 0 2px #f2c14e,0 0 0 2px #0a0610,0 5px 0 2px #0a0610;display:flex;justify-content:center;align-items:center}
  .boton.sec{box-shadow:inset 0 0 0 2px #8a7e9e,0 0 0 2px #0a0610,0 5px 0 2px #0a0610}
  .boton.chico{min-width:0;padding:7px 12px}
  .boton:active{transform:translateY(3px)}
  .boton.foco{background:rgba(242,193,78,.25)}
  .panel{background:rgba(12,8,18,.86);box-shadow:inset 0 0 0 2px #3c2e52,0 0 0 2px #05030a;padding:12px;max-width:560px;width:100%}
  .fila{display:flex;align-items:center;gap:10px;padding:7px 9px;margin:5px 0;background:rgba(40,28,58,.7);cursor:pointer;
    box-shadow:inset 0 0 0 1px #4c3c66}
  .fila .info{flex:1;font-size:11px;line-height:1.4}
  .fila .info b{color:#f2c14e}
  .fila .val{font-weight:800;color:#f2c14e;font-size:12px;white-space:nowrap}
  .fila.no{opacity:.4}
  .texto{font-size:12px;line-height:1.5;max-width:560px}
  .texto b{color:#f2c14e}
  .fila2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .scroll{overflow-y:auto;max-height:100%}
  /* pantalla de carga */
  #carga{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07060c;z-index:9;
    font-size:13px;letter-spacing:3px;color:#8a7e9e}
</style>

/* ================================================================ utilidades */
const lim = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a)*t;
const sig = v => v < 0 ? -1 : 1;
const suave = t => t*t*(3 - 2*t);
const rv = (a, b) => a + Math.random()*(b - a);
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
let rnd = mulberry(20260923);                                  /* el azar del mundo (con semilla para el banco) */
const R = (a, b) => a + rnd()*(b - a), RI = (a, b) => Math.floor(R(a, b + 1)), elegir = l => l[Math.floor(rnd()*l.length)];
function leer(k, def){ try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); } catch(e){ return def; } }

/* ================================================================ idiomas
   tr(frase, …): la frase en castellano es la clave, {0} {1} para números y nombres. Lo exacto se
   traduce solo en lienzoTexto y el(); lo compuesto va con plantilla. FRASES está en idiomas.js. */
let IDIOMA = AJ.idioma, DIC = null;
const TR_FALTA = new Set(), _SAL = new Set(), _TRAD = new Set();
function dic(){ if(DIC) return DIC; DIC = {en:{}, pt:{}};
  for(const [es, en, pt] of FRASES){ DIC.en[es] = en; DIC.pt[es] = pt; _TRAD.add(en); _TRAD.add(pt);
    for(const q of [en, pt]) for(const w of q.toUpperCase().split(/[^A-ZÀ-Ü]+/)) if(w.length > 2) _PAL.add(w); } return DIC; }
/* un texto ya traducido que se escribe de a poco o partido en renglones no es una frase que falte */
const _PAL = new Set();
function yaTraducido(s){ const ws = s.toUpperCase().split(/[^A-ZÀ-Ü]+/).filter(w => w.length > 2); if(!ws.length) return true;
  return ws.every((w, i) => _PAL.has(w) || (i === ws.length - 1 && [..._PAL].some(p => p.startsWith(w)))); }
function tr(s, ...a){
  let t = s;
  if(IDIOMA !== 'es'){ const d = dic()[IDIOMA]; if(d[s] !== undefined) t = d[s]; else if(!_TRAD.has(s)) TR_FALTA.add(s); }
  const r = a.length ? String(t).replace(/\{(\d)\}/g, (m, i) => a[i]) : t;
  if(IDIOMA !== 'es'){ if(_SAL.size > 800) _SAL.clear(); _SAL.add(r); }
  return r;
}
function trAuto(s){
  if(IDIOMA === 'es' || typeof s !== 'string') return s;
  const d = dic()[IDIOMA]; if(d[s] !== undefined) return d[s];
  if(!_TRAD.has(s) && !_SAL.has(s) && !/[<\d]/.test(s) && /[a-záéíóúñ]{3,}/i.test(s) && !yaTraducido(s)) TR_FALTA.add(s);
  return s;
}
function ponerIdioma(l){ AJ.idioma = IDIOMA = l; guardar('mate.ajustes', AJ); document.documentElement.lang = l; CACHE_TXT.clear(); }

const CACHE_TXT = new Map(), _AUD = new Set();      /* _AUD: los textos pixelados que se dibujaron (para la sonda de idiomas) */
/* 1 px de lienzo = 1 px de fuente: sombra abajo-derecha, contorno 3×3 y relleno con degradé por fila */
function lienzoTexto(str, grad, opc){
  str = String(trAuto(String(str))).toUpperCase(); grad = grad || 'blanco'; opc = opc || {};
  _AUD.add(str);
  const clave = str + '|' + grad + '|' + (opc.sinBorde ? 1 : 0);
  if(CACHE_TXT.has(clave)) return CACHE_TXT.get(clave);
  if(CACHE_TXT.size > 400) CACHE_TXT.clear();
  const chars = [...str], W = chars.length*6 + 3, H = 3 + 7 + 3;
  const mascara = new Uint8Array(W*H);
  chars.forEach((ch, i) => {
    let base = ch, marca = null, abajo = false;
    if(MARCA[ch]){ base = MARCA[ch][0]; marca = MARCAS[MARCA[ch][1]]; abajo = !!MARCA[ch][2]; }
    const g = FUENTE[base] || FUENTE['?'], x0 = 1 + i*6, y0 = 4;
    for(let y = 0; y < 7; y++) for(let x = 0; x < 5; x++) if(g[y*5 + x] === '#') mascara[(y0 + y)*W + x0 + x] = 1;
    if(marca) for(let y = 0; y < 2; y++) for(let x = 0; x < 5; x++) if(marca[y][x] === '#') mascara[((abajo ? y0 + 7 : y0 - 3) + y)*W + x0 + x] = 1;
  });
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), paleta = GRAD[grad] || GRAD.blanco;
  if(!opc.sinBorde){
    g.fillStyle = '#140c08';
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(mascara[y*W + x]){ g.fillRect(x - 1, y - 1, 3, 3); g.fillRect(x + 1, y + 1, 1, 1); g.fillRect(x, y + 2, 1, 1); g.fillRect(x + 1, y + 2, 1, 1); }
  }
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(mascara[y*W + x]){
    g.fillStyle = paleta[lim(y - 4, 0, 6)]; g.fillRect(x, y, 1, 1); }
  CACHE_TXT.set(clave, c);
  return c;
}
/* texto en el mundo o en el HUD, centrado o no */
function texto(ctx, str, x, y, grad, opc){
  const c = lienzoTexto(str, grad, opc), e = (opc && opc.esc) || 1;
  const ax = opc && opc.izq ? 0 : (opc && opc.der ? c.width*e : Math.floor(c.width*e/2));
  ctx.drawImage(c, Math.round(x - ax), Math.round(y), c.width*e, c.height*e);
  return c.width*e;
}
/* un texto en píxeles para los menús (DOM), a escala S */
function pixelTxt(str, grad, S){
  const c = lienzoTexto(str, grad), k = document.createElement('canvas');
  k.width = c.width; k.height = c.height; k.getContext('2d').drawImage(c, 0, 0);
  k.className = 'px'; k.style.width = c.width*(S || 3) + 'px'; k.style.height = c.height*(S || 3) + 'px';
  return k;
}


/* ================================================================ el escenario girado y la medida
   El juego se dibuja a ~216 filas y se agranda por un número ENTERO de píxeles reales (PX). */
const stage = document.getElementById('stage'), cvGL = document.getElementById('gl'), cvHUD = document.getElementById('hud');
const cxHUD = cvHUD.getContext('2d');
let GIRADO = false, PANT_W = 412, SW = 892, SH = 412, DPR = 1, PX = 5, W = 468, H = 216;
function girar(){
  const vv = window.visualViewport, w = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
  GIRADO = h > w*1.15 && (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window); PANT_W = w; girar.ult = w + 'x' + h;
  SW = GIRADO ? h : w; SH = GIRADO ? w : h;
  stage.style.width = SW + 'px'; stage.style.height = SH + 'px';
  stage.style.transform = GIRADO ? 'translate(' + w + 'px,0) rotate(90deg)' : 'none';
}
/* un toque de la pantalla → coordenadas del escenario: girado 90° a la derecha, (x, y) → (y, W − x) */
const aStage = (x, y) => GIRADO ? [y, PANT_W - x] : [x, y];
/* del escenario (px CSS) al lienzo chico */
const aLienzo = (x, y) => [x*DPR/PX, y*DPR/PX];
const alMedir = [];
function medir(){
  girar();
  DPR = Math.min(devicePixelRatio || 1, 4);
  const dw = Math.round(SW*DPR), dh = Math.round(SH*DPR);
  PX = Math.max(1, Math.floor(dh/200));
  W = Math.ceil(dw/PX); H = Math.ceil(dh/PX);
  const cw = W*PX/DPR + 'px', ch = H*PX/DPR + 'px';
  for(const c of [cvGL, cvHUD]){ c.style.width = cw; c.style.height = ch; }
  if(cvHUD.width !== W || cvHUD.height !== H){ cvHUD.width = W; cvHUD.height = H; }
  cxHUD.imageSmoothingEnabled = false;
  for(const f of alMedir) f();
}
new ResizeObserver(() => medir()).observe(stage);
for(const ev of ['resize', 'orientationchange']) addEventListener(ev, () => medir());
if(window.visualViewport) visualViewport.addEventListener('resize', () => medir());

function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = trAuto(html); return e; }
/* ================================================================ sonido
   Todo sale de Web Audio, sin archivos: electro-tango noir. Tres buses (música, efectos, ambiente)
   → pasaaltos → compresor → recorte suave (nunca pasa de 0,95) → parlante. La música es un
   secuenciador de semicorcheas que programa con anticipación contra currentTime; cada tema tiene
   su tonalidad, su tempo, frases de 8 a 16 compases y capas que entran con la intensidad.
   Ninguna llamada de acá puede tirarle una excepción al juego: todo va envuelto. */
const SON = (() => {
  let C = null, N = null, RU = null, ONDA = null, listo = false;
  let temaPed = null, temaAct, ambPed = null, ambAct;              /* lo pedido antes de haber contexto */
  let kLento = 0, kLentoObj = 0, kAplic = -1, tLento = 0, inten = 0, intenObj = 0, tPaso = 0, tPasoAnt = 0, ultBlip = 0;
  const ERR = [], FALTAN = new Set();
  const err = e => { if(ERR.length < 30) ERR.push(String(e && e.stack || e)); };
  const mtof = m => 440*Math.pow(2, (m - 69)/12);
  const ya = () => C.currentTime;

  /* ------------------------------------------------------------ armado del máster */
  function ruidos(){
    const n = Math.floor(C.sampleRate*3), mk = () => C.createBuffer(1, n, C.sampleRate);
    const bl = mk(), ro = mk(), pa = mk(), a = bl.getChannelData(0), b = ro.getChannelData(0), c = pa.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, u = 0;
    for(let i = 0; i < n; i++){
      const w = Math.random()*2 - 1; a[i] = w*0.7;
      b0 = 0.99886*b0 + w*0.0555179; b1 = 0.99332*b1 + w*0.0750759; b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856; b4 = 0.55000*b4 + w*0.5329522; b5 = -0.7616*b5 - w*0.0168980;
      b[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w*0.5362)*0.1; b6 = w*0.115926;
      u = (u + 0.02*w)/1.02; c[i] = u*3.2;
    }
    /* que las puntas del bucle se toquen: 20 ms de fundido contra el principio */
    const fz = Math.floor(C.sampleRate*0.02);
    for(const d of [a, b, c]) for(let i = 0; i < fz; i++){ const k = i/fz; d[n - fz + i] = d[n - fz + i]*(1 - k) + d[i]*k; }
    RU = {blanco:bl, rosa:ro, pardo:pa};
  }
  /* respuesta de impulso por código: ruido que se apaga y se oscurece, con reflexiones tempranas */
  function ir(dur, caida, brillo, pre){
    const sr = C.sampleRate, n = Math.floor(sr*dur), b = C.createBuffer(2, n, sr), p0 = Math.floor(sr*(pre || 0.012));
    for(let ch = 0; ch < 2; ch++){
      const d = b.getChannelData(ch); let lp = 0;
      for(let i = p0; i < n; i++){
        const x = (i - p0)/(n - p0), en = Math.pow(1 - x, caida)*Math.exp(-x*2.2);
        lp += lerp(brillo, 0.03, Math.sqrt(x))*((Math.random()*2 - 1) - lp);
        d[i] = lp*en*Math.min(1, (i - p0)/(sr*0.006));
      }
      for(let k = 0; k < 9; k++){ const i = Math.floor(sr*(0.006 + Math.random()*0.07)); if(i < n) d[i] += (Math.random() < 0.5 ? -1 : 1)*0.35*(1 - k/10); }
    }
    return b;
  }
  /* lineal hasta 0,6 y después se dobla suave hasta 0,95: por acá no pasa un clip */
  function curvaRecorte(){
    const n = 4096, c = new Float32Array(n);
    for(let i = 0; i < n; i++){ const x = (i/(n - 1)*2 - 1)*2, a = Math.abs(x);
      c[i] = Math.sign(x)*(a < 0.6 ? a : 0.6 + 0.35*Math.tanh((a - 0.6)/0.35)); }
    return c;
  }
  function ondas(){
    const H = 48, re = new Float32Array(H), im = new Float32Array(H), r2 = new Float32Array(H), i2 = new Float32Array(H);
    for(let k = 1; k < H; k++) re[k] = 2/(k*Math.PI)*Math.sin(k*Math.PI*0.28);            /* pulso al 28% */
    /* lengüeta de bandoneón: impares fuertes, pares que asoman y un hueco que la hace nasal */
    const L = [0, 1, 0.55, 0.78, 0.3, 0.52, 0.34, 0.2, 0.26, 0.12, 0.16, 0.1, 0.13, 0.06, 0.09, 0.05, 0.06];
    for(let k = 1; k < H; k++) i2[k] = (L[k] !== undefined ? L[k] : 0.5/k)*(k % 7 === 0 ? 0.3 : 1);
    ONDA = {pulso:C.createPeriodicWave(re, im), cana:C.createPeriodicWave(r2, i2)};
  }
  const G = (v, dest) => { const g = C.createGain(); g.gain.value = v === undefined ? 1 : v; if(dest) g.connect(dest); return g; };
  const F = (tipo, f, q, dest) => { const x = C.createBiquadFilter(); x.type = tipo; x.frequency.value = f; if(q !== undefined) x.Q.value = q; if(dest) x.connect(dest); return x; };
  function armar(){
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return false;
    try { C = new AC({latencyHint:'interactive'}); } catch(e){ C = new AC(); }
    ruidos(); ondas();
    N = {};
    N.sal = G(1, C.destination);
    N.rec = C.createWaveShaper(); N.rec.curve = curvaRecorte(); N.rec.oversample = 'none'; N.rec.connect(N.sal);
    N.pre = G(0.5, N.rec);
    N.comp = C.createDynamicsCompressor();
    N.comp.threshold.value = -15; N.comp.knee.value = 10; N.comp.ratio.value = 4; N.comp.attack.value = 0.003; N.comp.release.value = 0.22;
    N.comp.connect(N.pre);

    N.mezcla = G(0.95, N.hp);

    N.musV = G(0.7, N.mezcla); N.musF = F('lowpass', 18000, 0.5, N.musV);

    N.eco = G(1); N.ecoD = C.createDelay(2); N.ecoD.delayTime.value = 0.38;

    N.eco.connect(N.ecoD); N.ecoD.connect(N.ecoLp); N.ecoLp.connect(N.ecoFb); N.ecoFb.connect(N.ecoD); N.ecoLp.connect(N.ecoW);
    /* efectos, con su reverberación de cola */
    N.fxV = G(1, N.mezcla); N.fx = G(1, N.fxV);
    N.revF = C.createConvolver(); N.revF.buffer = ir(2.1, 2.2, 0.7, 0.008); N.revF.connect(N.fxV);
    N.revFin = G(1, N.revF);
    /* ambiente */
    N.ambV = G(0.8, N.mezcla); N.ambF = F('lowpass', 18000, 0.5, N.ambV); N.amb = G(1, N.ambF);
    /* iOS: un buffer mudo destraba la salida */
    try { const s = C.createBufferSource(); s.buffer = C.createBuffer(1, 64, C.sampleRate); s.connect(C.destination); s.start(0); } catch(e){}
    listo = true;
    volumen();
    setInterval(() => { if(listo && performance.now() - tPaso > 140) paso(0.05); }, 50);   /* por si el juego deja de llamar paso() */
    document.addEventListener('visibilitychange', () => { try {
      if(document.hidden){ if(C.state === 'running') C.suspend(); } else if(C.state !== 'closed') C.resume().catch(() => {}); } catch(e){} });
    return true;
  }

  /* ------------------------------------------------------------ piezas de síntesis */
  /* osciladores de la música y del ambiente: quedan anotados para que el lento los baje de tono */
  const OSC_M = [];
  let repAct = null;                                  /* el tema que está programando: sus osciladores se cortan al soltarlo */
  const detL = () => -kLento*190;
  function oscM(tipo, f, t, fin, det){
    const o = C.createOscillator();
    if(ONDA[tipo]) o.setPeriodicWave(ONDA[tipo]); else o.type = tipo;
    o.frequency.setValueAtTime(f, t); o.detune.value = (det || 0) + detL();
    const rg = {o, d0:det || 0, fin}; OSC_M.push(rg); if(repAct) repAct.oscs.push(rg); o.start(t); o.stop(fin); return o;
  }
  function oscF(tipo, f, t, fin){ const o = C.createOscillator(); if(ONDA[tipo]) o.setPeriodicWave(ONDA[tipo]); else o.type = tipo;
    o.frequency.setValueAtTime(f, t); o.start(t); o.stop(fin); return o; }
  function fuente(col, t, fin, rate){ const s = C.createBufferSource(); s.buffer = RU[col || 'blanco']; s.loop = true;
    if(rate) s.playbackRate.value = rate; s.start(t, Math.random()*2.6); s.stop(fin); return s; }
  /* envolvente: ataque lineal y caída exponencial que llega a ~0 en d */
  function env(p, t, a, v, d){ p.setValueAtTime(0, t); p.linearRampToValueAtTime(v, t + a); p.setTargetAtTime(0, t + a, d/5); return t + a + d*1.45; }

    const todas = VIVAS.filter(v => !v.robada); if(todas.length >= 30) apagar(todas[0], now);

      v.fin = t + dur + (meta.rev ? 2.2 : 0.3);
    } catch(e){ err(e); }
  }

  /* ------------------------------------------------------------ ambiente */
  let AMB = null;
  const VIEJOS = [];
  function ambiente(lugar){
    ambPed = lugar || null; if(!listo) return;
    try {
      if((lugar || null) === ambAct) return; ambAct = lugar || null;
      const now = ya();
      if(AMB){ const A = AMB, p = A.g.gain; p.cancelScheduledValues(now); p.setValueAtTime(Math.max(p.value, 0.0001), now); p.linearRampToValueAtTime(0, now + 2);
        A.fin = now + 2.2; for(const r of A.reg) r.fin = now + 2.2; VIEJOS.push(A); AMB = null; }
      if(lugar && ARMA[lugar]){ AMB = {lugar, g:G(0, N.amb), nodos:[], loops:[], reg:[], ev:[], fin:Infinity};
        AMB.g.gain.setValueAtTime(0.0001, now); AMB.g.gain.linearRampToValueAtTime(1, now + 2.5); ARMA[lugar](AMB); }
    } catch(e){ err(e); }
  }
  /* un bucle de ruido filtrado que no para; queda anotado para el lento y para apagarlo */
  function bucle(A, col, tipo, f, q, v, x, rate){
    const s = C.createBufferSource(); s.buffer = RU[col]; s.loop = true; s.playbackRate.value = (rate || 1)*lerp(1, 0.58, kLento); s.start(ya(), Math.random()*2.5);
    const fl = F(tipo, f, q), g = G(v); s.connect(fl); fl.connect(g); g.connect(panear(A.g, x || 0));
    A.nodos.push(s); A.loops.push({s, r:rate || 1}); return {s, fl, g};
  }
  function tonoFijo(A, tipo, f, v, dest){ const o = C.createOscillator(); o.type = tipo; o.frequency.value = f; const r = {o, d0:0, fin:Infinity};
    o.detune.value = detL(); OSC_M.push(r); A.reg.push(r); o.connect(G(v, dest || A.g)); o.start(); A.nodos.push(o); return o; }
  function lfo(A, f, prof, param, tipo){ const o = C.createOscillator(); o.type = tipo || 'sine'; o.frequency.value = f; o.connect(G(prof, param)); o.start(); A.nodos.push(o); return o; }
  const suceso = (A, a, b, fn, primero) => A.ev.push({a, b, fn, prox:ya() + (primero !== undefined ? primero : rv(a, b))});
  const ARMA = {
    puerto(A){
      bucle(A, 'blanco', 'highpass', 1400, 0.5, 0.05, -0.6); bucle(A, 'blanco', 'highpass', 1600, 0.5, 0.05, 0.6, 0.93);   /* lluvia cerca */
      bucle(A, 'rosa', 'bandpass', 900, 0.5, 0.13, 0);                                                                   /* cuerpo de la lluvia */
      bucle(A, 'pardo', 'lowpass', 380, 0.7, 0.2, 0);                                                                    /* lluvia lejos */
      const ola = bucle(A, 'pardo', 'lowpass', 300, 0.8, 0.14, -0.2); lfo(A, 0.11, 0.1, ola.g.gain); lfo(A, 0.047, 0.06, ola.g.gain);   /* oleaje */
      const lam = bucle(A, 'rosa', 'bandpass', 520, 1.2, 0.035, 0.3); lfo(A, 0.23, 0.03, lam.g.gain, 'triangle'); lfo(A, 0.09, 180, lam.fl.frequency);
      suceso(A, 0.07, 0.45, t => TN({t, f:rv(1700, 4200), f2:rv(900, 1600), fd:0.04, d:rv(0.03, 0.07), v:rv(0.012, 0.035), dest:panear(A.g, rv(-0.9, 0.9))}));   /* gotas */
      suceso(A, 3, 7, t => RZ({t, a:0.03, d:rv(0.3, 0.6), v:0.12, f:rv(380, 620), f2:260, q:1.4, col:'rosa', dest:panear(A.g, rv(-0.5, 0.5))}));             /* chapoteo contra el muelle */
      suceso(A, 25, 50, t => { const p = panear(A.g, rv(-0.7, 0.7)), g = G(0, p), lp = F('lowpass', 420, 1, g); p.connect(G(0.6, N.revFin));              /* bocina de barco lejos */
        for(const [f, dt] of [[55, 0], [55.4, 6], [110.2, 0], [82.6, -4]]){ const o = oscF('sawtooth', f, t, t + 4.4); o.detune.value = dt + detL(); o.connect(lp); }
        adsr(g.gain, t, 0.5, 1, 0.9, t + 2.6, 1.2, 0.07); }, rv(6, 10));
      suceso(A, 12, 30, t => { const p = panear(A.g, rv(-0.8, 0.8)), n = 2 + (Math.random()*3 | 0), raro = rv(0.75, 1.3);                               /* gaviotas, algo desafinadas */
        for(let i = 0; i < n; i++){ const tt = t + i*rv(0.22, 0.4), g = G(0, p), s = oscF('sawtooth', 1300*raro, tt, tt + 0.5), bp = F('bandpass', 2200*raro, 3, g);
          s.frequency.linearRampToValueAtTime(1900*raro, tt + 0.06); s.frequency.exponentialRampToValueAtTime(1050*raro, tt + 0.3);

      suceso(A, 35, 80, t => FX.trueno(t, {tono:0.8, vol:0.4}, G(0.35, A.g)), rv(14, 24));
    },
    fabrica(A){

      const zum = bucle(A, 'rosa', 'bandpass', 700, 3, 0.05, -0.3); lfo(A, 0.4, 0.025, zum.g.gain);
      const rod = bucle(A, 'blanco', 'bandpass', 2400, 9, 0.012, 0.4); lfo(A, 0.13, 300, rod.fl.frequency);
      bucle(A, 'pardo', 'lowpass', 150, 0.7, 0.2, 0);
      A.prensa = 0;
      suceso(A, 1.75, 1.75, t => { if(A.prensa++ % 6 >= 4) return;                                          /* la prensa lejos, en tandas de cuatro */
        const p = panear(A.g, -0.45); p.connect(G(0.7, N.revFin));
        TN({t, f:62, f2:40, d:0.42, v:0.22, dest:p}); RZ({t, d:0.14, v:0.12, f:600, tipo:'lowpass', col:'rosa', dest:p}); metal(p, t + 0.02, 0.18, 330); }, 1);
      suceso(A, 5, 11, t => { const p = panear(A.g, rv(-0.8, 0.8)), d = rv(1, 2.4);                           /* vapor que silba */
        RZ({t, a:0.12, d, v:0.06, f:rv(3500, 5500), tipo:'highpass', q:0.6, dest:p}); if(Math.random() < 0.35) TN({t, a:0.1, f:rv(2600, 3200), d:d*0.8, v:0.01, dest:p}); });
      suceso(A, 9, 18, t => { const p = panear(A.g, rv(-0.7, 0.7)); for(let i = 0; i < 10; i++) metal(p, t + i*rv(0.05, 0.09), 0.05, rv(900, 1500)); });   /* cadena */
      suceso(A, 6, 14, t => { const p = panear(A.g, rv(-0.9, 0.9)); p.connect(G(0.8, N.revFin)); metal(p, t, 0.12, rv(200, 420)); });                    /* golpe metálico */
    },
    torre(A){
      const vi = bucle(A, 'rosa', 'bandpass', 520, 0.9, 0.3, 0); lfo(A, 0.05, 260, vi.fl.frequency); lfo(A, 0.13, 0.08, vi.g.gain); lfo(A, 0.031, 0.06, vi.g.gain);  /* viento con ráfagas */

      suceso(A, 1, 5, t => { const n = Math.random() < 0.3 ? 4 : 1; for(let i = 0; i < n; i++) RZ({t:t + i*0.04, d:0.012, v:0.05, f:rv(3000, 6000), q:2, dest:A.g}); });  /* el neón que chisporrotea */
      suceso(A, 6, 15, t => { const g = G(0, F('lowpass', 900, 1, panear(A.g, rv(-0.9, 0.9)))), f = rv(330, 440);          /* bocina de auto lejos */

        l.connect(G(160, o.frequency)); o.connect(g); adsr(g.gain, t, 1.5, 1, 1, t + 4.5, 1.5, 0.014); }, rv(10, 18));
      suceso(A, 40, 70, t => FX.helicoptero(t, {x:Math.random() < 0.5 ? -1 : 1}, G(0.3, A.g)), rv(15, 25));
    }
  };
  function pasoAmb(){

    if(AMB) for(const e of AMB.ev) if(now >= e.prox){ e.prox = now + rv(e.a, e.b); try { e.fn(now + 0.05); } catch(x){ err(x); } }
    for(let i = VIEJOS.length - 1; i >= 0; i--){ const A = VIEJOS[i];
      if(now > A.fin){ for(const n of A.nodos) try { n.stop(); n.disconnect(); } catch(e){} try { A.g.disconnect(); } catch(e){} VIEJOS.splice(i, 1); } }
  }

  /* ------------------------------------------------------------ voces de diálogo */
  const VOZ = {
    heroe:{f:150, onda:'square', lp:1500, fo:900, dur:0.05, v:0.2, esc:[0, 3, 5, 7, 10]},
    mateo:{f:520, onda:'triangle', lp:5200, fo:1900, dur:0.055, v:0.3, esc:[0, 2, 4, 7, 9, 12], sube:1.2},
    jefe:{f:96, onda:'sawtooth', lp:1100, fo:520, dur:0.09, v:0.26, esc:[0, 2, 3, 5, 7], vib:1},
    maton:{f:116, onda:'sawtooth', lp:780, fo:640, dur:0.06, v:0.28, esc:[0, 1, 3, 5], sucio:1},
    radio:{f:310, onda:'square', lp:2600, fo:1700, dur:0.05, v:0.2, esc:[0, 5, 7, 12], radio:1}

  let CURVA_SUCIA = null, nBlips = 0;
  function voz(texto, tipo){
    if(!listo) return;

      const ch = [...String(texto === undefined || texto === null ? '' : texto)].pop() || '';
      if(!/[a-z0-9áéíóúñüçãõâêôà]/i.test(ch) || C.state !== 'running') return;
      const now = ya(); if(now - ultBlip < 1/18) return; ultBlip = now; nBlips++;
      const P = VOZ[tipo] || VOZ.heroe, t = now + 0.005, lo = ch.toLowerCase(), voc = 'aeiouáéíóúãõâêôàü'.includes(lo);
      const semi = P.esc[(lo.charCodeAt(0)*7 + 3) % P.esc.length] + (voc ? 0 : -2), f = P.f*Math.pow(2, semi/12)*rv(0.985, 1.015);
      const dur = P.dur*(voc ? 1.35 : 0.8), g = G(0, N.fx), lp = F('lowpass', P.lp, 0.8), fo = F('peaking', P.fo, 1.5), s = oscF(P.onda, f, t, t + dur + 0.1);

      if(P.sucio){ if(!CURVA_SUCIA){ CURVA_SUCIA = new Float32Array(64); for(let i = 0; i < 64; i++) CURVA_SUCIA[i] = Math.tanh((i/31.5 - 1)*3); }

      ult.connect(g); env(g.gain, t, 0.006, P.v, dur);

    } catch(e){ err(e); }
  }

  /* ------------------------------------------------------------ lento, intensidad, volumen, paso */
  function aplicarLento(){
    if(Math.abs(kLento - kAplic) < 0.004) return; kAplic = kLento;
    const now = ya(), fc = 18000*Math.pow(500/18000, kLento), dl = detL();
    N.musF.frequency.setTargetAtTime(fc, now, 0.05); N.ambF.frequency.setTargetAtTime(fc*1.2, now, 0.05);
    N.revMin.gain.setTargetAtTime(lerp(0.26, 0.5, kLento), now, 0.1);
    for(const r of OSC_M) if(r.fin > now) try { r.o.detune.setTargetAtTime(r.d0 + dl, now, 0.06); } catch(e){}
    if(AMB) for(const l of AMB.loops) try { l.s.playbackRate.setTargetAtTime(l.r*lerp(1, 0.58, kLento), now, 0.06); } catch(e){}
  }
  function lento(k){
    kLentoObj = lim(+k || 0, 0, 1); if(!listo) return;
    try { const tn = performance.now(), dt = lim((tn - tLento)/1000, 0, 0.1); tLento = tn;
      kLento += (kLentoObj - kLento)*(1 - Math.exp(-dt*7)); if(Math.abs(kLento - kLentoObj) < 0.002) kLento = kLentoObj;

  }
  function intensidad(k){ intenObj = lim(+k || 0, 0, 1); }
  function volumen(){
    if(!listo) return;
    try { const now = ya(), m = Math.pow(lim(+AJ.musica || 0, 0, 1), 1.6), e = Math.pow(lim(+AJ.efectos || 0, 0, 1), 1.4);
      N.musV.gain.setTargetAtTime(m*0.7, now, 0.02); N.fxV.gain.setTargetAtTime(e, now, 0.02); N.ambV.gain.setTargetAtTime(e*0.8, now, 0.02); } catch(e){ err(e); }
  }
  function paso(dt){
    if(!listo) return;
    try {
      const tn = performance.now(); tPaso = tn;
      const d = lim(tPasoAnt ? (tn - tPasoAnt)/1000 : (+dt || 0.016), 0, 0.25); tPasoAnt = tn;
      if(tn - tLento > 300 && kLento > 0){ kLentoObj = 0; kLento *= Math.exp(-d*7); if(kLento < 0.003) kLento = 0; aplicarLento(); }   /* nadie llama lento(): vuelve solo */
      if(C.state !== 'running') return;

      for(const r of REPS) if(r.vivo && r.T.capas) for(const n of CAPAS){ const v = objCapa(r.T, n);

    /* para el banco */
    _inst:() => ({piano, pad, bandoneon, bajo, pluck, lead, coro, bombo, caja, hat, metal, stab, mus:N.mus}), _ctx:() => C, _salida:() => N && N.sal, _err:ERR, _faltan:FALTAN, _vivas:() => VIVAS.length, _reps:() => REPS.map(r => r.nom + (r.vivo ? '' : '·')),

    _vivos:() => { const n = ya(); return OSC_M.filter(r => r.fin > n).length; }, _estado:() => ({kLento, inten, tema:temaAct, amb:ambAct, osc:OSC_M.length, vivas:VIVAS.length, blips:nBlips})};
})();

/* ================================================================ pixel art por código
   Un muñeco con esqueleto (cadera, rodillas, tobillos, cuello, cabeza) que se dibuja píxel a píxel,
   con contorno y luz de arriba a la izquierda. Los brazos van APARTE: cada uno apunta a su enemigo. */
function lienzo(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d', {willReadFrequently:true}); g.imageSmoothingEnabled = false; return [c, g]; }
const P = {                                                    /* paleta: pocos colores, bien separados */
  K:'#0a0610', mascara:'#231c2e', mascaraL:'#3a3048', ojo:'#f4f0ea', bufanda:'#d8283a', bufandaL:'#ff5a5a',
  campera:'#80603f', camperaL:'#a8815a', camperaS:'#4e3826', panta:'#3a3646', pantaS:'#221f2a', bota:'#141018', botaL:'#3a3440',
  piel:'#d8a07a', pielS:'#a8704e', pielO:'#8a5a3e', metal:'#9aa4b4', metalS:'#4c5464', negro:'#18141c',
  traje:'#4a5a3c', trajeS:'#2e3a24', trajeL:'#6a7c52', cuero:'#6a3e24', cueroS:'#42240f', chaleco:'#5a5e66', casco:'#3e4450',
  tirador:'#1e1c24', tiradorL:'#34303e', boina:'#5a1a2a', te:'#e8d8a8', teS:'#b8a070', hilo:'#e8e0d0', laser:'#ff2a2a'
};
function px(g, x, y, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function rect(g, x, y, w, h, c){ g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disco(g, cx, cy, r, c){ g.fillStyle = c; for(let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++) for(let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++)
  if((x + .5 - cx)**2 + (y + .5 - cy)**2 <= r*r) g.fillRect(x, y, 1, 1); }
function linea(g, x0, y0, x1, y1, gr, c){ const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0)*2)); g.fillStyle = c;
  for(let i = 0; i <= n; i++){ const t = i/n, x = x0 + (x1 - x0)*t, y = y0 + (y1 - y0)*t;
    if(gr <= 1) g.fillRect(Math.round(x), Math.round(y), 1, 1); else disco(g, x, y, gr/2, c); } }
/* contorno de 1 píxel por fuera y volumen: luz arriba-izquierda, sombra abajo-derecha */
function acabar(c, x0, y0, w, h, opc){
  opc = opc || {};
  const g = c.getContext('2d'), im = g.getImageData(x0, y0, w, h), d = im.data;
  const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y*w + x)*4 + 3] > 127;
  const orig = new Uint8Array(w*h); for(let i = 0; i < w*h; i++) orig[i] = d[i*4 + 3] > 127 ? 1 : 0;
  const O = (x, y) => x >= 0 && y >= 0 && x < w && y < h && orig[y*w + x];
  const kc = [10, 6, 16];
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){ const i = (y*w + x)*4;
    if(orig[y*w + x]){
      if(opc.sombrear !== false){
        const luz = !O(x - 1, y) || !O(x, y - 1), som = !O(x + 1, y) || !O(x, y + 1);
        const k = luz && !som ? 1.22 : som && !luz ? 0.72 : 1;
        if(k !== 1) for(let j = 0; j < 3; j++) d[i + j] = Math.min(255, d[i + j]*k + (k > 1 ? 10 : 0));
      }
      continue; }
    if(O(x - 1, y) || O(x + 1, y) || O(x, y - 1) || O(x, y + 1)){ d[i] = kc[0]; d[i + 1] = kc[1]; d[i + 2] = kc[2]; d[i + 3] = 255; }
  }

}
/* una hoja de cuadros en fila, con su relieve y su mapa de brillo */
function hacerHoja(fw, fh, cuadros, opc){
  opc = opc || {};
  const n = cuadros.length, [c, g] = lienzo(fw*n, fh);
  let emi = null, ge = null; if(opc.emisivo){ [emi, ge] = lienzo(fw*n, fh); ge.fillStyle = '#000'; ge.fillRect(0, 0, fw*n, fh); }

function decir(o, txt, t){ o.bocadillo = {txt, t:t || 3, n:0}; SON.fx(o === MATEO ? 'mateo' : 'risa_jefe'); }

    decir(e, f === 2 ? tr('¡Suficiente! ¡Traigan las teteras!') : tr('¡Mi traje! ¡Esto es la GUERRA!'), 2.6);
    if(f === 2) for(const x of [3, 26.5]) { const m = crearEnemigo('maton', x, 16); m.est = 'alerta'; m.cd = 1.5; }

function cargarNivel(i){

    if(t === 'P'){ ini = {x, y}; NIVEL.mapa[f][c] = '.'; }

    else if(t === 'o' || t === 'c'){ const tipo = t === 'o' ? 'garrafa' : 'chapa', m = hacerSprite(HOJAS.obj[tipo], {pie:0});

function soltarDedo(ev, cancela){

/* ================================================================ el lazo */
let ultimo = 0;
function lazo(ts){
  requestAnimationFrame(lazo);
  const dtR = Math.min(0.05, Math.max(0, (ts - (ultimo || ts))/1000)); ultimo = ts; J.tr += dtR;
  if(J.modo === 'juego' && !J.pausa && !J.cine){
    /* la cámara lenta: planeo, la última baja, el vidrio, el aire con enemigos a la vista */
    let obj = 1;
    const alertas = ENEM.some(e => !e.muerto && e.est === 'alerta' && enPantalla(e.x, e.y));
    if(HE.muerto) obj = 0.3; else if(J.planeo) obj = 0.12; else if(J.killcam > 0) obj = 0.12; else if(J.vidrio > 0) obj = 0.2;
    else if(alertas && (HE.est === 'aire' || HE.est === 'pared' || HE.est === 'desliza')) obj = 0.3;
    if(J.fin) obj = 0.35;
    J.tsObj = obj; J.ts += (obj - J.ts)*(1 - Math.exp(-dtR*(obj < J.ts ? 16 : 5)));
    J.killcam = Math.max(0, J.killcam - dtR); J.vidrio = Math.max(0, J.vidrio - dtR);
    let dt = dtR*J.ts; if(J.hitstop > 0){ J.hitstop -= dtR; dt = 0; }
    J.t += dt; J.reloj += dt;
    const pasos = Math.max(1, Math.ceil(dt/(1/120)));
    for(let i = 0; i < pasos; i++){ const d = dt/pasos; pasoHeroe(d); pasoEnemigos(d); pasoBalas(d); }
    PART.solidas.paso(dt); PART.brillos.paso(dt); pasoFlashes(dt); pasoDedos(dtR);
    J.multT -= dtR; if(J.multT <= 0) J.mult = 1;
    for(const t of J.textos){ t.t -= dtR; t.y += dtR*0.8; } J.textos = J.textos.filter(t => t.t > 0);
    pasoPistas(dtR);
    if(HE.vida === 1 && !HE.muerto){ J.latido = (J.latido || 0) - dtR; if(J.latido <= 0){ J.latido = 0.9; SON.fx('corazon'); } }
    /* el último lugar seguro, para reaparecer */
    if(HE.est === 'suelo' && !HE.muerto && !ENEM.some(e => !e.muerto && e.est === 'alerta') && celda(HE.x, HE.y - 0.5) !== '^'){ J.check = {x:HE.x, y:HE.y + 0.1}; }
    SON.intensidad(lim((alertas ? 0.5 : 0.15) + (J.mult - 1)*0.08 + (J.nivel.jefe ? 0.3 : 0), 0, 1));
    CAMARA.obj.x = lim(HE.x + HE.dir*1.6 + HE.vx*0.12, W/TX/2 - 1, NIVEL.ancho - W/TX/2 + 1); CAMARA.obj.y = Math.max(HE.y + 2, H/TX/2 - 1.2);
    CAMARA.zoom += ((J.ts < 0.5 ? 1.07 : 1) - CAMARA.zoom)*(1 - Math.exp(-dtR*3));
    P_FIN.u.lento.value = lim((1 - J.ts)*1.15, 0, 1); P_FIN.u.planeo.value += ((J.planeo ? 1 : 0) - P_FIN.u.planeo.value)*(1 - Math.exp(-dtR*10));
    SON.lento(lim((1 - J.ts)/0.88, 0, 1));
  }
  P_FIN.u.herido.value = Math.max(0, P_FIN.u.herido.value - dtR*2.2); P_FIN.u.destello.value = Math.max(0, P_FIN.u.destello.value - dtR*3);
  if(J.fundir !== undefined){ const obj = J.fundirA || 0; P_FIN.u.fundido.value += (obj - P_FIN.u.fundido.value)*(1 - Math.exp(-dtR*4)); }
  pasoMundo(dtR*(J.pausa ? 0 : J.ts), J.tr);
  if(J.cine) pasoCine(dtR);
  if((J.modo !== 'juego' || J.cine) && !J.pausa){ PART.solidas.paso(dtR); PART.brillos.paso(dtR); pasoFlashes(dtR); }
  if(J.modo === 'menu'){ CAMARA.obj.x = 15 + Math.sin(J.tr*0.06)*5; CAMARA.obj.y = 8.2 + Math.sin(J.tr*0.09)*0.6; HE.est = 'suelo'; HE.vx = 0; }
  moverCamara(dtR*J.ts, dtR);
  dibujarEntidades(J.pausa ? 0 : dtR*J.ts);
  try { dibujarTodo(J.tr); } catch(e){ if(!lazo.err){ lazo.err = e; console.error(e); } }
  dibujarHUD(dtR);
  SON.paso(dtR);
}

/* ================================================================ HUD en píxeles */
function corazon(g, x, y, lleno, col){ const f = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  for(let j = 0; j < f.length; j++) for(let i = 0; i < 7; i++) if(f[j][i] === '#'){ g.fillStyle = lleno ? (j < 2 && i < 3 ? '#ff8a8a' : col || '#e8283a') : '#3a2a3a'; g.fillRect(x + i, y + j, 1, 1); }
  g.fillStyle = K; }
function anillo(g, x, y, r, frac, col){ const n = Math.ceil(r*7); for(let i = 0; i < n; i++){ const a = -Math.PI/2 - (i/n)*Math.PI*2; if(i/n > frac) break;
  g.fillStyle = K; g.fillRect(Math.round(x + Math.cos(a)*r) + 1, Math.round(y + Math.sin(a)*r) + 1, 1, 1);
  g.fillStyle = col; g.fillRect(Math.round(x + Math.cos(a)*r), Math.round(y + Math.sin(a)*r), 1, 1); } }
function dibujarHUD(dtR){
  const g = cxHUD; g.clearRect(0, 0, W, H);
  if(J.cine){ dibujarCine(g, dtR); return; }

function dibujarJuegoHUD(g, dtR){

    g.fillStyle = 'rgba(6,4,12,0.8)'; g.fillRect(x, y, W, h); g.fillStyle = '#b81c2c'; g.fillRect(x, y, W, 1); g.fillRect(x, y + h - 1, W, 1);
    texto(g, J.nivel.id, x + W/2, y + 3, 'oro'); texto(g, tr(J.nivel.nombre), x + W/2, y + 13, 'blanco'); }

  if(J.planeo){ const d = J.planeo, tr = trayectoria((d.x - d.x0)/TX, -(d.y - d.y0)/TX);

      if(p.fin){ anillo(g, q.x, q.y, 4, 1, '#0a0610'); anillo(g, q.x, q.y, 3, 1, '#ffffff'); return; }
      if(i % 2) return; const a = 1 - i/n*0.7, s2 = tr.desliza ? 1 : 2;
      g.fillStyle = 'rgba(10,6,16,' + a*0.8 + ')'; g.fillRect(X, Y + 1, s2 + 1, s2);
      g.fillStyle = 'rgba(255,255,255,' + a + ')'; g.fillRect(X, Y, s2, s2); });

    const L = Math.hypot(d.x - d.x0, d.y - d.y0);
    for(let i = 0; i < L; i += 3){ const X = Math.round(d.x0 + (d.x - d.x0)*i/L), Y = Math.round(d.y0 + (d.y - d.y0)*i/L); g.fillStyle = 'rgba(255,220,120,0.55)'; g.fillRect(X, Y, 1, 1); }

function dibujarBocadillo(g, o, alto, col, dtR){

/* el logo: MATE grande, AMARGO debajo, un brillo que lo cruza y la bufanda que flamea */
let _LOGO = null;
/* letras gordas: cada píxel de la fuente es un bloque, con degradé, brillo arriba, contorno y un canto en 3D */
function letrasGordas(str, B, cols, canto){
  const f = lienzoTexto(str, 'blanco', {sinBorde:true}), d = f.getContext('2d').getImageData(0, 0, f.width, f.height).data, fw = f.width, fh = f.height;
  const on = (x, y) => x >= 0 && y >= 0 && x < fw && y < fh && d[(y*fw + x)*4 + 3] > 40;
  let y0 = fh, y1 = 0; for(let y = 0; y < fh; y++) for(let x = 0; x < fw; x++) if(on(x, y)){ y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
  const P2 = 2, E = canto, w = fw*B + P2*2, h = (y1 - y0 + 1)*B + P2*2 + E, [c, g] = lienzo(w, h), [m, gm] = lienzo(w, h);
  for(let y = y0; y <= y1; y++) for(let x = 0; x < fw; x++) if(on(x, y)) gm.fillRect(P2 + x*B, P2 + (y - y0)*B, B, B);
  const md = gm.getImageData(0, 0, w, h).data, M2 = (x, y) => x >= 0 && y >= 0 && x < w && y < h && md[(y*w + x)*4 + 3] > 0;
  const hh = (y1 - y0 + 1)*B;
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    if(M2(x, y)){ const k = lim((y - P2)/hh, 0, 0.999), col = cols[Math.floor(k*cols.length)];
      g.fillStyle = !M2(x, y - 1) || !M2(x - 1, y) ? '#fffbe8' : !M2(x + 1, y) || !M2(x, y + 1) ? cols[cols.length - 1] : col; g.fillRect(x, y, 1, 1); continue; }
    let prof = 0; for(let e = 1; e <= E; e++) if(M2(x, y - e)){ prof = e; break; }
    if(prof){ g.fillStyle = prof === 1 ? '#8a2a14' : prof < E ? '#5a1408' : '#3a0a06'; g.fillRect(x, y, 1, 1); } }
  /* contorno por fuera de todo */
  const cd = g.getImageData(0, 0, w, h).data, C2 = (x, y) => x >= 0 && y >= 0 && x < w && y < h && cd[(y*w + x)*4 + 3] > 0;
  g.fillStyle = K; for(let y = 0; y < h; y++) for(let x = 0; x < w; x++) if(!C2(x, y) && (C2(x - 1, y) || C2(x + 1, y) || C2(x, y - 1) || C2(x, y + 1))) g.fillRect(x, y, 1, 1);
  return c;
}
function logo(g, cx, y, esc){
  if(!_LOGO || _LOGO.idioma !== IDIOMA){
    const a = letrasGordas('MATE', 4, ['#fff0a0', '#ffd84a', '#f8b020', '#e8901a', '#c86a10'], 4), b = letrasGordas('AMARGO', 2, ['#ffb0a0', '#ff6a4a', '#e8384a', '#b81c2c'], 2);
    const w = Math.max(a.width, b.width), [c, gc] = lienzo(w, a.height + b.height - 2); gc.drawImage(a, Math.round(w/2 - a.width/2), 0); gc.drawImage(b, Math.round(w/2 - b.width/2), a.height - 2);
    _LOGO = {c, idioma:IDIOMA, ha:a.height}; }
  const c = _LOGO.c, w = c.width*esc, h = c.height*esc, x = Math.round(cx - w/2);
  /* la bufanda: sale de abajo de AMARGO y flamea hacia la derecha */
  const L2 = Math.round(w*0.8), x0 = Math.round(cx - w*0.28), y0 = y + h - 2*esc;
  for(let i = 0; i < L2; i++){ const k = i/L2, yy = Math.round(y0 + Math.sin(i*0.06 - J.tr*3.6)*3*esc*k + k*k*4*esc), gr = Math.max(2, Math.round((3.2 - k*1.6)*esc));

    if(i > L2 - 5*esc && i % 3 === 0){ g.fillStyle = '#b81c2c'; g.fillRect(x0 + i, yy + gr, 1, esc*2); } }
  g.drawImage(c, 0, 0, c.width, c.height, x, y, w, h);
  /* el brillo en diagonal, sólo sobre las letras */
  const [m, gm] = lienzo(c.width, c.height); gm.drawImage(c, 0, 0); gm.globalCompositeOperation = 'source-atop';
  const p = ((J.tr*0.45) % 2.4)*c.width*1.3 - c.width*0.3; gm.fillStyle = 'rgba(255,255,255,0.8)'; gm.beginPath(); gm.moveTo(p, 0); gm.lineTo(p + 5, 0); gm.lineTo(p - 7, c.height); gm.lineTo(p - 12, c.height); gm.closePath(); gm.fill();

  g.globalAlpha = 0.55; g.drawImage(m, 0, 0, c.width, c.height, x, y, w, h); g.globalAlpha = 1;

  if(HOJAS.mateo){ const f = Math.sin(J.tr*1.7) > 0.95 ? 1 : 0, e2 = Math.max(1, esc); g.drawImage(HOJAS.mateo.c, f*HOJAS.mateo.fw, 0, HOJAS.mateo.fw, HOJAS.mateo.fh, x + w + 3, Math.round(y + 4*esc + Math.sin(J.tr*2.2)*2), HOJAS.mateo.fw*e2, HOJAS.mateo.fh*e2); }
  return {x, y, w, h};
}
