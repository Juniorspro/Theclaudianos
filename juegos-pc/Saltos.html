<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#140c08;touch-action:none;-webkit-user-select:none;user-select:none;
    overscroll-behavior:none;font-family:ui-monospace,Menlo,Consolas,monospace;color:#f3e6c8}

  /* menús: paneles y botones de 16 bits, todo en pasos, nada suave */

    justify-content:flex-end;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 22px);gap:12px;pointer-events:none}
  #menu.ver{display:flex}
  #menu > *{pointer-events:auto}
  #menu.arriba{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 16px);overflow-y:auto}
  .boton{border-radius:0;border:none;background:#c8501a;color:#fff;font:inherit;font-weight:800;min-width:230px;
    padding:12px 18px;cursor:pointer;
    box-shadow:inset -4px -4px 0 #7c2c08,inset 4px 4px 0 #ff9a52,0 0 0 3px #140c08,0 6px 0 3px #140c08;
    animation:entrar .42s steps(5) both}

  .boton.oro{background:#d8a020;box-shadow:inset -4px -4px 0 #8a5a08,inset 4px 4px 0 #ffe07a,0 0 0 3px #140c08,0 6px 0 3px #140c08}

  .boton:active{transform:translateY(4px)}

  .boton:nth-of-type(4){animation-delay:.18s}.boton:nth-of-type(5){animation-delay:.24s}.boton:nth-of-type(6){animation-delay:.3s}

<script>
(function(){
'use strict';

/* ================================================================ utilidades */
const lim = (v, a, b) => v < a ? a : (v > b ? b : v);

const lerp = (a, b, t) => a + (b - a)*t;
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }

  for(let i = 0; i < s.length; i++){ h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }

let rnd = mulberry(semilla32('arena' + Date.now()));

/* ================================================================ lienzos y escala entera
   Todo se dibuja en un lienzo chico (1 píxel = 1 píxel de mundo) y se agranda por un ENTERO de
   píxeles de pantalla reales: con escala 2,6 los píxeles salen de distinto tamaño y tiemblan. */
const lienzo = document.getElementById('lienzo');
const cxP = lienzo.getContext('2d', {alpha:false});
const cvM = document.createElement('canvas'), cxM = cvM.getContext('2d', {alpha:false});
const cvH = document.createElement('canvas'), cxH = cvH.getContext('2d');
/* DET: píxeles finos por unidad de mundo. La física y el HUD van en unidades; el mundo se dibuja
   al doble de resolución para que los personajes tengan cuatro veces más píxeles de detalle */
const DET = 2;
const rf = v => Math.round(v*DET)/DET;
let DPR = 1, PXd = 6, PXf = 3, ES = 3, AM = 136, AH = 296, SUELO = 170, CSSW = 412, CSSH = 892;
function medir(){
  CSSW = lienzo.clientWidth || innerWidth; CSSH = lienzo.clientHeight || innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 3);
  const w = Math.round(CSSW*DPR), h = Math.round(CSSH*DPR);
  if(lienzo.width !== w || lienzo.height !== h){ lienzo.width = w; lienzo.height = h; }
  PXf = Math.max(1, Math.floor(Math.min(w/(132*DET), h/(200*DET))));   /* píxeles reales por píxel FINO: ENTERO */
  PXd = PXf*DET;                                              /* píxeles reales por unidad de mundo */
  ES = PXd/DPR;                                               /* píxeles CSS por unidad */
  AM = Math.ceil(w/PXd); AH = Math.ceil(h/PXd);
  if(cvM.width !== AM*DET || cvM.height !== AH*DET){ cvM.width = AM*DET; cvM.height = AH*DET; }
  if(cvH.width !== AM || cvH.height !== AH){ cvH.width = AM; cvH.height = AH; }
  cxM.imageSmoothingEnabled = cxH.imageSmoothingEnabled = cxP.imageSmoothingEnabled = false;
  SUELO = Math.round(AH*(AH > AM*1.3 ? 0.585 : 0.70));        /* en vertical los mandos van abajo del piso */
  armarZonas();
  FONDO.cache = null;
}
new ResizeObserver(() => medir()).observe(lienzo);

'0':'.###.#...##..###.#.###..##...#.###.', '1':'..#...##....#....#....#....#...###.', '2':'.###.#...#....#...#...#...#...#####',

const CACHE_TXT = new Map();
/* 1 px de lienzo = 1 px de fuente: sombra abajo-derecha, contorno 3×3 y relleno con degradé por fila */
function lienzoTexto(str, grad, opc){
  str = String(str).toUpperCase(); grad = grad || 'blanco'; opc = opc || {};
  const clave = str + '|' + grad + '|' + (opc.sinBorde ? 1 : 0);
  if(CACHE_TXT.has(clave)) return CACHE_TXT.get(clave);
  if(CACHE_TXT.size > 400) CACHE_TXT.clear();
  const chars = [...str], W = chars.length*6 + 3, H = 3 + 7 + 3;
  const mascara = new Uint8Array(W*H);
  chars.forEach((ch, i) => {
    let base = ch, marca = null;
    if(MARCA[ch]){ base = MARCA[ch][0]; marca = MARCAS[MARCA[ch][1]]; }
    const g = FUENTE[base] || FUENTE['?'], x0 = 1 + i*6, y0 = 4;
    for(let y = 0; y < 7; y++) for(let x = 0; x < 5; x++) if(g[y*5 + x] === '#') mascara[(y0 + y)*W + x0 + x] = 1;
    if(marca) for(let y = 0; y < 2; y++) for(let x = 0; x < 5; x++) if(marca[y][x] === '#') mascara[(y0 - 3 + y)*W + x0 + x] = 1;
  });
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d'), paleta = GRAD[grad] || GRAD.blanco;
  if(!opc.sinBorde){
    g.fillStyle = '#140c08';
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(mascara[y*W + x]){ g.fillRect(x - 1, y - 1, 3, 3); g.fillRect(x + 1, y + 1, 1, 1); g.fillRect(x, y + 2, 1, 1); g.fillRect(x + 1, y + 2, 1, 1); }
  }
  for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) if(mascara[y*W + x]){
    g.fillStyle = paleta[lim(y - 4, 0, 6)]; g.fillRect(x, y, 1, 1); }
  CACHE_TXT.set(clave, c);
  return c;
}
/* texto en el mundo o en el HUD, centrado o no */
function texto(ctx, str, x, y, grad, opc){
  const c = lienzoTexto(str, grad, opc), e = (opc && opc.esc) || 1;
  const ax = opc && opc.izq ? 0 : (opc && opc.der ? c.width*e : Math.floor(c.width*e/2));
  ctx.drawImage(c, Math.round(x - ax), Math.round(y), c.width*e, c.height*e);
  return c.width*e;
}
/* un texto en píxeles para los menús (DOM), a escala S */
function pixelTxt(str, grad, S){
  const c = lienzoTexto(str, grad), k = document.createElement('canvas');
  k.width = c.width; k.height = c.height; k.getContext('2d').drawImage(c, 0, 0);
  k.className = 'px'; k.style.width = c.width*(S || 3) + 'px'; k.style.height = c.height*(S || 3) + 'px';
  return k;
}

/* ================================================================ sprites por piezas

   w blanco · e ojo · q cuadros (se alternan los dos colores de la clase) */
const CABEZAS = {
  ret:["...kkkkk...","..khhhhhkk.",".khhhhhhhhk",".krrrrrrrrk",".khhppHHpk.",".khPppwepk.",
       ".khPpppppPk",".khppppRpk.",".khhppppk..","..khhhhk...","...kppk....","...kppk...."],
  fan:["...........","...kkkkk...","..kpppppkk.",".kprrrrppk.",".kpppHHppk.",".kPppwepppk",
       ".kPppppppPk",".khhppRphk.",".khhhhhhhk.","..khhhhhk..","...khhhk...","...kppk...."],
  mirmillon:["....kkk....","...kmMmk...","..kkmMmkk..",".kmmmmmmmk.","kmmmmmmmmmk",".kmmMkmkmkk",

  tracio:[".....kkkkk.","....koooook","...kooookk.","..kooook...",".koooooook.","koooooooook",

  galea:["...........","....krk....","...kmmmk...","..kmmmmmk..",".kmmmmmmmk.",".kMmmmmmmMk",
       ".kmmpwepkk.",".kmmpppppPk",".kmmhpRphk.","..kkhhhhk..","...kppk....","...kppk...."]
};
/* Q: tono intermedio de la piel para marcar el músculo sin que parezcan manchas */
const TORSO = ["..kkkkkk..",".kQppppQk.","kppppppppk","kQppppppQk","kpQQppQQpk","kppppppppk",
  ".kpQpQppk.",".kppppQpk.",".kQppppQk.",".kccoocck.","kqqqqqqqqk","kqqqqqqqqk",".kqqkqqqk.",".kqk..kqk."];   /* 10 de ancho: más flaco */
const _v = "............";
const ARMADURAS = {
  cuero:[_v,".kcCccccCck.","kcCccccccCck","kccCccccCcck","kcccccccccck",".kcCcCcCcCck",".kcccccccck.",".kcCcCcCck..",".kcccccccck.",_v,_v,_v,_v,_v],

  lorica:[_v,".kmmmmmmmmk.","kMMMMMMMMMMk","kmmmmmmmmmmk","kMMMMMMMMMMk",".kmmmmmmmmmk",".kMMMMMMMMk.",".kmmmmmmmk..",".kMMMMMMMMk.",_v,_v,_v,_v,_v]
};
const ESCUDO_SPR = {
  scutum:[".kkkkkk.","kooooook","korrrrok","korrrrok","korRrrok","korrrrok","korrrrok","koroorok",
          "koroorok","korrrrok","korrrrok","korRrrok","korrrrok","korrrrok","kooooook",".kkkkkk."],

  redondo:["...kkkk...",".kkooookk.",".koorrook.","koorrrrook","korrOOrrok","korrOOrrok","koorrrrook",".koorrook.",".kkooookk.","...kkkk..."]
};
const PAL_BASE = {k:'#1a1210', p:'#e8a878', P:'#b0704a', h:'#4a2c16', H:'#2a180a', m:'#d8dce6', M:'#7c8496',
  o:'#f0c048', O:'#a06c1c', r:'#d03828', R:'#7a1a14', c:'#9a6434', C:'#5c3a1c', w:'#ffffff', e:'#141018', a:'#f0f0f4', A:'#3c5cc0'};
const PAL_ESTATUA = {k:'#2a2622', p:'#b8b2a8', P:'#8a847a', h:'#9c968c', H:'#77716a', m:'#c4beb4', M:'#8e887e',
  o:'#aaa49a', O:'#7e786e', r:'#a29c92', R:'#78726a', c:'#9a948a', C:'#726c64', w:'#d8d2c8', e:'#4a4640', a:'#c8c2b8', A:'#8a847a'};
function hornear(grid, pal){
  const h = grid.length, w = grid[0].length, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    let r = grid[y][x]; if(r === '.' || r === ' ' || r === undefined) continue;
    if(r === 'q') r = (x + y) % 2 ? 'a' : 'A';
    g.fillStyle = pal[r] || '#ff00ff'; g.fillRect(x, y, 1, 1);
  }
  return c;

/* el juego de piezas de UN gladiador, horneado una vez con su paleta */
/* ---------------------------------------------------------------- horneado con detalle
   La grilla se agranda ×2 con Scale2x (redondea las diagonales sin inventar colores) y después se
   sombrea con luz de arriba a la izquierda: brillo del lado de la luz, sombra del otro, destello en
   el metal, textura en cuero y tela, y el contorno del lado iluminado teñido del color de adentro. */
const _tono = new Map();
function tono(hex, k){ const c = hex + k; if(_tono.has(c)) return _tono.get(c);
  const n = parseInt(hex.slice(1), 16), f = v => Math.round(lim(k >= 1 ? v + (255 - v)*(k - 1) : v*k, 0, 255)).toString(16).padStart(2, '0');
  const r = '#' + f(n >> 16) + f((n >> 8) & 255) + f(n & 255); _tono.set(c, r); return r; }
function scale2x(grid){
  const h = grid.length, w = grid[0].length, g = (x, y) => (y < 0 || y >= h || x < 0 || x >= w) ? '.' : (grid[y][x] || '.');
  const out = []; for(let y = 0; y < h*2; y++) out.push(new Array(w*2));
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    const P = g(x, y), A = g(x, y - 1), B = g(x + 1, y), C = g(x - 1, y), D = g(x, y + 1);
    out[y*2][x*2]         = (C === A && C !== D && A !== B) ? A : P;
    out[y*2][x*2 + 1]     = (A === B && A !== C && B !== D) ? B : P;
    out[y*2 + 1][x*2]     = (D === C && D !== B && C !== A) ? C : P;
    out[y*2 + 1][x*2 + 1] = (B === D && B !== A && D !== C) ? D : P;
  }
  return out;
}
const METALES = 'mMoO', TELAS = 'cCrRqaA';
function hornearHD(grid, pal){
  const G = scale2x(grid), h = G.length, w = G[0].length, c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), en = (x, y) => (y < 0 || y >= h || x < 0 || x >= w) ? '.' : G[y][x];
  const vacio = r => r === '.' || r === 'k' || r === undefined;
  const colorDe = (r, x, y) => r === 'q' ? pal[((x >> 1) + (y >> 1)) % 2 ? 'a' : 'A'] : pal[r];
  for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
    const r = G[y][x]; if(r === '.') continue;
    let col;
    if(r === 'k'){
      /* contorno: del lado de la luz toma el color de adentro oscurecido; del otro, negro */
      const ab = en(x, y + 1), de = en(x + 1, y);
      const adentro = !vacio(ab) ? ab : !vacio(de) ? de : null;
      col = adentro && (vacio(en(x, y - 1)) || vacio(en(x - 1, y))) ? tono(colorDe(adentro, x, y), 0.42) : pal.k;
    } else {

    carne(o){ const t = ahora(), d = salida(o.pan, 0.12), f = Math.min(1.6, o.f || 1);

      const g2 = gan(0, d), w = osc('sine', 110, g2, t, 0.2); w.frequency.exponentialRampToValueAtTime(45, t + 0.16); env(g2, t, 0.45*f, 0.002, 0.15);

      const g = gan(0, d), b = fil('bandpass', 2400, 2, g); ruido(b, t, 0.3); b.frequency.exponentialRampToValueAtTime(600, t + 0.25); env(g, t, 0.4, 0.004, 0.24);

    silbido(o){ const t = ahora(), d = salida(o.pan, 0.05), g = gan(0, d), b = fil('bandpass', 900, 1.5, g);
      ruido(b, t, 0.22); b.frequency.setValueAtTime(600, t); b.frequency.exponentialRampToValueAtTime(2200, t + 0.16); env(g, t, 0.10*(o.f || 1), 0.03, 0.14); },

      const g2 = gan(0, d); osc('sine', 60, g2, t, 0.2); env(g2, t, 0.3*f, 0.002, 0.14); },
    grito(o){ const t = ahora(), d = salida(o.pan, 0.3), g = gan(0, d), b = fil('bandpass', 800, 3, g), f0 = rnd2(180, 260);
      const w = osc('sawtooth', f0, b, t, 0.6); w.frequency.setValueAtTime(f0*1.3, t); w.frequency.exponentialRampToValueAtTime(f0*0.6, t + 0.55);

    jabalina(o){ const t = ahora(), d = salida(o.pan, 0.1), g = gan(0, d), b = fil('bandpass', 1400, 2, g);
      ruido(b, t, 0.4); b.frequency.setValueAtTime(700, t); b.frequency.exponentialRampToValueAtTime(2600, t + 0.35); env(g, t, 0.12, 0.05, 0.3); },
    clavo(o){ const t = ahora(), d = salida(o.pan, 0.1), g = gan(0, d); osc('triangle', 240, g, t, 0.3); env(g, t, 0.2, 0.002, 0.25);

    negado(){ const t = ahora(), g = gan(0, salida(0, 0)); osc('square', 140, fil('lowpass', 900, 1, g), t, 0.25); env(g, t, 0.08, 0.004, 0.2); },
    /* fanfarria de trompas (cornu): tres notas de sierra por un pasabajos */
    fanfarria(o){ const t = ahora(), d = salida(0, 0.4), notas = o && o.triste ? [293.7, 277.2, 220] : [293.7, 440, 587.3];

  };

    try { ctx = new AC(); } catch(e){ ctx = null; return; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    sal = ctx.createGain(); sal.gain.value = AJ.sonido ? 0.8 : 0; sal.connect(comp); comp.connect(ctx.destination);
    ruidoB = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
    const x = ruidoB.getChannelData(0); for(let i = 0; i < x.length; i++) x[i] = Math.random()*2 - 1;
    const L = Math.floor(ctx.sampleRate*1.8), imp = ctx.createBuffer(2, L, ctx.sampleRate);   /* la arena: piedra abierta */
    for(let c = 0; c < 2; c++){ const y = imp.getChannelData(c); for(let i = 0; i < L; i++) y[i] = (Math.random()*2 - 1)*Math.exp(-5.5*i/L); }

  const ESC = [146.8, 155.6, 185.0, 196.0, 220.0, 233.1, 261.6, 293.7];

    const t0 = ahora();
    while(proxT < t0 + 0.25){

        const i = paso % 16, e = lim(J.emocion, 0, 1);
        if(i % 4 === 0) bombo(t, 0.32 + 0.1*e);
        if(i % 8 === 6 || i % 16 === 3) tambor(t, 0.10 + 0.06*e);
        if(e > 0.3 && i % 2 === 1) tambor(t, 0.04*e);

        proxT += 60/112/2;
      } else {

        if(i % 2 === 0) nota(t, ESC[MEL[(paso/2 | 0) % 16]]*2, 0.55, 0.05);

function cortar(B, P, parte, d){
  const sk = esqueleto(B), pz = piezas(B.def);
  B.cortado[parte] = 90; B.sangrado += parte === 'cab' ? 3 : 0.9; B.hp[parte] = 0;
  const base = {vx:d*rv(1.2, 2.4) + B.vx*0.5, vy:rv(-4, -2.2), va:rv(-0.3, 0.3)*d, sangra:120, suelo:false, def:B.def, dir:B.dir};
  if(parte === 'cab') P.restos.push(Object.assign({tipo:'cab', spr:pz.cabeza, x:sk.C.x, y:sk.C.y, ang:B.ang}, base));
  else if(parte === 'bA' || parte === 'bE'){
    const b = parte === 'bA' ? sk.bA : sk.bE;
    P.restos.push(Object.assign({tipo:'brazo', x:(sk.S.x + b.mano.x)/2, y:(sk.S.y + b.mano.y)/2, ang:b.ang, largo:9, color:pz.pal.p, manica:parte === 'bA' && B.def.eq.manica}, base));
    const arm = parte === 'bA' ? B.def.eq.arma : B.def.eq.segunda;
    if(arm) P.restos.push(Object.assign({tipo:'arma', arma:ARMAS[arm], x:b.mano.x, y:b.mano.y, ang:b.ang}, base, {vx:base.vx*0.7, vy:base.vy*1.1}));
    if(parte === 'bE' && B.def.eq.escudo !== 'ninguno') P.restos.push(Object.assign({tipo:'escudo', spr:pz.escudo, x:b.mano.x, y:b.mano.y, ang:B.ang}, base, {vx:-d*0.6}));
    if(parte === 'bA'){ B.ataque = null; }
  } else {
    const p = parte === 'pI' ? sk.pT : sk.pD;
    P.restos.push(Object.assign({tipo:'pierna', x:(sk.H.x + p.x)/2, y:(sk.H.y + p.y)/2, ang:Math.PI/2, largo:12, color:pz.pal.p, grebas:B.def.eq.grebas}, base));
  }
  sangrar(P, sk.H.x, sk.H.y - 6, d, 40);
  SON.fx('corte', {pan:panDe(B)}); SON.fx('rugido', {f:1});
  P.textos.push({txt:parte === 'cab' ? '¡DECAPITADO!' : '¡CERCENADO!', x:B.x, y:-50, t:100, grad:'rojo'});
  J.emocion = Math.min(1.4, J.emocion + 0.5); J.congelado = Math.max(J.congelado, 9); J.sacude = 6;
  const A = P.a === B ? P.b : P.a; A.cortes++;
}
/* ¿qué tocó esta hoja? escudo, arma del otro o una parte del cuerpo */
function probarHoja(A, B, P, skA, skB, b, arma, cual){
  const h = filo(b, arma), at = cual === 1 ? A.ataque : A.ataque2;
  const prev = cual === 1 ? A.tip : A.tip2, v = prev ? Math.hypot(h.p1.x - prev.x, h.p1.y - prev.y) : 0;
  if(cual === 1){ A.tip = h.p1; A.v1 = v; } else { A.tip2 = h.p1; A.v2 = v; }
  const act = activo(at);
  if(A.muerto || (!act && v < 3.4) || (at && at.golpeo)) return;
  if(!at && (J.t - (A.sueltoT || 0)) < 14) return;
  /* escudo */
  const se = segEscudo(B, skB);
  if(se && !B.muerto && distSegSeg(h.p0, h.p1, se.p0, se.p1) < 1.8){
    if(at) at.golpeo = true; else A.sueltoT = J.t;
    if(cual === 1) A.av *= -0.45; else A.av2 *= -0.45;
    B.vx += A.dir*(0.5 + arma.peso*0.5); B.va += A.dir*B.dir*0.015;
    P.bloq = (P.bloq || 0) + 1; chispas(P, se.c.x, h.p1.y, 5); SON.fx('madera', {pan:panDe(B)}); SON.fx('metal', {pan:panDe(B), f:0.4});
    J.congelado = Math.max(J.congelado, 3); J.emocion += 0.03;
    if(at && at.i < at.fases.length - 1){ at.i = at.fases.length - 1; at.t = 0; }
    return;
  }
  /* arma contra arma */
  for(const [bB, aB] of [[skB.bA, armaDe(B)], [skB.bE, arma2De(B)]]){
    if(!aB || B.muerto) continue;
    const hB = filo(bB, aB);
    if(distSegSeg(h.p0, h.p1, {x:bB.mano.x, y:bB.mano.y}, hB.p1) < 1.5){
      if(at) at.golpeo = true; else A.sueltoT = J.t;
      if(cual === 1) A.av *= -0.5; else A.av2 *= -0.5;
      B.av *= -0.3;
      P.parad = (P.parad || 0) + 1; chispas(P, (h.p1.x + hB.p1.x)/2, (h.p1.y + hB.p1.y)/2, 9); SON.fx('metal', {pan:panDe(B), f:1});
      J.congelado = Math.max(J.congelado, 2); J.emocion += 0.02;
      return;
    }
  }
  /* cuerpo */
  let mejor = null, md = 1e9;
  const ps = partes(B, skB);
  for(let k = 0; k <= 5; k++){
    const q = {x:lerp(h.p0.x, h.p1.x, k/5), y:lerp(h.p0.y, h.p1.y, k/5)};
    for(const p of ps){ const dd = distSeg(q, p.a, p.b) - p.r; if(dd < 0 && dd < md){ md = dd; mejor = {p, q}; } }
  }
  if(mejor && (!B.muerto || B.muerto < 240)){
    if(at) at.golpeo = true; else A.sueltoT = J.t;
    if(B.muerto){ sangrar(P, mejor.q.x, mejor.q.y, A.dir, 8); SON.fx('carne', {pan:panDe(B), f:0.5});
      if(B.hp[mejor.p.id] !== undefined && !B.cortado[mejor.p.id] && mejor.p.id !== 'tor' && arma.tipo === 'corte' && v > 4) cortar(B, P, mejor.p.id, A.dir); return; }
    golpear(A, B, P, mejor.p.id, Math.max(v, act ? 3 : 0), mejor.q, arma, cual === 1 ? A.e : A.e2);
  }
}
/* choque de cuerpos: no se atraviesan (salvo que uno pase por arriba) */
function empujarCuerpos(a, b){
  if(a.muerto > 60 || b.muerto > 60) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  if(Math.abs(dx) < 7 && Math.abs(dy) < 20){
    const s = dx === 0 ? 1 : sig(dx), p = (7 - Math.abs(dx))/2;
    a.x -= s*p; b.x += s*p;
    const m = (a.vx + b.vx)/2; a.vx = m - s*0.4; b.vx = m + s*0.4;
  }
}

/* ================================================================ jabalinas y red */
function lanzar(g, o, P){
  const sk = esqueleto(g), esRed = g.red > 0 && (g.jab <= 0 || rnd() < 0.5);
  if(esRed) g.red--; else g.jab--;
  const dx = o.x - sk.S.x, dy = (o.y - 16) - sk.S.y, vx = lim(Math.abs(dx)/24, 2.4, 5.2)*sig(dx);
  const t = Math.abs(dx/vx), vy = (dy - 0.5*GRAV*0.7*t*t)/t + (g.jug ? 0 : rv(-0.5, 0.5)*(1.2 - g.dif));
  P.proy.push({tipo:esRed ? 'red' : 'jabalina', x:sk.S.x, y:sk.S.y - 2, vx, vy, ang:Math.atan2(vy, vx), dueno:g, vivo:true, t:0, clavado:false});
  SON.fx('jabalina', {pan:panDe(g)});
}
function pasoProyectiles(P){
  for(const j of P.proy){
    if(!j.vivo){ continue; }
    j.t++; j.vy += GRAV*0.7; j.x += j.vx; j.y += j.vy; j.ang = Math.atan2(j.vy, j.vx);
    if(j.tipo === 'red') j.giro = (j.giro || 0) + 0.3;
    if(j.y >= 0){ j.y = 0; j.vivo = false; j.clavado = j.tipo === 'jabalina'; if(j.clavado) SON.fx('clavo', {pan:0}); polvo(P, j.x, 4); continue; }
    if(j.x < 0 || j.x > ARENA_W){ j.vivo = false; continue; }
    const B = j.dueno === P.a ? P.b : P.a, sk = esqueleto(B);
    if(B.muerto > 100) continue;
    const punta = {x:j.x + Math.cos(j.ang)*6, y:j.y + Math.sin(j.ang)*6};
    const se = segEscudo(B, sk);
    if(se && distSeg(punta, se.p0, se.p1) < 2.5){ j.vivo = false; j.caida = true; j.vx *= -0.2; SON.fx('madera', {pan:panDe(B)}); chispas(P, punta.x, punta.y, 4);
      P.restos.push({tipo:'jab', x:j.x, y:j.y, vx:-j.vx*0.2 - B.dir*0.5, vy:-1.5, ang:j.ang, va:0.2, suelo:false, sangra:0}); continue; }
    for(const p of partes(B, sk)){
      if(distSeg(punta, p.a, p.b) < p.r + 1){
        j.vivo = false;
        if(j.tipo === 'red'){ B.enredado = B.def.eq.casco === 'secutor' ? 70 : 170; SON.fx('madera', {pan:panDe(B)}); P.textos.push({txt:'¡ENREDADO!', x:B.x, y:-42, t:80, grad:'azul'}); }
        else golpear(j.dueno, B, P, p.id, Math.hypot(j.vx, j.vy)*1.3, punta, {dano:14, tipo:'punta'}, 1);
        break;
      }
    }
  }
}

/* ================================================================ la IA
   Salta hasta quedar a tiro de su arma, pega con lo que tiene, se cubre cuando el otro arma el
   golpe (más cuanto más difícil), se aleja si queda encima y tira la jabalina de lejos. */
function pensar(g, o){
  const c = g.ctrl, I = g.ia;
  c.atk = null; c.postura = false; c.lanzar = false;
  if(g.muerto || o.muerto || g.caido){ c.izq = c.der = false; c.guardia = false; I.hop = null; return; }
  const dx = o.x - g.x, d = Math.abs(dx), hacia = sig(dx), alc = alcance(g);
  if(o.ataque && o.ataque.i <= 1 && d < alcance(o) + 10){
    if(!I.reac){ I.reac = true;
      if(rnd() < (escudoDe(g) ? 0.25 : 0.12) + 0.55*g.dif) I.guardT = 16 + RI(0, 12);
      else if(rnd() < 0.25*g.dif && g.suelo && !I.hop){ I.hop = {dir:-hacia, t:RI(4, 10)}; } }
  } else I.reac = false;
  c.guardia = I.guardT > 0; if(I.guardT > 0) I.guardT--;
  if(I.hop){ c.izq = I.hop.dir < 0; c.der = I.hop.dir > 0; if(--I.hop.t <= 0){ I.hop = null; c.izq = c.der = false; } return; }
  c.izq = c.der = false;
  if(--I.t > 0) return;
  const agresivo = 1 + Math.min(1, (J.pelea ? J.pelea.quieto : 0)/900);
  if((g.jab > 0 || g.red > 0) && d > 50 && rnd() < 0.18*g.dif*agresivo){ c.lanzar = true; I.t = 40; return; }
  if(d > alc + 4){ const carga = lim((d - alc)/70, 0.15, 1); I.hop = {dir:hacia, t:Math.round(carga*34)}; I.t = Math.round(carga*34) + RI(8, 30)/agresivo; return; }
  if(d < alc*0.4 && rnd() < 0.45){ I.hop = {dir:-hacia, t:RI(3, 8)}; I.t = RI(15, 30); return; }
  if(rnd() < 0.07) c.postura = true;
  const a = armaDe(g) || arma2De(g), larga = a && (a.forma === 'lanza' || a.forma === 'tridente');
  const r = rnd();
  c.atk = larga ? (r < 0.55 ? 'adelante' : r < 0.75 ? 'rapido' : r < 0.9 ? 'arriba' : 'abajo')
                : (r < 0.3 ? 'arriba' : r < 0.55 ? 'rapido' : r < 0.8 ? 'adelante' : 'abajo');
  I.t = Math.round(lerp(46, 12, g.dif)/agresivo + RI(0, 22));
}

/* ================================================================ efectos */
const LIM_PART = 260;
function mult(){ return AJ.sangre === 'mucha' ? 1 : AJ.sangre === 'poca' ? 0.35 : 0; }
function sangrar(P, x, y, d, n){ n = Math.round(n*mult());
  for(let i = 0; i < n && P.part.length < LIM_PART; i++)
    P.part.push({tipo:'sangre', x, y, vx:d*rv(0.2, 2.6) + rv(-0.8, 0.8), vy:rv(-3.2, 0.4), t:rv(50, 110), c:Math.random() < 0.3 ? '#6a0a08' : '#a8140e'}); }
function gota(P, x, y, vx, vy){ if(!mult() || P.part.length >= LIM_PART) return;
  P.part.push({tipo:'sangre', x, y, vx, vy, t:120, c:Math.random() < 0.4 ? '#6a0a08' : '#a8140e'}); }
function chispas(P, x, y, n){ for(let i = 0; i < n && P.part.length < LIM_PART; i++)
  P.part.push({tipo:'chispa', x, y, vx:rv(-2.5, 2.5), vy:rv(-2.8, 0.5), t:rv(8, 18), c:Math.random() < 0.5 ? '#fff4b0' : '#ffc040'}); }
function polvo(P, x, n){ for(let i = 0; i < n && P.part.length < LIM_PART; i++)
  P.part.push({tipo:'polvo', x:x + rv(-4, 4), y:-0.5, vx:rv(-1, 1), vy:rv(-0.9, -0.1), t:rv(14, 28), c:Math.random() < 0.5 ? '#d8b878' : '#c4a060'}); }
function estrella(P, x, y, tam){ P.estrellas.push({x, y, t:tam === 'grande' ? 7 : 5, tam}); }
function pasoEfectos(P){
  for(let i = P.part.length - 1; i >= 0; i--){
    const p = P.part[i]; p.t--;
    if(p.tipo === 'polvo'){ p.vx *= 0.92; p.vy *= 0.92; } else p.vy += GRAV*(p.tipo === 'chispa' ? 0.6 : 0.9);
    p.x += p.vx; p.y += p.vy;
    if(p.y >= 0 && p.tipo === 'sangre'){ manchar(P, p.x, p.c); P.part.splice(i, 1); continue; }
    if(p.t <= 0) P.part.splice(i, 1);
  }
  for(let i = P.estrellas.length - 1; i >= 0; i--) if(--P.estrellas[i].t <= 0) P.estrellas.splice(i, 1);
  for(let i = P.textos.length - 1; i >= 0; i--){ const t = P.textos[i]; t.t--; t.y -= 0.25; if(t.t <= 0) P.textos.splice(i, 1); }
  /* restos: cabezas, brazos, armas y escudos que ruedan */
  for(const r of P.restos){
    if(r.suelo && Math.abs(r.vx) < 0.02 && r.sangra <= 0) continue;
    r.vy += GRAV; r.x += r.vx; r.y += r.vy; r.ang += r.va;
    if(r.sangra > 0){ r.sangra--; if(Math.random() < 0.35) gota(P, r.x, r.y, rv(-0.3, 0.3), rv(-0.8, 0)); }
    const piso = r.tipo === 'cab' ? -4 : r.tipo === 'escudo' ? -3 : -1;
    if(r.y > piso){ r.y = piso; if(Math.abs(r.vy) > 1.2){ SON.fx(r.tipo === 'arma' || r.tipo === 'jab' ? 'clavo' : 'cae', {f:0.4}); }
      r.vy *= -0.35; r.vx *= 0.7; r.suelo = true;
      /* lo largo queda acostado en el piso (antes seguía girando y se clavaba de punta) */
      if(r.tipo !== 'cab' && r.tipo !== 'escudo'){ r.ang = Math.cos(r.ang) >= 0 ? 0 : Math.PI; r.va = 0; } else r.va *= 0.6;
      if(r.tipo === 'arma') r.y = -1 - (r.arma.forma === 'hacha' || r.arma.forma === 'maza' ? 2 : 0); }
    const medio = r.tipo === 'arma' ? r.arma.largo/2 : (r.largo || 4)/2;
    if(r.x < PARED + medio){ r.x = PARED + medio; r.vx = Math.abs(r.vx)*0.4; }
    if(r.x > ARENA_W - PARED - medio){ r.x = ARENA_W - PARED - medio; r.vx = -Math.abs(r.vx)*0.4; }
  }
}
/* la sangre queda en la arena: un lienzo del ancho de la arena y 11 filas de hondo */
function manchar(P, x, c){                       /* en píxeles finos: gotas chicas y charcos que crecen */
  const g = P.manchas.getContext('2d'), y = Math.floor(rv(0, 11*DET - 0.1)), xx = Math.round((x + 1)*DET);
  g.fillStyle = c; g.fillRect(xx, y, 1 + (Math.random() < 0.35 ? 1 : 0), 1);
  if(Math.random() < 0.2){ g.fillStyle = '#4a0604'; g.fillRect(xx + 1, y + 1, 1, 1); }
}

/* ================================================================ dibujo en píxeles FINOS
   El contexto del mundo va escalado por DET: las coordenadas siguen en unidades, pero todo se
   redondea a la grilla fina y los grosores se piden en píxeles finos. */
const K = '#1a1210';
function trazo(ctx, a, b, s, col){                       /* s: grosor en píxeles finos */
  const L = Math.hypot(b.x - a.x, b.y - a.y)*DET, n = Math.max(1, Math.ceil(L)), w = s/DET, h = s/2/DET;
  ctx.fillStyle = col;
  for(let i = 0; i <= n; i++){ const t = i/n; ctx.fillRect(rf(a.x + (b.x - a.x)*t - h), rf(a.y + (b.y - a.y)*t - h), w, w); }
}
function trazoCuadros(ctx, a, b, s, c1, c2){
  const L = Math.hypot(b.x - a.x, b.y - a.y)*DET, n = Math.max(1, Math.ceil(L)), w = s/DET, h = s/2/DET;
  for(let i = 0; i <= n; i++){ const t = i/n; ctx.fillStyle = (i >> 1) % 2 ? c1 : c2;
    ctx.fillRect(rf(a.x + (b.x - a.x)*t - h), rf(a.y + (b.y - a.y)*t - h), w, w); }
}
/* un miembro con volumen: contorno de un píxel, relleno, brillo del lado de arriba y sombra abajo */
function miembro(ctx, a, b, s, col, k){
  trazo(ctx, a, b, s + 2, k || K); trazo(ctx, a, b, s, col);
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  let nx = -dy/L, ny = dx/L; if(ny > 0 || (ny === 0 && nx > 0)){ nx = -nx; ny = -ny; }
  const o = (s/2 - 0.5)/DET;
  trazo(ctx, {x:a.x + nx*o, y:a.y + ny*o}, {x:b.x + nx*o, y:b.y + ny*o}, 1, tono(col, 1.22));
  trazo(ctx, {x:a.x - nx*o, y:a.y - ny*o}, {x:b.x - nx*o, y:b.y - ny*o}, 1, tono(col, 0.68));
}
/* un miembro que se afina: ancho en el músculo (s0) y fino en la punta (s1), con su volumen */
function trazoVar(ctx, a, b, s0, s1, col){
  const L = Math.hypot(b.x - a.x, b.y - a.y)*DET, n = Math.max(1, Math.ceil(L)); ctx.fillStyle = col;
  for(let i = 0; i <= n; i++){ const t = i/n, s = Math.round(s0 + (s1 - s0)*t), w = s/DET, h = s/2/DET;
    ctx.fillRect(rf(a.x + (b.x - a.x)*t - h), rf(a.y + (b.y - a.y)*t - h), w, w); }
}
function musculo(ctx, a, b, s0, s1, col){
  trazoVar(ctx, a, b, s0 + 2, s1 + 2, K); trazoVar(ctx, a, b, s0, s1, col);
  const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1;
  let nx = -dy/L, ny = dx/L; if(ny > 0 || (ny === 0 && nx > 0)){ nx = -nx; ny = -ny; }
  const o0 = (s0/2 - 0.5)/DET, o1 = (s1/2 - 0.5)/DET;
  trazo(ctx, {x:a.x + nx*o0, y:a.y + ny*o0}, {x:b.x + nx*o1, y:b.y + ny*o1}, 1, tono(col, 1.2));
  trazo(ctx, {x:a.x - nx*o0, y:a.y - ny*o0}, {x:b.x - nx*o1, y:b.y - ny*o1}, 1, tono(col, 0.68));
}
/* disco en la grilla de unidades (HUD) */
function disco(ctx, x, y, r, col){ ctx.fillStyle = col; const R2 = r*r;
  for(let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++) for(let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++)
    if(dx*dx + dy*dy <= R2) ctx.fillRect(Math.round(x + dx), Math.round(y + dy), 1, 1); }
/* disco en la grilla fina, con luz: r en unidades */
/* horneado una vez por radio y color: pintarlo píxel por píxel en cada cuadro duplicaba el costo */
const _discos = new Map();
function discoF(ctx, x, y, r, col, luz){
  const clave = r + col + (luz ? 1 : 0);
  let c = _discos.get(clave);
  if(!c){ const R = r*DET, R2 = R*R, M = Math.ceil(R); c = document.createElement('canvas'); c.width = c.height = M*2 + 1;
    const g = c.getContext('2d');
    for(let dy = -M; dy <= M; dy++) for(let dx = -M; dx <= M; dx++){
      if(dx*dx + dy*dy > R2) continue;
      let k = col; if(luz){ const l = (-dx - dy)/(R*1.4); k = l > 0.45 ? tono(col, 1.35) : l < -0.45 ? tono(col, 0.65) : col; }
      g.fillStyle = k; g.fillRect(dx + M, dy + M, 1, 1); }
    c.m = M; _discos.set(clave, c); }
  ctx.drawImage(c, (Math.round(x*DET) - c.m)/DET, (Math.round(y*DET) - c.m)/DET, c.width/DET, c.height/DET);
}
function sprite(ctx, spr, x, y, ax, ay, ang, d){          /* spr en píxeles finos; ancla en unidades */
  ctx.save(); ctx.translate(rf(x), rf(y)); ctx.scale(d, 1); if(ang) ctx.rotate(ang);
  ctx.drawImage(spr, -ax, -ay, spr.width/DET, spr.height/DET); ctx.restore(); }

/* un arma píxel por píxel a cualquier ángulo: hoja con acanaladura y filo que brilla, mango
   envuelto en cuero, guarda de bronce, cabezas de hacha y maza con volumen */
function dibujarArma(ctx, m, ang, d, arma, pal){
  const u = {x:d*Math.cos(ang), y:Math.sin(ang)}, n = {x:-u.y*d, y:u.x*d};
  const P2 = (t, s) => ({x:m.x + u.x*t + n.x*(s || 0), y:m.y + u.y*t + n.y*(s || 0)});
  const met = pal ? pal.m : '#dfe4ec', bron = pal ? pal.o : '#e0ae3c', mad = pal ? pal.c : '#8a5a2c', L = arma.largo, f = arma.forma;

  if(f === 'espada' || f === 'sica'){
    const curva = f === 'sica' ? 2.4 : 0, pt = (t, s) => P2(t, (s || 0) + curva*Math.pow(Math.max(0, t - 2)/(L - 2), 2));

    for(let t = 2; t < L; t += 0.5){ const g = t > L - 2.5 ? 3 : 5; trazo(ctx, pt(t), pt(t + 0.5), g, K); }
    for(let t = 2; t < L; t += 0.5){ const g = t > L - 2.5 ? 1 : 3; trazo(ctx, pt(t), pt(t + 0.5), g, met); }

  } else if(f === 'maza'){
    const r = arma.grande ? 3.4 : 2.4, c = P2(L - r);

    const puas = [[1, 1], [1, -1], [-1, 1], [-1, -1], [1.4, 0], [0, 1.4], [0, -1.4], [-1.4, 0]];
    for(const [a, b] of puas) trazo(ctx, c, {x:c.x + a*(r + 1.8), y:c.y + b*(r + 1.8)}, 3, K);
    discoF(ctx, c.x, c.y, r + 0.5, K); discoF(ctx, c.x, c.y, r, tono(met, 0.8), true);

    trazo(ctx, P2(-7), P2(L - 5), 4, K); trazo(ctx, P2(-7), P2(L - 5), 2, mad); trazo(ctx, P2(-7, -0.25), P2(L - 5, -0.25), 1, tono(mad, 1.3));
    if(f === 'lanza'){
      for(let t = L - 5; t < L; t += 0.25){ const w = t < L - 2 ? 1.1 : 1.1*(L - t)/2; trazo(ctx, P2(t, -w), P2(t, w), 3, K); }
      for(let t = L - 5; t < L - 0.3; t += 0.25){ const w = t < L - 2 ? 0.8 : 0.8*(L - t)/2; trazo(ctx, P2(t, -w), P2(t, 0), 1, '#ffffff'); trazo(ctx, P2(t, 0), P2(t, w), 1, tono(met, 0.75)); }

    } else {
      trazo(ctx, P2(L - 5, -3.2), P2(L - 5, 3.2), 4, K);
      for(const s of [-3, 0, 3]){ trazo(ctx, P2(L - 5, s), P2(L - 0.5, s), 4, K); trazo(ctx, P2(L - 0.5, s), P2(L + 0.5, s), 2, K); }

/* ================================================================ el gladiador */
function rodilla(a, b, d, k){ return {x:(a.x + b.x)/2 + d*k, y:(a.y + b.y)/2}; }
function dibujarGlad(ctx, g, ox, oy, estatua){
  const sk = esqueleto(g), d = sk.d, pz = piezas(g.def, estatua), pal = pz.pal;

  const resp = g.suelo && !g.ataque && !g.caido && !g.muerto && !g.carga ? Math.sin(J.t*0.07 + (g.fase || 0))*0.45 : 0;
  const T = p => ({x:p.x + ox, y:p.y + oy}), Tr = p => ({x:p.x + ox, y:p.y + oy + resp});
  const H = T(sk.H), S = Tr(sk.S), S2 = Tr(sk.S2), N = Tr(sk.N), sangre = '#8a0c08';

    if(g.cortado[id]){ discoF(ctx, H.x, H.y + 1, 1.3, sangre, true); return; }
    const F = T(pie), R = rodilla(H, F, d, g.suelo && !g.caido && !g.muerto ? kb : 1.5);
    const piel = atras ? tono(pal.p, 0.84) : pal.p;
    musculo(ctx, H, R, 6, 4, piel);                                   /* muslo: ancho arriba */
    /* pantorrilla: se abulta abajo de la rodilla y se afina al tobillo */
    const P1 = {x:R.x + (F.x - R.x)*0.35, y:R.y + (F.y - R.y)*0.35};
    if(g.def.eq.grebas){ const m = atras ? tono(pal.m, 0.85) : pal.m; musculo(ctx, R, P1, 4, 5, m); musculo(ctx, P1, F, 5, 3, m); discoF(ctx, R.x, R.y, 1.1, pal.o, true); }
    else { musculo(ctx, R, P1, 4, 5, piel); musculo(ctx, P1, F, 5, 3, piel); discoF(ctx, R.x, R.y, 0.8, piel, true);
      trazo(ctx, {x:F.x - 0.9, y:F.y - 2.2}, {x:F.x + 0.9, y:F.y - 2.2}, 1, pal.C); trazo(ctx, {x:F.x - 0.9, y:F.y - 1.3}, {x:F.x + 0.9, y:F.y - 1.3}, 1, pal.C); }

    trazo(ctx, {x:x0, y:F.y - 0.6}, {x:x1 - d*0.4, y:F.y - 0.6}, 1, piel);
    trazo(ctx, {x:x0, y:F.y}, {x:x1, y:F.y}, 1, pal.C);

  };
  const brazo = (b, id, desde, manica, atras) => {
    if(g.cortado[id]){ discoF(ctx, desde.x, desde.y, 1.2, sangre, true); return; }
    const C = Tr(b.codo), M = Tr(b.mano), piel = atras ? tono(pal.p, 0.84) : pal.p;
    discoF(ctx, desde.x, desde.y, 1.7, K); discoF(ctx, desde.x, desde.y, 1.3, piel, true);   /* hombro */
    musculo(ctx, desde, C, 5, 3, piel);                                /* brazo: bíceps que se afina al codo */
    if(manica){ trazoVar(ctx, C, M, 6, 5, K); trazoCuadros(ctx, C, M, 4, pal.a, pal.A); trazo(ctx, {x:C.x, y:C.y - 1/DET}, {x:M.x, y:M.y - 1/DET}, 1, tono(pal.a, 1.25)); }
    else musculo(ctx, C, M, 4, 3, piel);                               /* antebrazo: ancho abajo del codo, fino en la muñeca */
    discoF(ctx, M.x, M.y, 1.3, K); discoF(ctx, M.x, M.y, 0.9, piel, true);   /* puño */

  if(g.enredado > 0){ const c = T(sk.N);
    for(let i = -6; i <= 6; i += 2){ trazo(ctx, {x:c.x - 7, y:c.y + i}, {x:c.x + 7, y:c.y + i + 3}, 1, '#e4dab8'); trazo(ctx, {x:c.x + i, y:c.y - 7}, {x:c.x + i + 3, y:c.y + 9}, 1, '#b8ac88'); } }
}
function dibujarRestos(ctx, P, ox, oy){

      if(r.tipo === 'cab'){ discoF(ctx, x + Math.sin(r.ang)*3, y + Math.cos(r.ang)*3, 1, '#8a0c08'); } }
    else if(r.tipo === 'arma') dibujarArma(ctx, {x, y}, r.ang, 1, r.arma);

function dibujarProy(ctx, P, ox, oy){
  for(const j of P.proy){

    if(j.tipo === 'red'){ if(!j.vivo) continue; const g = j.giro || 0, c = Math.cos(g), s = Math.sin(g);
      for(let i = -2; i <= 2; i++){ trazo(ctx, {x:x - 6*c + i*2.5*s, y:y - 6*s - i*2.5*c}, {x:x + 6*c + i*2.5*s, y:y + 6*s - i*2.5*c}, 1, '#e4dab8');

function dibujarEfectos(ctx, P, ox, oy){

/* ================================================================ el coliseo (fondos cacheados en píxeles finos)
   Cielo tramado de tarde con nubes sombreadas, una arcada con pilastras y dovelas, gradas con
   escalones y público de cabeza y cuerpo, estandartes, el palco imperial con columnas y toldo,
   sillares del podio con luz y sombra, el friso de meandros, rejas con remaches, arena con granos
   y piedritas, y abajo el hipogeo. */
const FONDO = {cache:null};
function lienzoFino(w, h){ const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w*DET)); c.height = Math.max(1, Math.round(h*DET)); return c; }
function armarFondo(){
  const W = AM + ARENA_W + 40, rG = mulberry(777), D = DET;
  const px = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  /* cielo: degradé en bandas con trama 2×2 entre bandas */
  const cielo = lienzoFino(AM, SUELO), gc = cielo.getContext('2d'), CW = cielo.width, CH = cielo.height;
  const claves = [[0, [44, 70, 140]], [0.35, [120, 110, 150]], [0.6, [216, 138, 80]], [1, [244, 196, 128]]];
  const img = gc.createImageData(CW, CH);
  for(let y = 0; y < CH; y++){ const t = y/CH; let i = 0; while(i < claves.length - 2 && t > claves[i + 1][0]) i++;
    const [t0, c0] = claves[i], [t1, c1] = claves[i + 1], f = lim((t - t0)/(t1 - t0), 0, 1);
    for(let x = 0; x < CW; x++){ const q = f*12, b = Math.floor(q), fr = q - b, sube = fr > [0.2, 0.7, 0.45, 0.95][(x & 1) + ((y & 1) << 1)] ? 1 : 0;
      const k = (b + sube)/12, o = (y*CW + x)*4;
      for(let c = 0; c < 3; c++) img.data[o + c] = c0[c] + (c1[c] - c0[c])*k; img.data[o + 3] = 255; } }
  gc.putImageData(img, 0, 0);
  for(let i = 0; i < 6; i++){ const x = Math.round(rG()*CW), y = Math.round((6 + rG()*30)*D), w = Math.round((16 + rG()*22)*D);
    px(gc, x, y, w, 3, '#f4dcc0'); px(gc, x + 6, y - 3, w - 16, 3, '#fae8d4'); px(gc, x + 2, y + 3, w - 4, 2, '#c89a8a'); px(gc, x + 10, y - 5, w - 30, 2, '#fff2e4'); }
  /* gradas */
  const altoG = SUELO - 24, top = Math.max(10, SUELO - 128);
  const gradas = lienzoFino(W, SUELO), g = gradas.getContext('2d'), GW = gradas.width, T = top*D, AG = altoG*D;
  px(g, 0, T, GW, AG - T, '#8a6a4a');
  /* arcada del piso alto: pilastras con luz y sombra, arcos con dovelas */
  px(g, 0, T - 4, GW, 4, '#c4a47c'); px(g, 0, T - 4, GW, 1, '#e4c8a0'); px(g, 0, T - 1, GW, 1, '#6a4a30');
  for(let x = 0; x < GW; x += 24){
    px(g, x, T, 24, 34, '#b0906a'); px(g, x, T, 24, 1, '#d4b48c');
    px(g, x + 6, T + 10, 12, 24, '#2c1a10'); px(g, x + 7, T + 8, 10, 2, '#2c1a10'); px(g, x + 8, T + 7, 8, 1, '#2c1a10');
    px(g, x + 6, T + 7, 1, 3, '#d4b48c'); px(g, x + 17, T + 7, 1, 3, '#7a5a3a');
    for(let k = 0; k < 5; k++){ px(g, x + 7 + k*2, T + 5 - (k === 2 ? 1 : 0), 1, 2, '#8a6a4a'); }
    px(g, x + 8, T + 22, 8, 12, '#3a2418'); px(g, x + 9, T + 18, 1, 16, '#4a3020');
    px(g, x + 1, T + 1, 2, 33, '#c8a880'); px(g, x + 21, T + 1, 2, 33, '#8a6a4a');
  }
  px(g, 0, T + 34, GW, 2, '#5a3e28'); px(g, 0, T + 36, GW, 1, '#a88a64');
  /* estandartes en la arcada */
  for(let x = 30; x < GW; x += 150){ px(g, x, T - 20, 1, 24, '#4a3020'); px(g, x + 1, T - 18, 10, 14, '#b02a20'); px(g, x + 1, T - 18, 10, 1, '#e04a38');
    px(g, x + 4, T - 14, 4, 4, '#e8b840'); px(g, x + 1, T - 5, 3, 2, '#b02a20'); px(g, x + 8, T - 5, 3, 2, '#b02a20'); }
  /* filas: escalón con canto claro y sombra, y gente horneada */
  const colores = ['#c83a28','#e8e0c8','#3a6ab0','#d8a030','#6a8a3a','#8a4a8a','#f0f0e8','#a86a3a','#e07040','#4a8a8a'];
  const pelo = ['#2a1a10','#4a2c16','#8a5a2a','#c8a060','#bcbcbc'];
  for(let y = T + 40, fila = 0; y < AG - 4; y += 10, fila++){
    px(g, 0, y + 6, GW, 3, fila % 2 ? '#9c7a54' : '#94724e'); px(g, 0, y + 6, GW, 1, '#b8966c'); px(g, 0, y + 9, GW, 1, '#5a3e28');
    if(fila === 5){ px(g, 0, y, GW, 6, '#5a3e28'); px(g, 0, y, GW, 1, '#3a2418');
      for(let x = 40; x < GW; x += 120){ px(g, x, y - 12, 14, 18, '#1c100a'); px(g, x + 2, y - 14, 10, 2, '#1c100a'); px(g, x - 1, y - 13, 1, 19, '#b8966c'); } continue; }

function icono(nombre, col, espejo, vertical){

  const g = c.getContext('2d'), en = (x, y) => y >= 0 && y < h && x >= 0 && x < w && (gr[y][espejo ? w - 1 - x : x] === '#');
  g.fillStyle = K; for(let y = -1; y <= h; y++) for(let x = -1; x <= w; x++){ let n = false;

/* ================================================================ entrada: toque, mouse y teclado
   Los botones son zonas del HUD (en píxeles de mundo). Cada dedo se sigue por su identifier. Con
   «gestos», la mitad derecha es un pad: tocar = golpe rápido, deslizar arriba/abajo/hacia el
   rival = tajo, barrido y estocada, deslizar para atrás o dejar apretado = guardia. */
const IN = {}, EDGE = {};
let ZONAS = {};
function armarZonas(){
  const cy = AH - 40, cx = AM - 36, d = 23;
  ZONAS = {
    izq:{x:18, y:cy, r:15}, der:{x:50, y:cy, r:15},
    postura:{x:18, y:cy - 34, r:9}, jab:{x:50, y:cy - 34, r:9},
    arriba:{x:cx, y:cy - d, r:11}, abajo:{x:cx, y:cy + d, r:11}, estocada:{x:cx + d, y:cy, r:11},
    guardia:{x:cx - d, y:cy, r:11}, rapido:{x:cx, y:cy, r:11},
    pausa:{x:AM >> 1, y:34, r:8}

}
const toques = new Map();
function zonaEn(wx, wy){
  if(AJ.controles === 'gestos' && wx > AM*0.45 && wy > SUELO + 8) return 'pad';
  let mejor = null, md = 1e9;
  for(const k in ZONAS){ const z = ZONAS[k], d = Math.hypot(wx - z.x, wy - z.y); if(d < z.r + 4 && d < md){ md = d; mejor = k; } }
  return mejor;
}
function tocarIni(id, cx, cy){
  if(J.modo !== 'pelea' || !J.pelea) return;
  const wx = cx/ES, wy = cy/ES, z = zonaEn(wx, wy);
  if(!z) return;
  if(z === 'pausa'){ pausar(); return; }
  toques.set(id, {z, x0:cx, y0:cy, t0:performance.now(), mov:false});
  if(z !== 'pad'){ IN[z] = true; EDGE[z] = true; }
}
function tocarMov(id, cx, cy){ const t = toques.get(id); if(!t || t.z !== 'pad') return;
  if(Math.hypot(cx - t.x0, cy - t.y0) > 14) t.mov = true;
  if(!t.mov && performance.now() - t.t0 > 260) IN.guardia = true; }
function tocarFin(id, cx, cy){
  const t = toques.get(id); if(!t) return; toques.delete(id);

  const dx = cx - t.x0, dy = cy - t.y0, dist = Math.hypot(dx, dy);

  IN.guardia = false;
  const P = J.pelea, dir = P ? P.a.dir : 1;

  for(const t of e.changedTouches) tocarIni(t.identifier, t.clientX, t.clientY); }, {passive:false});
addEventListener('touchmove', e => { if(J.modo !== 'pelea') return; if(e.target === lienzo) e.preventDefault();
  for(const t of e.changedTouches) tocarMov(t.identifier, t.clientX, t.clientY); }, {passive:false});
const finToque = e => { for(const t of e.changedTouches) tocarFin(t.identifier, t.clientX, t.clientY); };
addEventListener('touchend', finToque, {passive:true}); addEventListener('touchcancel', finToque, {passive:true});

lienzo.addEventListener('mousedown', e => { SON.arrancar(); mouseAbajo = true; tocarIni('m', e.clientX, e.clientY); });

const TECLAS = {KeyA:'izq', KeyD:'der', ArrowUp:'arriba', KeyI:'arriba', ArrowDown:'abajo', KeyK:'abajo', ArrowRight:'estocada', KeyL:'estocada',
  ArrowLeft:'guardia', KeyU:'guardia', Space:'rapido', KeyJ:'rapido', KeyQ:'postura', KeyE:'jab', Escape:'pausa'};

/* ================================================================ la pelea */
function nuevaPelea(defA, defB, modo, opc){
  opc = opc || {};

  const P = {modo, opc, a:nuevoLuchador(defA, 52, 1, modo !== 'demo', opc.difA || 0.6), b:nuevoLuchador(defB, ARENA_W - 52, -1, false, opc.dif === undefined ? 0.5 : opc.dif),
    part:[], restos:[], proy:[], estrellas:[], textos:[], manchas:man, t:0, fin:0, ganador:null, quieto:0};
  /* los carteles no se enciman: el nuevo sube por encima de los que siguen vivos cerca */
  P.textos.push = function(o){ for(const t of this) if(Math.abs(t.x - o.x) < 40 && Math.abs(t.y - o.y) < 10) o.y = t.y - 10; return Array.prototype.push.call(this, o); };

}

  if(P.t > 70 && !P.fin){ if(a.jug) controlJugador(a); else pensar(a, b); pensar(b, a); }
  else { Object.assign(a.ctrl, neutro); Object.assign(b.ctrl, neutro); }
  if(P.fin){ if(!a.muerto) Object.assign(a.ctrl, neutro); if(!b.muerto) Object.assign(b.ctrl, neutro); }
  pasoLuchador(a, b, P); pasoLuchador(b, a, P);
  empujarCuerpos(a, b);
  const ska = esqueleto(a), skb = esqueleto(b);
  for(const [A, B, sA, sB] of [[a, b, ska, skb], [b, a, skb, ska]]){
    const w1 = armaDe(A), w2 = arma2De(A);
    if(w1) probarHoja(A, B, P, sA, sB, sA.bA, w1, 1);
    if(w2) probarHoja(A, B, P, sA, sB, sA.bE, w2, 2);

  pasoProyectiles(P); pasoEfectos(P);
  J.emocion *= 0.996;

    if(P.modo !== 'demo') SON.fx('fanfarria', {triste:P.ganador !== a});

/* ================================================================ ciclo a paso fijo (60 Hz) */
const CUADRO = 1000/60;
let acum = 0, ultimo = 0;
function pasar(){
  J.t++;
  if(J.pelea && !J.pausa) pasoPelea(J.pelea);
  if(J.sacude > 0) J.sacude *= 0.86;
  soltarEntrada();
}
function dibujar(){
  const P = J.pelea;
  cxM.setTransform(DET, 0, 0, DET, 0, 0);                  /* el mundo va en unidades, dibujado en la grilla fina */
  cxM.fillStyle = '#140c08'; cxM.fillRect(0, 0, AM, AH);
  const sx = J.sacude > 0.3 ? rv(-J.sacude, J.sacude) : 0, sy = J.sacude > 0.3 ? rv(-J.sacude, J.sacude)*0.6 : 0;
  const cam = rf((J.camX || 0) + sx);
  cxM.save(); cxM.translate(0, rf(sy));
  dibujarFondo(cxM, cam);
  if(P){
    cxM.drawImage(P.manchas, -cam - 1, SUELO, P.manchas.width/DET, P.manchas.height/DET);
    const ox = -cam, oy = SUELO;
    dibujarRestos(cxM, P, ox, oy);
    dibujarGlad(cxM, P.b, ox, oy); dibujarGlad(cxM, P.a, ox, oy);
    dibujarProy(cxM, P, ox, oy);
    dibujarEfectos(cxM, P, ox, oy);
  }
  cxM.restore();
  cxP.setTransform(1, 0, 0, 1, 0, 0);
  cxP.drawImage(cvM, 0, 0, AM*PXd, AH*PXd);
  hud();
  cxP.drawImage(cvH, 0, 0, AM*PXd, AH*PXd);
}
function bucle(ts){
  requestAnimationFrame(bucle);
  const dt = Math.min(100, ts - (ultimo || ts)); ultimo = ts; acum += dt;
  let n = 0;
  while(acum >= CUADRO && n < 4){ acum -= CUADRO; n++;
    if(J.congelado > 0){ J.congelado--; J.t++; continue; }     /* golpe que frena: no consume la entrada */
    pasar(); }
  if(J.t % 15 === 0 && (lienzo.width !== Math.round((lienzo.clientWidth || innerWidth)*Math.min(devicePixelRatio || 1, 3)))) medir();
  SON.cuadro();
  try { dibujar(); } catch(e){ if(!bucle.err){ bucle.err = e; console.error(e); } }
}

            usa:d => d.eq.arma === k, pon:d => { d.eq.arma = k; if(d.eq.segunda) d.eq.segunda = ARMAS[k].grande ? null : k; }})),
  escudos:() => Object.keys(ESCUDOS).map(k => ({k, n:ESCUDOS[k].n, precio:ESCUDOS[k].precio, info:k === 'ninguno' ? 'las dos manos libres' : 'cubre ' + ESCUDOS[k].medio*2 + ' px · PESO ' + ESCUDOS[k].peso,
            usa:d => d.eq.escudo === k, pon:d => { d.eq.escudo = k; if(k !== 'ninguno') d.eq.segunda = null; }})),
  cascos: () => Object.keys(CASCOS).map(k => ({k, n:CASCOS[k].n, precio:CASCOS[k].precio, info:'PROTEGE ' + Math.round(CASCOS[k].prot*100) + '% LA CABEZA', usa:d => d.eq.casco === k, pon:d => { d.eq.casco = k; }})),
  corazas:() => Object.keys(CORAZAS).map(k => ({k, n:CORAZAS[k].n, precio:CORAZAS[k].precio, info:'PROTEGE ' + Math.round(CORAZAS[k].prot*100) + '% EL TORSO', usa:d => d.eq.torso === k, pon:d => { d.eq.torso = k; }})),
  otros:  () => [
    {k:'manica', n:'MANICA', precio:160, info:'30% EN EL BRAZO DEL ARMA', usa:d => d.eq.manica, pon:d => { d.eq.manica = true; }},
    {k:'grebas', n:'GREBAS', precio:160, info:'30% EN LAS PIERNAS', usa:d => d.eq.grebas, pon:d => { d.eq.grebas = true; }},
    {k:'jab', n:'JABALINA', precio:60, info:'UNA MÁS PARA TIRAR (HASTA 3)', usa:d => d.jab >= 3, pon:d => { d.jab = Math.min(3, d.jab + 1); }, cuenta:d => d.jab},
    {k:'red', n:'RED', precio:80, info:'ENREDA AL RIVAL (HASTA 2)', usa:d => d.red >= 2, pon:d => { d.red = Math.min(2, d.red + 1); }, cuenta:d => d.red}]
};
function mercado(tab){
  const C = J.carrera, d = C.def; J.modo = 'menu'; limpiar(true);
  const cab = el('div', 'fila2');
  for(const [k, n] of [['armas', 'ARMAS'], ['escudos', 'ESCUDOS'], ['cascos', 'CASCOS'], ['corazas', 'CORAZAS'], ['otros', 'OTROS']])
    cab.append(btn(n, () => mercado(k), tab === k ? 'oro chico' : 'gris chico'));
  const p = el('div', 'panel'); const top = el('div', 'fila'); top.style.cursor = 'default';
  top.append(retrato(d, 2), el('div', 'info', '<b>' + d.nombre + '</b><br><b>' + d.monedas + ' $</b><br>' + equipoTxt(d)));
  p.append(top);
  const aviso = el('div', 'aviso');
  for(const it of TIENDA[tab]()){
    const usa = it.usa(d), puede = d.monedas >= it.precio;
    const f = el('div', 'fila' + (usa ? ' sel' : puede ? '' : ' no'));
    f.append(el('div', 'info', '<b>' + it.n + '</b>' + (it.cuenta ? ' (' + it.cuenta(d) + ')' : '') + '<br>' + it.info));
    f.append(el('div', 'precio', usa ? 'EN USO' : it.precio ? it.precio + ' $' : 'GRATIS'));
    f.addEventListener('click', () => { if(usa){ return; } if(!puede){ SON.fx('negado'); aviso.textContent = 'No te alcanza.'; return; }
      d.monedas -= it.precio; it.pon(d); SON.fx('moneda'); guardar('saltos.carrera', C); mercado(tab); });
    p.append(f);
  }
  dMenu.append(cab, p, aviso, btn('VOLVER', ludus, 'gris'));
}

/* ----- pelea rápida ----- */
const RAP = {yo:0, el:-1, dif:1};
function rapida(){
  J.modo = 'menu'; limpiar(true);
  const p = el('div', 'panel'); p.append(pixelTxt('PELEA RÁPIDA', 'oro', 2));
  const selector = (tit, get, set, n) => { const f = el('div', 'fila'); f.style.cursor = 'default';
    const menos = btn('◀', () => { set(-1); rapida(); }, 'gris chico'), mas = btn('▶', () => { set(1); rapida(); }, 'gris chico');
    f.append(menos, el('div', 'info', '<b>' + tit + '</b><br>' + get()), mas); return f; };
  p.append(selector('VOS', () => nomClase(ORDEN_CLASES[RAP.yo]) + '<br>' + CLASES[ORDEN_CLASES[RAP.yo]].desc, s => { RAP.yo = (RAP.yo + s + 7) % 7; }));
  p.append(selector('RIVAL', () => RAP.el < 0 ? 'AL AZAR' : nomClase(ORDEN_CLASES[RAP.el]), s => { RAP.el = ((RAP.el + 1 + s + 8) % 8) - 1; }));
  p.append(selector('DIFICULTAD', () => ['FÁCIL', 'NORMAL', 'DIFÍCIL'][RAP.dif], s => { RAP.dif = (RAP.dif + s + 3) % 3; }));
  dMenu.append(p, btn('¡A LA ARENA!', () => { J.modo = 'pelea'; SON.modo('pelea'); dMenu.className = '';
    const yo = crearDef(ORDEN_CLASES[RAP.yo], 5), el2 = crearDef(RAP.el < 0 ? elegir(ORDEN_CLASES) : ORDEN_CLASES[RAP.el], 3 + RAP.dif*3);
    nuevaPelea(yo, el2, 'rapida', {dif:[0.25, 0.55, 0.9][RAP.dif]}); }, 'oro'), btn('VOLVER', portada, 'gris'));
}
function resultadoRapida(P){
  J.modo = 'menu'; SON.modo('menu'); limpiar(false);
  const gano = P.ganador === P.a;
  dMenu.append(pixelTxt(gano ? '¡VICTORIA!' : P.ganador === 'nadie' ? 'EMPATE' : 'DERROTA', gano ? 'oro' : 'rojo', 3),
    btn('OTRA', () => { rapida(); }, 'oro'), btn('MENÚ', portada, 'gris'));
}

/* ----- pausa, estatuas, ajustes, ayuda ----- */
function pausar(){
  if(J.modo !== 'pelea' || !J.pelea || J.pelea.fin) return;
  J.pausa = true; for(const k in IN) IN[k] = false; limpiar(false);
  const car = J.pelea.modo === 'carrera';
  dMenu.append(pixelTxt('PAUSA', 'oro', 3), btn('SEGUIR', () => { J.pausa = false; dMenu.className = ''; }, 'oro'),
    btn(car ? 'ENTREGARSE' : 'ABANDONAR', () => { if(car) confirmar('Entregarse es morir: el público no perdona.', () => { J.pausa = false; morir(J.pelea.a, J.pelea, 'muerto'); dMenu.className = ''; J.modo = 'pelea'; });
      else { J.pausa = false; portada(); } }, 'gris'));
}
function estatuas(){
  J.modo = 'menu'; limpiar(true);
  const p = el('div', 'panel'); p.append(pixelTxt('SALÓN DE ESTATUAS', 'oro', 2));
  if(!J.estatuas.length) p.append(el('div', 'texto', 'Todavía no hay nadie. Los gladiadores que caigan o se retiren van a quedar acá, en piedra.'));
  for(const s of J.estatuas){ const d = s.def, f = el('div', 'fila'); f.style.cursor = 'default';
    f.append(retrato(d, 2, true), el('div', 'info', '<b>' + d.nombre + '</b>' + (s.campeon ? ' · CAMPEÓN' : '') + '<br>' + nomClase(d.clase) + ' · ' + d.edad + ' años<br>' + d.ganadas + ' victorias · FAMA ' + d.fama + '<br>' +
      (s.causa === 'MUERTO' ? 'Cayó ante ' + (s.asesino || 'la arena') : 'Se retiró con vida')));
    p.append(f); }
  dMenu.append(p, btn('VOLVER', portada, 'gris'));
}
function ajustes(){
  J.modo = 'menu'; limpiar(true);
  const p = el('div', 'panel'); p.append(pixelTxt('AJUSTES', 'oro', 2));
  const op = (tit, val, fn) => { const f = el('div', 'fila'); f.append(el('div', 'info', '<b>' + tit + '</b>'), el('div', 'precio', val)); f.addEventListener('click', () => { fn(); guardar('saltos.ajustes', AJ); SON.fx('clic'); ajustes(); }); return f; };
  p.append(op('SANGRE', AJ.sangre.toUpperCase(), () => { AJ.sangre = {mucha:'poca', poca:'nada', nada:'mucha'}[AJ.sangre]; }));
  p.append(op('SONIDO', AJ.sonido ? 'SÍ' : 'NO', () => { AJ.sonido = !AJ.sonido; }));
  p.append(op('CONTROLES', AJ.controles === 'botones' ? 'BOTONES' : 'GESTOS', () => { AJ.controles = AJ.controles === 'botones' ? 'gestos' : 'botones'; }));
  p.append(op('VIBRAR', AJ.vibrar ? 'SÍ' : 'NO', () => { AJ.vibrar = !AJ.vibrar; }));
  if(J.carrera) p.append(op('BORRAR CARRERA', J.carrera.def.nombre.split(' ')[0], () => { J.carrera = null; guardar('saltos.carrera', null); }));
  dMenu.append(p, btn('VOLVER', portada, 'gris'));
}
function ayuda(){
  J.modo = 'menu'; limpiar(true);
  const p = el('div', 'panel'); p.append(pixelTxt('CÓMO SE JUEGA', 'oro', 2));
  p.append(el('div', 'texto', 'Tu gladiador no camina: <b>salta</b>. Mantené ◀ o ▶ para cargar y soltá: cuanto más cargás, más lejos va.<br><br>' +
    'A la derecha, los golpes: <b>▲</b> tajo de arriba · <b>▼</b> barrido bajo · <b>la espada</b> estocada hacia el rival · <b>el círculo</b> golpe rápido · <b>el escudo</b> mantené para cubrirte.<br><br>' +
    '<b>Las dos flechas</b> de arriba a la izquierda cambian la postura: alta pega más fuerte, baja es más rápida y cubre más. La lanza tira la jabalina (o la red).<br><br>' +
    'Cada parte del cuerpo tiene su vida: una cabeza o un torso deshechos matan, un brazo cortado suelta el arma, una pierna cortada casi no te deja saltar. Y la sangre se va.<br><br>' +
    'En la <b>carrera</b> cada victoria da monedas, fama y un punto para entrenar. Con los años se pierde fuerza. Si morís, no hay vuelta: queda tu estatua.<br><br>' +
    'Teclado: A/D saltan · ↑ ↓ → golpean · ← cubre · espacio rápido · Q postura · E jabalina.'));
  dMenu.append(p, btn('VOLVER', portada, 'gris'));
}

/* ================================================================ sondas para el banco */
window.__S = {
  J, AJ, CLASES, ARMAS, ORDEN_CLASES, ZONAS:() => ZONAS, IN, EDGE,
  medida:() => ({AM, AH, PXd, ES, SUELO, CSSW, CSSH, lienzo:[lienzo.width, lienzo.height]}),
  anda(n){ for(let i = 0; i < (n || 60); i++){ if(J.congelado > 0){ J.congelado--; J.t++; continue; } pasar(); } dibujar(); return this.est(); },
  est(){ const P = J.pelea; if(!P) return {modo:J.modo};
    const f = g => ({x:+g.x.toFixed(1), y:+g.y.toFixed(1), ang:+g.ang.toFixed(2), vida:+vidaDe(g).toFixed(2), sangre:+g.sangre.toFixed(1), muerto:g.muerto, caido:g.caido,
      cortado:Object.keys(g.cortado), golpes:g.golpes, dano:+g.dano.toFixed(1), jab:g.jab, ataque:g.ataque ? g.ataque.tipo : null, nan:!isFinite(g.x + g.y + g.ang + g.a)});
    return {modo:J.modo, t:P.t, fin:P.fin, ganador:P.ganador === P.a ? 'a' : P.ganador === P.b ? 'b' : P.ganador, a:f(P.a), b:f(P.b), part:P.part.length, restos:P.restos.length, proy:P.proy.length}; },
  pelea(cA, cB, dif, modo){ const P = nuevaPelea(crearDef(cA, 5), crearDef(cB, 5), modo || 'rapida', {dif:dif === undefined ? 0.6 : dif, difA:0.6}); J.modo = 'pelea'; dMenu.className = ''; return P.t; },
  iaVsIa(){ const P = J.pelea; P.a.jug = false; P.a.dif = 0.6; return true; },
  semilla(s){ rnd = mulberry(semilla32(String(s))); },
  dibujarYa(){ dibujar(); }, portada, reclutas, ludus, mercado, rivalesPant, ajustes, estatuas, rapida, ayuda,
  dmenu:() => dMenu.innerText, listo:true
};

/* ================================================================ arranque */
medir();
portada();
requestAnimationFrame(bucle);
})();
</script>
</body>
